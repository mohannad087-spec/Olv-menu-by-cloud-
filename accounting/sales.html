<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المبيعات — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .addon-row{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .addon-row label{flex:1; font-size:13.5px;}
  .addon-row .a-price{color:var(--muted); font-size:12.5px;}
  .cart-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--hair-soft,rgba(201,162,75,.1)); font-size:13.5px;}
  .cart-item .meta{color:var(--muted); font-size:12px;}
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="group">
      <h2>إضافة أصناف مباعة</h2>
      <div class="row2">
        <div class="field">
          <label>الصنف</label>
          <select id="product-select"></select>
        </div>
        <div class="field">
          <label>الكمية</label>
          <input type="number" id="qty-input" min="1" value="1">
        </div>
      </div>
      <div id="addon-picker"></div>
      <button class="btn gold" id="add-line-btn">إضافة للسلة</button>
    </div>

    <div class="group" id="cart-group" hidden>
      <h2>السلة</h2>
      <div id="cart-list"></div>
      <div class="row2" style="margin-top:14px;">
        <div class="field">
          <label>التاريخ</label>
          <input type="date" id="entry_date">
        </div>
        <div class="field">
          <label>طريقة الدفع</label>
          <select id="pay-method">
            <option value="cash">كاش</option>
            <option value="card">شبكة / فيزا</option>
            <option value="delivery">توصيل / تطبيقات</option>
          </select>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>الإجمالي: <b id="cart-total">0.00</b></div>
        <button class="btn gold" id="save-btn">حفظ المبيعات</button>
      </div>
    </div>

    <div class="group">
      <h2>سجل المبيعات</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>كاش</th><th>شبكة</th><th>توصيل</th><th>الإجمالي</th><th>ملاحظات</th><th></th></tr></thead>
          <tbody id="sales-body">
            <tr class="empty-row"><td colspan="7">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/sale-cart.js"></script>
  <script>
    olvRenderNav("sales");

    let products = [];
    let addons = [];

    function renderAddonPicker() {
      const el = document.getElementById("addon-picker");
      if (!addons.length) { el.innerHTML = ""; return; }
      el.innerHTML = addons.map((a) => `
        <div class="addon-row">
          <input type="checkbox" data-addon="${a.id}" id="sa-${a.id}">
          <label for="sa-${a.id}">${a.name}</label>
          <span class="a-price">+${olvFormatMoney(a.price)}</span>
        </div>
      `).join("");
    }

    function selectedAddons() {
      return addons.filter((a) => document.getElementById(`sa-${a.id}`)?.checked);
    }

    function renderCart() {
      const cart = OlvCart.all();
      const group = document.getElementById("cart-group");
      const list = document.getElementById("cart-list");
      if (!cart.length) { group.hidden = true; return; }
      group.hidden = false;
      list.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div>
            <div>${item.qty}× ${item.name}</div>
            ${item.addons.length ? `<div class="meta">+ ${item.addons.map((a) => a.name).join("، ")}</div>` : ""}
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span>${olvFormatMoney(OlvCart.lineTotal(item))}</span>
            <button class="btn small danger" data-idx="${idx}">حذف</button>
          </div>
        </div>
      `).join("");
      list.querySelectorAll("button[data-idx]").forEach((btn) => {
        btn.addEventListener("click", () => { OlvCart.removeAt(Number(btn.dataset.idx)); renderCart(); });
      });
      document.getElementById("cart-total").textContent = olvFormatMoney(OlvCart.total());
    }

    document.getElementById("add-line-btn").addEventListener("click", () => {
      const productId = document.getElementById("product-select").value;
      const product = products.find((p) => p.id === productId);
      if (!product) return;
      const qty = Math.max(1, Number(document.getElementById("qty-input").value || 1));
      OlvCart.add(product, selectedAddons(), qty);
      document.getElementById("qty-input").value = 1;
      addons.forEach((a) => { const cb = document.getElementById(`sa-${a.id}`); if (cb) cb.checked = false; });
      renderCart();
    });

    document.getElementById("save-btn").addEventListener("click", async () => {
      const errBox = document.getElementById("err");
      errBox.style.display = "none";
      const btn = document.getElementById("save-btn");
      btn.disabled = true;
      try {
        const method = document.getElementById("pay-method").value;
        const entryDate = document.getElementById("entry_date").value || olvToday();
        await OlvCart.checkout({ paymentMethod: method, entryDate });
        renderCart();
        await loadSales();
      } catch (err) {
        olvShowError(errBox, err);
      } finally {
        btn.disabled = false;
      }
    });

    async function loadSales() {
      const errBox = document.getElementById("err");
      const body = document.getElementById("sales-body");
      try {
        const { data, error } = await window.supabaseClient
          .from("sales_entries").select("*").order("entry_date", { ascending: false }).limit(60);
        if (error) throw error;
        if (!data || !data.length) {
          body.innerHTML = `<tr class="empty-row"><td colspan="7">لا يوجد مبيعات مسجّلة بعد</td></tr>`;
          return;
        }
        body.innerHTML = data.map((r) => {
          const total = Number(r.cash_amount) + Number(r.card_amount) + Number(r.delivery_amount);
          return `<tr>
            <td>${r.entry_date}</td>
            <td>${olvFormatMoney(r.cash_amount)}</td>
            <td>${olvFormatMoney(r.card_amount)}</td>
            <td>${olvFormatMoney(r.delivery_amount)}</td>
            <td>${olvFormatMoney(total)}</td>
            <td>${r.notes || "—"}</td>
            <td><button class="btn small danger" data-id="${r.id}">حذف</button></td>
          </tr>`;
        }).join("");
        body.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("متأكد من حذف هذا القيد؟ (لن يرجّع الخامات المخصومة للمخزون تلقائيًا)")) return;
            const { error } = await window.supabaseClient.from("sales_entries").delete().eq("id", btn.dataset.id);
            if (error) { olvShowError(errBox, error); return; }
            loadSales();
          });
        });
      } catch (err) {
        olvShowError(errBox, err);
      }
    }

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      document.getElementById("entry_date").value = olvToday();
      const errBox = document.getElementById("err");
      try {
        const [{ data: prodData, error: e1 }, { data: addonData, error: e2 }] = await Promise.all([
          window.supabaseClient.from("products").select("*").eq("is_active", true).order("category").order("sort_order"),
          window.supabaseClient.from("addons").select("*").eq("is_active", true).order("name"),
        ]);
        if (e1) throw e1;
        if (e2) throw e2;
        products = prodData || [];
        addons = addonData || [];
        document.getElementById("product-select").innerHTML = products
          .map((p) => `<option value="${p.id}">${p.name} — ${olvFormatMoney(p.price)}</option>`).join("");
        renderAddonPicker();
      } catch (err) {
        olvShowError(errBox, err);
      }
      await loadSales();
    })();
  </script>
</body>
</html>
