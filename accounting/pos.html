<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيع سريع — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f1e6">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاسبة OLV">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode_v2') || 'light';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  function applyCustomTheme(){
    var root = document.documentElement.style;
    var props = ['--ink', '--ink-2', '--ink-3', '--paper', '--muted', '--hair', '--hair-soft',
      '--overlay-bg', '--gold', '--gold-hi', '--gold-dp', '--gold-rgb', '--on-gold'];
    try {
      var raw = localStorage.getItem('olv_custom_theme_v2');
      var t = raw ? JSON.parse(raw) : null;
      if (!t) {
        props.forEach(function (p) { root.removeProperty(p); });
        return false;
      }
      document.documentElement.setAttribute('data-theme', t.isDark ? 'dark' : 'light');
      root.setProperty('--ink', t.ink);
      root.setProperty('--ink-2', t.ink2);
      root.setProperty('--ink-3', t.ink3);
      root.setProperty('--paper', t.paper);
      root.setProperty('--muted', t.muted);
      root.setProperty('--hair', t.hair);
      root.setProperty('--hair-soft', t.hairSoft);
      root.setProperty('--overlay-bg', t.overlayBg);
      root.setProperty('--gold', t.gold);
      root.setProperty('--gold-hi', t.goldHi);
      root.setProperty('--gold-dp', t.goldDp);
      root.setProperty('--gold-rgb', t.goldRgb);
      root.setProperty('--on-gold', t.onGold);
      return true;
    } catch (e) {
      props.forEach(function (p) { root.removeProperty(p); });
      return false;
    }
  }
  window.olvApplyTheme = function(){
    var theme = computeTheme();
    document.documentElement.setAttribute('data-theme', theme);
    window.olvCustomThemeActive = applyCustomTheme();
  };
  window.olvApplyTheme();
})();
</script>
<style>
  /* شاشة بيع سريع مقسومة على كامل عرض الشاشة (بدون حدود مستديرة ولا
     فراغ يخلي التذكرة تبدو بطاقة "طايرة" فوق الصفحة): عرض الأصناف
     ياخد معظم المساحة، والتذكرة عمود ضيق (ربع الشاشة تقريبًا) بحجم
     يتبع محتواها فعليًا بدل ما يتمدد على طول الشاشة كلها */
  .wrap{max-width:none; padding:0; margin:0;}
  #err.err{margin:14px 20px 0;}
  .pos-layout{display:flex; align-items:flex-start; min-height:calc(100vh - var(--nav-h, 112px) - var(--status-h, 0px));}
  .pos-main{flex:1 1 auto; min-width:0; padding:20px;}
  .pos-cart-panel{
    flex:0 0 25%; min-width:260px; max-width:340px; background:var(--ink-2);
    border-inline-start:1px solid var(--hair);
    position:sticky; top:var(--nav-h, 112px); align-self:flex-start;
    max-height:calc(100vh - var(--nav-h, 112px) - var(--status-h, 0px)); overflow-y:auto;
  }
  /* عمود التصنيفات الجانبي — أول عنصر بالـ layout فبيطلع بأقصى يمين
     الصفحة (RTL)، بين شريط التنقل والأصناف، وبيضل ظاهر بدون تمرير */
  .pos-cat-sidebar{
    flex:0 0 168px; min-width:168px; background:var(--ink-2);
    border-inline-end:1px solid var(--hair);
    position:sticky; top:var(--nav-h, 112px); align-self:flex-start;
    max-height:calc(100vh - var(--nav-h, 112px) - var(--status-h, 0px)); overflow-y:auto;
    padding:16px 10px; display:flex; flex-direction:column; gap:6px;
  }
  @media (max-width:900px){
    .pos-layout{flex-direction:column; min-height:0; align-items:stretch;}
    .pos-main{padding:16px 20px;}
    .pos-cart-panel{
      flex:0 0 auto; min-width:0; max-width:none;
      border-inline-start:none; border-top:1px solid var(--hair);
      position:sticky; bottom:0; top:auto; z-index:20; height:auto; max-height:65vh;
      align-self:auto; width:100%;
    }
    .pos-cat-sidebar{
      flex:0 0 auto; min-width:0; width:100%; flex-direction:row;
      border-inline-end:none; border-bottom:1px solid var(--hair);
      position:static; max-height:none; overflow-x:auto; overflow-y:visible;
      padding:12px 16px;
    }
  }

  .pos-toolbar{display:flex; gap:10px; margin-bottom:14px;}
  .pos-clock{
    flex:none; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:1px;
    background:var(--ink-2); border:1px solid var(--hair); border-radius:10px;
    padding:6px 16px; min-height:44px;
  }
  .pos-clock .pos-clock-time{
    font-family:'Tajawal',sans-serif; font-weight:800; font-size:18px; font-weight:700; color:var(--gold-hi); line-height:1.15;
  }
  .pos-clock .pos-clock-date{font-size:11px; color:var(--muted); line-height:1.3;}
  .search-wrap{position:relative; flex:1;}
  .search-wrap .icon{position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
  .pos-toolbar input[type=search]{
    width:100%; background:var(--ink-2); border:1px solid var(--hair); color:var(--paper);
    padding:12px 14px 12px 14px; padding-inline-start:40px; border-radius:10px; font-size:16px; font-family:'Tajawal',sans-serif;
    min-height:44px;
  }
  .pos-toolbar input[type=search]:focus{outline:none; border-color:var(--gold);}
  .cat-tabs{display:flex; flex-direction:column; gap:8px;}
  .cat-tab{
    flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    background:var(--ink-3); border:1px solid var(--hair); color:var(--muted);
    padding:14px 6px; border-radius:14px; font-size:11.5px; white-space:normal; text-align:center;
    min-height:78px; line-height:1.25; width:100%;
    transition:background .18s var(--spring), color .18s var(--spring), border-color .18s var(--spring), transform .22s var(--spring);
  }
  .cat-tab:active{transform:scale(.95); transition-duration:.08s;}
  .cat-tab .cat-tab-icon{font-size:26px; line-height:1;}
  .cat-tab .cat-tab-icon .icon{width:24px; height:24px;}
  .cat-tab .cat-tab-label{font-weight:600;}
  .cat-tab.on{background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700; box-shadow:0 4px 14px rgba(var(--gold-rgb),.25);}
  @media (max-width:900px){
    .cat-tabs{flex-direction:row; overflow-x:auto; padding-bottom:2px;}
    .cat-tab{width:84px; flex:none;}
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-bottom:20px;}
  .card{
    background:var(--ink-2); border:1px solid var(--hair); border-radius:var(--r-card); overflow:hidden; cursor:pointer;
    transition:transform .24s var(--spring), border-color .16s var(--ease), box-shadow .2s var(--ease);
    text-align:center; position:relative; box-shadow:var(--card-shadow);
  }
  @media (hover:hover) and (pointer:fine){
    .card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.12);}
  }
  /* ردّة الفعل على اللمس نفسه (مش بعد ما يرفع الإصبع) */
  .card:active{transform:scale(.96); transition-duration:.08s;}
  .card .best-badge{
    position:absolute; top:8px; inset-inline-start:8px; z-index:1;
    background:var(--gold); color:var(--on-gold);
    font-size:10.5px; font-weight:700; border-radius:999px; padding:3px 8px;
    display:flex; align-items:center; gap:3px; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .card .best-badge .icon{width:11px; height:11px; stroke-width:2.5;}
  .card .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--ink-3);
  }
  /* الصنف بدون صورة: بلاطة ملوّنة بلون دافئ (بيتبدّل بين 4 ألوان حسب ترتيب الكرت)
     بدل مربع رمادي، حتى الشبكة تبيّن حيّة ومريحة متل منيو كافيه */
  .card .thumb-fallback{
    width:auto; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
    margin:8px 8px 0; border-radius:14px; background:var(--tile, var(--ink-3));
  }
  .card:nth-child(4n+1){--tile:#f4dccb;} .card:nth-child(4n+2){--tile:#e4e9d2;}
  .card:nth-child(4n+3){--tile:#f2e4bd;} .card:nth-child(4n){--tile:#eadccc;}
  :root[data-theme="dark"] .card{--tile:var(--ink-3) !important;}
  .card .thumb-fallback .icon{width:36px; height:36px; color:var(--gold-dp); opacity:.8; stroke-width:1.6;}
  :root[data-theme="dark"] .card .thumb-fallback .icon{color:var(--gold);}
  .card .info{padding:9px 9px 12px; text-align:center;}
  .card .name{font-size:15px; margin-bottom:3px; font-weight:800; line-height:1.3;}
  .card .desc{
    font-size:11px; color:var(--muted); line-height:1.35; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .info-bottom{display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .card .price{font-size:14.5px; color:var(--gold-hi); font-weight:700; font-family:'Tajawal',sans-serif; font-weight:800;}
  .card .add-btn{
    flex:none; background:var(--olive);
    color:#fff; font-weight:700; font-size:11px; border:none; border-radius:999px;
    padding:6px 11px; display:inline-flex; align-items:center; gap:2px; line-height:1;
  }
  :root[data-theme="dark"] .card .add-btn{color:#11160a;}
  .card .add-btn:active{filter:brightness(.92);}

  /* ورقة تعديل سطر التذكرة: بتطلع من تحت وبترجع لتحت (نفس المسار)،
     وبتنسحب لتحت بالإصبع لتتسكّر — مع الزخم: رمية سريعة قصيرة بتكفي */
  .sheet{
    position:fixed; inset:auto 0 0 0; background:var(--ink-2); border-top:1px solid var(--hair);
    border-radius:20px 20px 0 0; padding:8px 20px calc(18px + env(safe-area-inset-bottom));
    z-index:50; box-shadow:0 -10px 30px rgba(0,0,0,.4); max-height:80vh; overflow-y:auto;
    overscroll-behavior:contain; max-width:640px; margin:0 auto;
    animation:olv-sheet-in .28s var(--spring) both;
  }
  .sheet.closing{animation:olv-sheet-out .2s var(--spring) both; pointer-events:none;}
  .sheet.dragging{animation:none; transition:none;}
  .sheet.settling{animation:none; transition:transform .34s var(--spring-bounce);}
  .sheet-grabber{
    display:flex; justify-content:center; padding:6px 0 12px; cursor:grab; touch-action:none;
  }
  .sheet h2, .sheet-grabber{-webkit-user-select:none; user-select:none;}
  .sheet-grabber::before{content:""; width:38px; height:5px; border-radius:999px; background:var(--hair);}
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;
    animation:olv-fade-in .2s var(--ease) both;
  }
  .sheet-backdrop.closing{animation:olv-fade-out .2s var(--ease) both; pointer-events:none;}
  @keyframes olv-sheet-in{from{transform:translateY(100%);} to{transform:translateY(0);}}
  @keyframes olv-sheet-out{from{transform:translateY(var(--sheet-y, 0px));} to{transform:translateY(100%);}}
  @keyframes olv-fade-in{from{opacity:0;} to{opacity:1;}}
  @keyframes olv-fade-out{from{opacity:var(--backdrop-o, 1);} to{opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .sheet{animation:olv-fade-in .2s ease both;}
    .sheet.closing{animation:olv-fade-out .2s ease both;}
  }

  /* ---- شاشة إتمام الدفع الاحترافية ---- */
  .checkout-backdrop{
    position:fixed; inset:0; background:rgba(30,22,12,.45); backdrop-filter:blur(6px);
    z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; transition:opacity .15s var(--spring);
  }
  .checkout-backdrop.in{opacity:1;}
  .checkout-modal{
    position:relative; width:100%; max-width:420px; max-height:92vh; overflow-y:auto;
    background:var(--ink-2); border:1px solid var(--hair); border-radius:22px;
    box-shadow:0 24px 60px rgba(30,22,12,.35); padding:26px 24px calc(24px + env(safe-area-inset-bottom));
    transform:scale(.94) translateY(12px); opacity:0; transition:transform .24s var(--spring), opacity .16s var(--spring);
  }
  .checkout-backdrop.in .checkout-modal{transform:scale(1) translateY(0); opacity:1;}
  .checkout-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .checkout-head h2{font-size:19px;}
  .checkout-close{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--hair); background:var(--ink-3);
    color:var(--muted); font-size:15px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .checkout-close .icon{width:16px; height:16px;}
  .checkout-total{text-align:center; padding:18px 0 20px;}
  .checkout-total .label{font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .checkout-total .amount{
    font-family:'Tajawal',sans-serif; font-weight:800; font-size:46px; font-weight:700; color:var(--gold-hi); line-height:1;
  }
  .checkout-summary{
    background:var(--ink-3); border-radius:12px; padding:12px 14px; margin-bottom:20px;
    max-height:120px; overflow-y:auto;
  }
  .checkout-summary .row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--muted);}
  .checkout-summary .row span:first-child{color:var(--paper);}

  .pm-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
  .pm-tile{
    background:var(--ink-3); border:1.5px solid var(--hair); border-radius:14px; padding:14px 6px;
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);
    min-height:72px;
  }
  .pm-tile .icon{width:24px; height:24px;}
  .pm-tile{transition:transform .2s var(--spring), background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);}
  .pm-tile:active, .quick-amounts button:active, .keypad button:active, .qty-row button:active,
  .qty-stepper button:active, .pos-pagination button:active, .discount-mode-tab:active,
  .discount-toggle-btn:active, .discount-remove-btn:active{transform:scale(.96);}
  .discount-toggle-btn, .discount-remove-btn{transition:transform .2s var(--spring), background .16s var(--ease), border-color .16s var(--ease);}
  .quick-amounts button, .keypad button, .qty-row button, .qty-stepper button, .pos-pagination button{
    transition:transform .2s var(--spring), background .12s var(--ease), border-color .12s var(--ease);
  }
  .quick-amounts button:active, .keypad button:active, .qty-stepper button:active, .pos-pagination button:active{transition-duration:.06s;}
  .pm-tile.on{border-color:var(--gold); background:rgba(var(--gold-rgb),.12); color:var(--gold-hi); font-weight:700;}

  .cash-panel{margin-bottom:8px;}
  .received-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .received-row .label{font-size:13px; color:var(--muted);}
  .received-row .value{font-family:'Tajawal',sans-serif; font-weight:800; font-size:30px; font-weight:700; color:var(--paper);}
  /* direction:ltr إجباري هون — الصفحة كلها RTL، وبدونها شبكة CSS Grid
     بتوزّع عناصرها من اليمين لليسار فبيطلع ترتيب الأرقام معكوس (يبين
     "3 2 1" بدل "1 2 3")، وهيك بالظبط كان سبب المشكلة: المستخدم يضغط
     المكان اللي شكله "1" بس فعليًا هو الزر التاني (data-key مختلف)،
     فبيدخل رقم غلط ما بيوصل للمبلغ المطلوب وزر التأكيد يضل معطّل */
  .quick-amounts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; direction:ltr;}
  .quick-amounts button{
    background:var(--ink-3); border:1px solid var(--hair); border-radius:10px; padding:10px 4px;
    font-size:13px; color:var(--paper); min-height:40px;
  }
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; direction:ltr;}
  .keypad button{
    background:var(--ink-3); border:1px solid var(--hair); border-radius:10px; font-size:19px;
    color:var(--paper); min-height:50px;
  }
  .keypad button:active{background:var(--ink); border-color:var(--gold);}
  .change-row{
    display:flex; justify-content:space-between; align-items:center; background:rgba(124,138,74,.12);
    border:1px solid rgba(124,138,74,.35); border-radius:12px; padding:12px 16px; margin-bottom:18px;
  }
  .change-row.insufficient{background:rgba(193,88,63,.1); border-color:rgba(193,88,63,.35);}
  .change-row .label{font-size:13px; color:var(--muted);}
  .change-row .value{font-family:'Tajawal',sans-serif; font-weight:800; font-size:24px; font-weight:700; color:var(--ok);}
  .change-row.insufficient .value{color:var(--danger-hi);}

  .checkout-confirm{width:100%; min-height:52px; font-size:16px;}
  /* زر الدفع بلون الزيتون من الشعار: أهم زر بالشاشة، فبيتميّز عن باقي الأزرار الذهبية */
  .btn.gold.pay, .btn.gold.checkout-confirm{background:var(--olive); color:#fff; box-shadow:0 8px 18px -10px rgba(86,105,46,.8); font-size:16px;}
  :root[data-theme="dark"] .btn.gold.pay, :root[data-theme="dark"] .btn.gold.checkout-confirm{color:#11160a;}

  .checkout-success{
    position:absolute; inset:0; background:var(--ink-2); border-radius:22px; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .checkout-success.show{opacity:1; pointer-events:auto;}
  .checkout-success .check{
    width:76px; height:76px; border-radius:50%; background:var(--ok); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:38px;
    transform:scale(.8); transition:transform .22s var(--spring);
  }
  .checkout-success .check .icon{width:38px; height:38px; stroke-width:3;}
  .checkout-success.show .check{transform:scale(1);}
  .checkout-success .msg{font-size:16px; font-weight:700; color:var(--gold-hi);}
  .qty-row{display:flex; align-items:center; gap:14px; margin:14px 0;}
  .qty-row button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--hair); background:var(--ink-3);
    color:var(--paper); font-size:18px; flex:none;
  }
  .addon-row{
    display:flex; align-items:center; gap:10px; padding:12px 0;
    border-bottom:1px solid var(--hair-soft,rgba(var(--gold-rgb),.1)); cursor:pointer; width:100%;
  }
  .addon-row .addon-name{flex:1; font-size:13.5px;}
  .addon-row .a-price{color:var(--muted); font-size:12.5px;}

  .cart-panel-inner{
    padding:16px; display:flex; flex-direction:column;
  }
  .cart-bar{
    background:var(--ink-2); border-top:1px solid var(--hair); flex:none;
    padding:14px 0 0; margin-top:14px; display:flex; flex-direction:column; gap:10px;
  }
  .discount-toggle-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    background:var(--ink-3); border:1px dashed var(--hair); border-radius:10px;
    color:var(--olive-hi,#9dab63); font-size:12.5px; font-weight:600; padding:8px; cursor:pointer;
  }
  .discount-toggle-btn.active{border-style:solid; border-color:var(--gold); color:var(--gold-hi);}
  .discount-form{
    display:flex; flex-direction:column; gap:8px; background:var(--ink-3); border:1px solid var(--hair);
    border-radius:10px; padding:10px; margin-top:8px;
  }
  .discount-mode-tabs{display:flex; gap:6px;}
  .discount-mode-tab{
    flex:1; background:var(--ink-2); border:1px solid var(--hair); border-radius:8px;
    color:var(--muted); font-size:12px; font-weight:600; padding:6px; cursor:pointer;
  }
  .discount-mode-tab.on{background:var(--gold); border-color:var(--gold); color:var(--on-gold);}
  .discount-input-wrap{display:flex; align-items:center; gap:8px;}
  .discount-input-wrap input{
    flex:1; background:var(--ink-2); border:1px solid var(--hair); border-radius:8px;
    color:var(--paper); font-size:14px; padding:8px 10px; min-width:0;
  }
  .discount-input-wrap input:focus{outline:none; border-color:var(--gold);}
  .discount-remove-btn{
    flex:none; width:34px; height:34px; border-radius:8px; border:1px solid var(--hair);
    background:var(--ink-2); color:var(--danger-hi); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .discount-remove-btn .icon{width:15px; height:15px;}
  .cart-totals{display:flex; flex-direction:column; gap:4px;}
  .cart-total-row{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--muted);}
  .cart-total-row.discount span:last-child{color:var(--danger-hi);}
  .cart-total-row.grand{
    font-size:15px; color:var(--paper); font-weight:600; padding-top:8px;
    border-top:1px solid var(--hair-soft,rgba(var(--gold-rgb),.12));
  }
  .cart-bar .total{font-family:'Tajawal',sans-serif; font-weight:800; font-size:24px; color:var(--gold-hi); font-weight:700;}
  .cart-bar .actions{display:flex; gap:8px;}
  .cart-bar .actions .btn{flex:1;}
  .cart-list{margin-bottom:0;}
  .cart-item{
    background:var(--ink-3); border:1px solid var(--hair-soft,rgba(var(--gold-rgb),.14));
    border-radius:14px; padding:12px 14px; margin-bottom:10px;
  }
  .cart-item-top{display:flex; align-items:flex-start; gap:10px;}
  .qty-badge{
    flex:none; background:var(--gold); color:var(--on-gold);
    font-weight:700; font-size:12.5px; min-width:24px; height:24px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .cart-item-info{flex:1; min-width:0; cursor:pointer;}
  .cart-item-info .name{font-weight:600; font-size:15px; line-height:1.35;}
  .cart-item-info .meta{color:var(--olive-hi,#9dab63); font-size:12.5px; margin-top:3px; line-height:1.5;}
  .cart-item-info .meta .icon{width:12px; height:12px; vertical-align:-1px;}
  .cart-item-price{flex:none; font-weight:700; color:var(--gold-hi); font-size:14.5px; white-space:nowrap;}
  .cart-item-controls{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:10px; padding-top:10px; border-top:1px solid var(--hair-soft,rgba(var(--gold-rgb),.12));
  }
  .qty-stepper{
    display:flex; align-items:center; gap:2px; background:var(--ink-2); border:1px solid var(--hair);
    border-radius:999px; padding:3px;
  }
  .qty-stepper button{
    width:30px; height:30px; border-radius:50%; border:0; background:transparent;
    color:var(--gold); font-size:17px; flex:none; line-height:0;
  }
  .qty-stepper button:active{background:var(--gold); color:var(--on-gold);}
  .qty-stepper .qty-value{min-width:24px; text-align:center; font-size:14px; font-weight:700;}
  .cart-item-remove{
    width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:transparent;
    color:var(--danger-hi); font-size:15px; flex:none; opacity:.75;
    display:flex; align-items:center; justify-content:center;
  }
  .cart-item-remove .icon{width:16px; height:16px;}
  .cart-item-remove:hover{opacity:1; background:rgba(193,88,63,.12); border-color:rgba(193,88,63,.3);}
  .cart-empty{color:var(--muted); font-size:14px; text-align:center; padding:60px 0;}
  .ticket-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .ticket-header h2{margin:0;}
  .ticket-badge{
    background:var(--gold); color:var(--on-gold); font-size:12px; font-weight:700;
    border-radius:999px; min-width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    padding:0 6px; transition:transform .3s var(--spring-bounce);
  }
  /* نبضة صغيرة على عدّاد التذكرة لما ينضاف صنف — تأكيد إنو الضغطة وصلت */
  .ticket-badge.bump{animation:olv-bump .16s var(--spring);}
  @keyframes olv-bump{0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);}}
  .pos-pagination{display:flex; align-items:center; justify-content:center; gap:14px; padding-top:6px;}
  .pos-pagination button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--hair); background:var(--ink-2);
    color:var(--paper); font-size:16px;
  }
  .pos-pagination button:disabled{opacity:.35;}
  .pos-pagination .page-info{color:var(--muted); font-size:13px; min-width:70px; text-align:center;}

  /* شريط سفلي ثابت بعرض الشاشة الكامل (تحت التصنيفات/القائمة/التذكرة
     كلها) بيلخّص عدد الأصناف والكمية بالسلة الحالية، مع اسم البرنامج
     والنسخة — نقلّص ارتفاع بقية الشاشة بمقدار ارتفاعه الفعلي (متغيّر
     CSS محسوب بالجافاسكربت، نفس أسلوب --nav-h) حتى ما يغطي شي */
  .pos-status-bar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:var(--ink-2); border-top:1px solid var(--hair);
    padding:9px 20px; font-size:12.5px; color:var(--muted);
  }
  .pos-status-bar .psb-counts{display:flex; gap:18px; align-items:center;}
  .pos-status-bar .psb-counts b{color:var(--paper); font-weight:700;}
  .pos-status-bar .psb-brand{display:flex; align-items:center; gap:6px;}
  @media (max-width:900px){
    .pos-status-bar{display:none;}
  }
  /* بالموبايل التذكرة بتقعد فوق شريط التنقل السفلي مش تحته */
  @media (max-width:640px){
    .pos-cart-panel{bottom:var(--bnav-h, 0px);}
  }

  /* ---- التذكرة على الموبايل: ورقة سفلية بحالتين ----
     مطوية: بتبيّن العنوان والعدد والإجمالي وزرّي حفظ/الدفع بس، فالأصناف
     بتاخد معظم الشاشة. مفتوحة: كل شي متل قبل. بتنفتح وبتتسكّر بالضغط على
     المقبض/العنوان أو بسحبه لفوق/لتحت (مع الزخم) */
  .cart-grabber{display:none;}
  @media (max-width:900px){
    .pos-cart-panel{
      border-radius:20px 20px 0 0; border:1px solid var(--hair); border-bottom:none;
      background:var(--material); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
      box-shadow:0 -12px 32px -10px rgba(0,0,0,.45);
      max-height:78vh; overscroll-behavior:contain;
    }
    .pos-cart-panel.dragging{transition:none;}
    .pos-cart-panel.settling{transition:transform .34s var(--spring-bounce);}
    .cart-grabber{
      display:flex; justify-content:center; padding:8px 0 4px; margin:-8px 0 0; cursor:grab;
      touch-action:none; width:100%; background:none; border:0;
    }
    .cart-grabber::before{content:""; width:38px; height:5px; border-radius:999px; background:var(--hair);}
    .cart-panel-inner{padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
    .ticket-header{cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none;}
    .ticket-header .cart-chevron{display:inline-flex; color:var(--muted); transition:transform .3s var(--spring);}
    .ticket-header .cart-chevron .icon{width:18px; height:18px;}
    .pos-cart-panel.collapsed .ticket-header .cart-chevron{transform:rotate(180deg);}
    .pos-cart-panel.collapsed .cart-panel-inner > :not(.ticket-header):not(.cart-bar):not(.cart-grabber){display:none;}
    .pos-cart-panel.collapsed .discount-toggle-btn,
    .pos-cart-panel.collapsed .discount-form,
    .pos-cart-panel.collapsed .cart-total-row:not(.grand){display:none !important;}
    .pos-cart-panel.collapsed .ticket-header{margin-bottom:6px;}
    .pos-cart-panel.collapsed .cart-bar{margin-top:0; padding-top:6px; border-top:none; background:none;}
    .pos-cart-panel.collapsed .cart-total-row.grand{border-top:none; padding-top:0;}
    .pos-cart-panel:not(.collapsed) .cart-panel-inner > *{animation:olv-fade-in .24s var(--ease) both;}
    .cart-bar{background:none;}
  }
  @media (min-width:901px){
    .ticket-header .cart-chevron{display:none;}
  }
  @media (prefers-reduced-transparency: reduce){
    .pos-cart-panel{background:var(--ink-2) !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important;}
  }
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="pos-layout">
      <aside class="pos-cat-sidebar">
        <div class="cat-tabs" id="cat-tabs"></div>
      </aside>

      <div class="pos-main">
        <div class="pos-toolbar">
          <div class="pos-clock">
            <span class="pos-clock-time" id="pos-clock-time">--:--</span>
            <span class="pos-clock-date" id="pos-clock-date"></span>
          </div>
          <div class="search-wrap">
            <span class="search-icon" id="search-icon"></span>
            <input type="search" id="product-search" placeholder="ابحث عن صنف...">
          </div>
          <button type="button" class="btn small" id="reprint-open-btn"></button>
        </div>
        <div class="grid" id="products-grid">
          <div class="hint">جاري التحميل...</div>
        </div>
        <div class="pos-pagination" id="pos-pagination" hidden>
          <button type="button" id="page-prev">›</button>
          <span class="page-info" id="page-info" dir="ltr">1 / 1</span>
          <button type="button" id="page-next">‹</button>
        </div>
      </div>

      <aside class="pos-cart-panel collapsed" id="pos-cart-panel">
        <div class="cart-panel-inner">
          <button type="button" class="cart-grabber" id="cart-grabber" aria-label="فتح/طي التذكرة" aria-expanded="false"></button>
          <div class="ticket-header" id="ticket-header">
            <h2>التذكرة</h2>
            <span style="display:inline-flex; align-items:center; gap:10px;">
              <span class="cart-chevron" id="cart-chevron"></span>
              <span class="ticket-badge" id="ticket-badge">0</span>
            </span>
          </div>
          <div class="field" style="margin-bottom:12px;">
            <label>نوع الطلب</label>
            <select id="order-type">
              <option value="صالة">صالة</option>
              <option value="سفري">سفري</option>
              <option value="توصيل">توصيل</option>
            </select>
          </div>
          <div class="field" id="table-number-field" style="margin-bottom:12px;" hidden>
            <label>رقم الطاولة</label>
            <input type="text" id="table-number" placeholder="مثال: 5">
          </div>
          <div class="field" id="customer-name-field" style="margin-bottom:12px;" hidden>
            <label>اسم الزبون</label>
            <input type="text" id="customer-name" placeholder="مثال: أحمد">
          </div>
          <div class="field" id="customer-phone-field" style="margin-bottom:12px;">
            <label id="customer-phone-label">رقم تلفون الزبون</label>
            <input type="tel" id="customer-phone" placeholder="07xxxxxxxx">
          </div>
          <div class="cart-list" id="cart-list"></div>
          <div class="cart-bar">
            <button type="button" class="discount-toggle-btn" id="discount-toggle-btn"></button>
            <div class="discount-form" id="discount-form" hidden>
              <div class="discount-mode-tabs">
                <button type="button" class="discount-mode-tab on" data-discount-mode="percent">نسبة %</button>
                <button type="button" class="discount-mode-tab" data-discount-mode="fixed">مبلغ ثابت</button>
              </div>
              <div class="discount-input-wrap">
                <input type="number" id="discount-value-input" inputmode="decimal" min="0" step="0.01" placeholder="0" dir="ltr">
                <button type="button" class="discount-remove-btn" id="discount-remove-btn" aria-label="إلغاء الخصم"></button>
              </div>
            </div>
            <div class="cart-totals">
              <div class="cart-total-row"><span>المجموع الفرعي</span><span id="cart-subtotal">0.00</span></div>
              <div class="cart-total-row discount" id="cart-discount-row" style="display:none;"><span>الخصم</span><span id="cart-discount">0.00</span></div>
              <div class="cart-total-row grand"><span>الإجمالي</span><span class="total" id="cart-total">0.00</span></div>
            </div>
            <div class="actions">
              <button class="btn" id="save-draft-btn" disabled>حفظ</button>
              <button class="btn gold pay" id="checkout-btn" disabled>الدفع</button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="pos-status-bar" id="pos-status-bar">
      <div class="psb-counts">
        <span><b id="psb-item-count">0</b> صنف</span>
        <span><b id="psb-qty-count">0</b> قطعة</span>
      </div>
      <div class="psb-brand"><span id="psb-brand-icon"></span> محاسبة OLV</div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/offline-queue.js"></script>
  <script defer src="assets/supabase-client.js"></script>
  <script defer src="assets/auth-guard.js"></script>
  <script defer src="assets/layout.js"></script>
  <script defer src="assets/sale-cart.js"></script>
  <script defer src="assets/reprint.js"></script>
  <script defer src="assets/notify-sound.js"></script>
  <script defer src="assets/connection-status.js"></script>
  <script defer src="assets/incoming-orders-poll.js"></script>
  <script defer src="assets/low-stock-poll.js"></script>
  <script defer src="assets/menu-stock-sync.js"></script>
  <script defer src="assets/print-health.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    olvRenderNav("pos");
    document.getElementById("search-icon").innerHTML = olvIcon("search");
    document.getElementById("discount-toggle-btn").innerHTML = olvIcon("tag") + "<span>إضافة خصم</span>";
    document.getElementById("reprint-open-btn").innerHTML = olvIcon("printer") + " إعادة طباعة";
    document.getElementById("reprint-open-btn").addEventListener("click", () => olvOpenReprintList());
    document.getElementById("discount-remove-btn").innerHTML = olvIcon("x");

    // يحسب ارتفاع الشريط العلوي فعليًا (يتغيّر حسب حجم الشاشة) ويخزّنه
    // كمتغيّر CSS، حتى تبدأ التذكرة والقائمة مباشرة تحته بدون أي فراغ
    function updateNavHeight() {
      const nav = document.getElementById("olv-nav");
      if (nav) document.documentElement.style.setProperty("--nav-h", nav.offsetHeight + "px");
    }
    updateNavHeight();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNavHeight);

    // نفس فكرة updateNavHeight بس للشريط السفلي — يختفي بالموبايل
    // (display:none)، فبيرجع ارتفاعه صفر تلقائيًا بدون أي كود إضافي
    function updateStatusBarHeight() {
      const bar = document.getElementById("pos-status-bar");
      if (bar) document.documentElement.style.setProperty("--status-h", bar.offsetHeight + "px");
    }
    updateStatusBarHeight();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateStatusBarHeight);

    document.getElementById("psb-brand-icon").innerHTML = olvIcon("brand");

    // ساعة وتاريخ حيّين بأعلى شاشة بيع سريع — أرقام إنجليزية دايمًا
    // (numberingSystem: latn) بنفس قاعدة باقي البرنامج
    function updatePosClock() {
      const now = new Date();
      document.getElementById("pos-clock-time").textContent =
        now.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", numberingSystem: "latn" });
      document.getElementById("pos-clock-date").textContent =
        now.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric", numberingSystem: "latn" });
    }
    updatePosClock();
    setInterval(updatePosClock, 15000);

    // أيقونة خطوط ذهبية مناسبة للتصنيف — تُستخدم بتبويبات التصنيف
    // وكواجهة افتراضية أنيقة عند عدم توفر صورة حقيقية للصنف، بدل الإيموجي
    // الملوّن القديم يلي كان يكسر وحدة الشكل البصري جنب باقي أيقونات
    // البرنامج (الشريط العلوي، الأزرار) اللي كلها بنفس نمط الخطوط الذهبية
    function categoryIconName(category) {
      const c = category || "";
      const rules = [
        [/برغر|سندويش|شاورما/, "burger"],
        [/بطاطا|سناك|ناتشوز|أجنحة|وودجز/, "fries"],
        [/سلطة|سلطات|مقبلات|حمص|فتوش|مناقيش/, "salad"],
        [/قهوة|إسبريسو|كابتشينو|لاتيه|شاي|ساخن/, "coffee"],
        [/عصير|عصائر|سموذي|كوكتيل/, "cup"],
        [/بارد|موهيتو|ليموناضة|آيس/, "snowflake"],
        [/بوظة|آيس كريم|ميلك شيك/, "iceCream"],
        [/دونات/, "donut"],
        [/كيك|تشيز كيك|تيراميسو|حلويات/, "cake"],
        [/أرجيلة|نكهات|شيشة/, "shisha"],
        [/إضاف/, "plus"],
        [/مشروبات/, "cup"],
      ];
      for (const [pattern, icon] of rules) {
        if (pattern.test(c)) return icon;
      }
      return "dish";
    }

    // صورة مؤقتة مطابقة لاسم/تصنيف الصنف (ريثما يرفع صاحب المطعم صورة
    // حقيقية من صفحة الإعدادات). لو الصورة ما اشتغلت (رابط معطّل) بيرجع
    // تلقائيًا لأيقونة التصنيف عبر olvHandleImageError
    function productPhotoUrl(name, category) {
      const text = `${name || ""} ${category || ""}`;
      const rules = [
        [/برغر|هامبرغر/, "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=60"],
        [/بيتزا/, "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=400&q=60"],
        [/دجاج/, "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=400&q=60"],
        [/كباب|مشوي|مشاوي|لحم/, "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=400&q=60"],
        [/مكرونة|باستا/, "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=400&q=60"],
        [/سندويش|شاورما|راب/, "https://images.unsplash.com/photo-1553909489-cd47e0ef937f?auto=format&fit=crop&w=400&q=60"],
        [/سلطة|مقبلات|حمص|فتوش/, "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400&q=60"],
        [/بطاطا|سناك|أجنحة|وودجز/, "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=400&q=60"],
        [/قهوة|إسبريسو|كابتشينو|لاتيه/, "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=400&q=60"],
        [/كيك|تشيز كيك|تيراميسو|حلويات|بوظة|آيس كريم/, "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=400&q=60"],
      ];
      for (const [pattern, url] of rules) {
        if (pattern.test(text)) return url;
      }
      return null;
    }

    window.olvHandleImageError = function (img) {
      const fallback = document.createElement("div");
      fallback.className = "thumb-fallback";
      fallback.innerHTML = olvIcon(img.dataset.fallbackIcon || "dish");
      img.replaceWith(fallback);
    };

    // إشعار مؤقت يظهر أسفل الشاشة (نجاح بيع، أو تنبيه طلب جاهز)، بما إن
    // الشاشة بقيت مفتوحة على بيع سريع نفسها بدل الانتقال لصفحة منفصلة
    function showToast(msg, color, icon) {
      const type = color === "var(--danger)" ? "danger" : color === "var(--gold-dp)" ? "gold" : "ok";
      olvToast(msg, { type, icon, ms: 2200 });
    }

    // يراقب الطلبات اليوم اللي صارت "جاهز" (المطبخ صار خلص فيها) ويطلع
    // صوت تنبيه + إشعار للكاشير — يتجاهل الطلبات الجاهزة أصلًا وقت فتح
    // الشاشة، وينبّه بس على اللي بيصير جاهز جديد بعدها
    let knownReadyIds = null; // null = لسا ما انعمل الأساس (baseline) الأول
    async function checkForReadyOrders() {
      const { data, error } = await window.supabaseClient
        .from("sales_entries")
        .select("id, order_type")
        .eq("kitchen_status", "جاهز")
        .eq("entry_date", olvToday())
        .eq("status", "completed")
        .limit(60);
      if (error) return;
      const currentIds = new Map((data || []).map((o) => [o.id, o]));
      if (knownReadyIds === null) {
        knownReadyIds = new Set(currentIds.keys());
        return;
      }
      const newOnes = [];
      currentIds.forEach((order, id) => { if (!knownReadyIds.has(id)) newOnes.push(order); });
      knownReadyIds = new Set(currentIds.keys());
      if (newOnes.length) {
        OlvSound.playOrderReady();
        newOnes.forEach((order) => {
          showToast(`طلب ${order.order_type || ""} جاهز من المطبخ`, "var(--gold-dp)", "checkCircle");
        });
      }
    }

    let session = null;
    let products = [];
    let addons = [];
    let popularity = {}; // product_id -> إجمالي الكمية المباعة تاريخيًا
    let activeCategory = "الكل";
    let searchTerm = "";
    let currentPage = 1;
    const BEST_SELLERS = "الأكثر مبيعًا";
    const DRAFT_KEY = "olv_pos_draft";
    let discountMode = "percent"; // "percent" أو "fixed"
    let discountValue = 0;

    // يحسب قيمة الخصم الفعلية بالعملة، مع سقف بحيث ما يتعدى المجموع الفرعي
    // (يمنع رقم خصم سالب أو إجمالي سالب بأي حال)
    // الكاشير عليه سقف خصم يفرضه السيرفر (staff_max_discount_percent) — هون
    // بنطبّقه كمان بالشاشة حتى ما يكتشف الكاشير الرفض بعد ما يجهّز الطلب
    let staffMaxDiscountPct = null;
    function computeDiscountAmount(subtotal) {
      if (!discountValue || discountValue <= 0) return 0;
      let raw = discountMode === "percent" ? subtotal * (discountValue / 100) : discountValue;
      if (staffMaxDiscountPct !== null) raw = Math.min(raw, subtotal * staffMaxDiscountPct / 100);
      return Math.round(Math.max(0, Math.min(raw, subtotal)) * 100) / 100;
    }

    // يعلّم الطاولة "مشغولة" بخريطة الطاولات تلقائيًا بعد نجاح طلب صالة —
    // ميزة إضافية بس، فما بنوقف عملية البيع لو فشلت (مثلاً الطاولة مش
    // مضافة أصلًا بالإعدادات)
    async function markTableOccupied(tableNumber) {
      try {
        await window.supabaseClient.from("table_occupancy").upsert(
          { table_number: tableNumber, is_occupied: true, occupied_at: new Date().toISOString(), freed_at: null },
          { onConflict: "table_number" }
        );
      } catch (e) { /* تجاهل — الطاولة قد لا تكون مضافة بالإعدادات بعد */ }
    }

    function resetDiscount() {
      discountMode = "percent";
      discountValue = 0;
      document.getElementById("discount-value-input").value = "";
      document.getElementById("discount-form").hidden = true;
      document.getElementById("discount-toggle-btn").classList.remove("active");
      document.querySelectorAll(".discount-mode-tab").forEach((btn) => {
        btn.classList.toggle("on", btn.dataset.discountMode === "percent");
      });
    }

    // يحسب عدد الأعمدة/الصفوف اللي بتتسع فعليًا داخل الشاشة المفتوحة حاليًا
    // بدون سكرول، عشان باقي الأصناف تتوزع على صفحات بدل ما تتزاحم أو تختفي
    function computeGridCapacity() {
      const grid = document.getElementById("products-grid");
      const containerWidth = grid.clientWidth || 300;
      const gap = 14;
      const targetCardWidth = 150;
      const columns = Math.max(1, Math.floor((containerWidth + gap) / (targetCardWidth + gap)));
      const cardWidth = (containerWidth - (columns - 1) * gap) / columns;
      const infoHeight = 88;
      const cardHeight = cardWidth + infoHeight;
      const gridTop = grid.getBoundingClientRect().top;
      const reservedBottom = 56;
      const availableHeight = Math.max(cardHeight, window.innerHeight - gridTop - reservedBottom);
      const rows = Math.max(1, Math.floor((availableHeight + gap) / (cardHeight + gap)));
      return { columns, itemsPerPage: columns * rows };
    }

    function sortByPopularity(list) {
      return list.slice().sort((a, b) => {
        const pa = popularity[a.id] || 0;
        const pb = popularity[b.id] || 0;
        if (pb !== pa) return pb - pa;
        const sa = a.sort_order || 0;
        const sb = b.sort_order || 0;
        if (sa !== sb) return sa - sb;
        return a.name.localeCompare(b.name, "ar");
      });
    }

    function renderCategoryTabs() {
      const hasBestSellers = Object.keys(popularity).length > 0;
      // ترتيب التصنيفات أبجديًا (بدل ترتيب الإدخال العشوائي بقاعدة
      // البيانات)، مع تثبيت "الكل" و"الأكثر مبيعًا" بالبداية دايمًا
      const realCats = [...new Set(products.map((p) => p.category))].sort((a, b) => a.localeCompare(b, "ar"));
      const cats = [
        "الكل",
        ...(hasBestSellers ? [BEST_SELLERS] : []),
        ...realCats,
      ];
      document.getElementById("cat-tabs").innerHTML = cats.map((c) => `
        <button class="cat-tab${c === activeCategory ? " on" : ""}" data-cat="${olvEsc(c)}">
          <span class="cat-tab-icon">${c === "الكل" ? olvIcon("grid") : c === BEST_SELLERS ? olvIcon("star") : olvIcon(categoryIconName(c))}</span>
          <span class="cat-tab-label">${olvEsc(c)}</span>
        </button>
      `).join("");
      document.querySelectorAll(".cat-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          currentPage = 1;
          renderCategoryTabs();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const grid = document.getElementById("products-grid");
      const pagination = document.getElementById("pos-pagination");
      let list;
      if (activeCategory === "الكل") {
        list = sortByPopularity(products);
      } else if (activeCategory === BEST_SELLERS) {
        list = sortByPopularity(products.filter((p) => popularity[p.id])).slice(0, 12);
      } else {
        list = sortByPopularity(products.filter((p) => p.category === activeCategory));
      }
      if (searchTerm) {
        list = list.filter((p) => p.name.toLowerCase().includes(searchTerm));
      }
      if (!list.length) {
        grid.innerHTML = `<div class="hint">لا توجد أصناف مطابقة. جرّب تصنيفًا آخر أو أضف منتجات من صفحة الإعدادات.</div>`;
        pagination.hidden = true;
        return;
      }

      const { columns, itemsPerPage } = computeGridCapacity();
      const totalPages = Math.max(1, Math.ceil(list.length / itemsPerPage));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageItems = list.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      // أول ٣ أصناف الأكثر مبيعًا بتاخد شارة مميزة بأي تصنيف — إلا وهي
      // بالتبويب المخصص لهم أصلًا (تكرار بلا داعي هناك)
      const topSellerIds = activeCategory === BEST_SELLERS
        ? new Set()
        : new Set(
            Object.keys(popularity)
              .sort((a, b) => popularity[b] - popularity[a])
              .slice(0, 3)
          );

      grid.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
      grid.innerHTML = pageItems.map((p) => {
        const fallbackIcon = categoryIconName(p.category);
        const src = p.image_url || productPhotoUrl(p.name, p.category);
        return `
        <div class="card" data-id="${p.id}" data-sound="add">
          ${topSellerIds.has(p.id) ? `<span class="best-badge">${olvIcon("star")}الأكثر طلبًا</span>` : ""}
          ${src
            ? `<img class="thumb" src="${src}" alt="${olvEsc(p.name)}" data-fallback-icon="${fallbackIcon}" onerror="olvHandleImageError(this)">`
            : `<div class="thumb-fallback">${olvIcon(fallbackIcon)}</div>`
          }
          <div class="info">
            <div class="name">${olvEsc(p.name)}</div>
            ${p.description ? `<div class="desc">${olvEsc(p.description)}</div>` : ""}
            <div class="info-bottom">
              <span class="price">${olvFormatMoney(p.price)}</span>
              <button type="button" class="add-btn" data-add="${p.id}" data-sound="add">+ أضف</button>
            </div>
          </div>
        </div>
      `;
      }).join("");
      grid.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => quickAddToCart(card.dataset.id));
      });
      grid.querySelectorAll(".add-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          quickAddToCart(btn.dataset.add);
        });
      });

      pagination.hidden = totalPages <= 1;
      document.getElementById("page-info").textContent = `${currentPage} / ${totalPages}`;
      document.getElementById("page-prev").disabled = currentPage <= 1;
      document.getElementById("page-next").disabled = currentPage >= totalPages;
    }

    // ضغطة وحدة على أي صنف بالقائمة تضيفه مباشرة للتذكرة بكمية 1 بدون
    // أي نافذة — لو نفس الصنف "العادي" (بدون إضافات ولا ملاحظة) موجود
    // أصلًا بالتذكرة، بتزيد كميته بدل ما تعمل سطر مكرر
    function quickAddToCart(productId) {
      const product = products.find((p) => p.id === productId);
      if (!product) return;
      const cart = OlvCart.all();
      const existingIdx = cart.findIndex(
        (item) => item.productId === productId && item.addons.length === 0 && !item.note
      );
      if (existingIdx >= 0) {
        OlvCart.incrementQtyAt(existingIdx, 1);
      } else {
        OlvCart.add(product, [], 1, "");
      }
      renderCart();
    }

    // فتح شاشة تخصيص سطر موجود بالتذكرة (الكمية، الإضافات، الملاحظة)،
    // وتحتها زر لحذف السطر بالكامل من السلة
    function openItemSheet(idx) {
      const item = OlvCart.all()[idx];
      if (!item) return;
      const backdrop = document.createElement("div");
      backdrop.className = "sheet-backdrop";
      const sheet = document.createElement("div");
      sheet.className = "sheet";
      let qty = item.qty;
      let note = item.note || "";
      const selectedAddons = new Set(item.addons.map((a) => a.id));

      function render() {
        sheet.innerHTML = `
          <div class="sheet-grabber" aria-hidden="true"></div>
          <h2 style="margin-bottom:10px;">${olvEsc(item.name)}</h2>
          <div class="hint" style="margin-bottom:10px;">${olvFormatMoney(item.unitBase)}</div>
          ${addons.length ? `
            <div style="margin-bottom:10px;">
              ${addons.map((a) => `
                <label class="addon-row" for="addon-${a.id}">
                  <input type="checkbox" data-addon="${a.id}" id="addon-${a.id}" ${selectedAddons.has(a.id) ? "checked" : ""}>
                  <span class="addon-name">${olvEsc(a.name)}</span>
                  <span class="a-price">+${olvFormatMoney(a.price)}</span>
                </label>
              `).join("")}
            </div>
          ` : ""}
          <div class="qty-row">
            <button type="button" id="qty-minus">−</button>
            <div style="font-size:16px; min-width:24px; text-align:center;">${qty}</div>
            <button type="button" id="qty-plus">+</button>
          </div>
          <div class="field">
            <label>ملاحظة للمطبخ (اختياري)</label>
            <input type="text" id="item-note" placeholder="مثال: بدون بصل" value="${note}">
          </div>
          <button class="btn gold" id="sheet-save" style="width:100%;">حفظ التعديلات</button>
          <button class="btn danger" id="sheet-delete" style="width:100%; margin-top:8px;">حذف من السلة</button>
          <button class="btn" id="sheet-cancel" style="width:100%; margin-top:8px;">إلغاء</button>
        `;
        sheet.querySelectorAll("input[data-addon]").forEach((cb) => {
          cb.addEventListener("change", () => {
            if (cb.checked) selectedAddons.add(cb.dataset.addon);
            else selectedAddons.delete(cb.dataset.addon);
          });
        });
        sheet.querySelector("#qty-minus").addEventListener("click", () => { qty = Math.max(1, qty - 1); note = sheet.querySelector("#item-note").value; render(); });
        sheet.querySelector("#qty-plus").addEventListener("click", () => { qty += 1; note = sheet.querySelector("#item-note").value; render(); });
        sheet.querySelector("#sheet-cancel").addEventListener("click", close);
        sheet.querySelector("#sheet-delete").addEventListener("click", () => {
          OlvCart.removeAt(idx);
          renderCart();
          close();
        });
        sheet.querySelector("#sheet-save").addEventListener("click", () => {
          const chosenAddons = addons.filter((a) => selectedAddons.has(a.id));
          const finalNote = sheet.querySelector("#item-note").value.trim();
          OlvCart.updateAt(idx, { qty, addons: chosenAddons, note: finalNote });
          renderCart();
          close();
        });
      }
      // التسكير بيرجع الورقة لتحت (نفس المسار اللي طلعت منه) قبل ما تنشال
      let closed = false;
      function close() {
        if (closed) return;
        closed = true;
        document.removeEventListener("keydown", onEsc);
        sheet.classList.remove("dragging", "settling");
        sheet.classList.add("closing");
        backdrop.classList.add("closing");
        const remove = () => { backdrop.remove(); sheet.remove(); };
        sheet.addEventListener("animationend", remove, { once: true });
        setTimeout(remove, 400);
      }
      function onEsc(e) { if (e.key === "Escape") close(); }
      document.addEventListener("keydown", onEsc);
      backdrop.addEventListener("click", close);
      olvAttachSwipeDismiss(sheet, backdrop, close);
      render();
      document.body.appendChild(backdrop);
      document.body.appendChild(sheet);
    }

    // يظهر حقل رقم الطاولة لطلبات "صالة" فقط، وحقل رقم تلفون الزبون
    // لطلبات "توصيل" فقط، وحقل اسم الزبون لطلبات "صالة"/"سفري" (إجباري
    // بالاتنين — تحقق الإتمام بالأسفل)، ويصفّر الحقل غير المستخدم حتى
    // ما تنتقل بيانات طلب سابق بالغلط لطلب من نوع مختلف
    function updateOrderTypeFields() {
      const type = document.getElementById("order-type").value;
      const tableField = document.getElementById("table-number-field");
      const nameField = document.getElementById("customer-name-field");
      tableField.hidden = type !== "صالة";
      nameField.hidden = type === "توصيل";
      if (type !== "صالة") document.getElementById("table-number").value = "";
      if (type === "توصيل") document.getElementById("customer-name").value = "";
      // حقل رقم الهاتف ظاهر دايمًا الآن (مش بس لطلبات التوصيل) — إجباري
      // لسا لطلبات التوصيل بس (نفس التحقق بالأسفل)، واختياري لباقي
      // الأنواع عشان يقدر الكاشير يسجّل نقاط ولاء حتى لزبون صالة/سفري
      document.getElementById("customer-phone-label").textContent =
        type === "توصيل" ? "رقم تلفون الزبون" : "رقم تلفون الزبون (اختياري — لبرنامج الولاء)";
    }

    function saveDraft() {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        items: OlvCart.all(),
        orderType: document.getElementById("order-type").value,
        tableNumber: document.getElementById("table-number").value,
        customerPhone: document.getElementById("customer-phone").value,
        customerName: document.getElementById("customer-name").value,
        discountMode,
        discountValue,
      }));
      const btn = document.getElementById("save-draft-btn");
      const original = btn.innerHTML;
      btn.innerHTML = olvIcon("check") + "<span>تم الحفظ</span>";
      setTimeout(() => { btn.innerHTML = original; }, 1500);
    }

    function restoreDraftIfAny() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return;
        const draft = JSON.parse(raw);
        if (draft.items && draft.items.length) {
          OlvCart.restore(draft.items);
          if (draft.orderType) document.getElementById("order-type").value = draft.orderType;
          updateOrderTypeFields();
          if (draft.tableNumber) document.getElementById("table-number").value = draft.tableNumber;
          if (draft.customerPhone) document.getElementById("customer-phone").value = draft.customerPhone;
          if (draft.customerName) document.getElementById("customer-name").value = draft.customerName;
          if (draft.discountValue > 0) {
            discountMode = draft.discountMode === "fixed" ? "fixed" : "percent";
            discountValue = Number(draft.discountValue) || 0;
            document.getElementById("discount-value-input").value = discountValue;
            document.getElementById("discount-form").hidden = false;
            document.getElementById("discount-toggle-btn").classList.add("active");
            document.querySelectorAll(".discount-mode-tab").forEach((btn) => {
              btn.classList.toggle("on", btn.dataset.discountMode === discountMode);
            });
          }
        }
      } catch (e) { /* تجاهل أي تذكرة محفوظة تالفة */ }
    }

    function clearDraft() {
      localStorage.removeItem(DRAFT_KEY);
    }

    function renderCart() {
      const cart = OlvCart.all();
      const list = document.getElementById("cart-list");
      const checkoutBtn = document.getElementById("checkout-btn");
      const saveDraftBtn = document.getElementById("save-draft-btn");
      const itemCount = cart.reduce((s, item) => s + item.qty, 0);
      document.getElementById("ticket-badge").textContent = itemCount;
      document.getElementById("psb-item-count").textContent = cart.length;
      document.getElementById("psb-qty-count").textContent = itemCount;
      if (!cart.length) {
        list.innerHTML = `<div class="cart-empty">السلة فارغة — اختر أصنافًا من القائمة</div>`;
        checkoutBtn.disabled = true;
        saveDraftBtn.disabled = true;
      } else {
        list.innerHTML = cart.map((item, idx) => `
          <div class="cart-item">
            <div class="cart-item-top">
              <div class="qty-badge">${item.qty}×</div>
              <div class="cart-item-info" data-edit="${idx}">
                <div class="name">${olvEsc(item.name)}</div>
                ${item.addons.length ? `<div class="meta">+ ${item.addons.map((a) => olvEsc(a.name)).join("، ")}</div>` : ""}
                ${item.note ? `<div class="meta">${olvIcon("note")} ${olvEsc(item.note)}</div>` : ""}
              </div>
              <div class="cart-item-price">${olvFormatMoney(OlvCart.lineTotal(item))}</div>
            </div>
            <div class="cart-item-controls">
              <div class="qty-stepper">
                <button type="button" data-dec="${idx}">−</button>
                <span class="qty-value">${item.qty}</span>
                <button type="button" data-inc="${idx}">+</button>
              </div>
              <button type="button" class="cart-item-remove" data-remove="${idx}" data-sound="remove" aria-label="حذف الصنف">${olvIcon("trash")}</button>
            </div>
          </div>
        `).join("");
        list.querySelectorAll("[data-edit]").forEach((el) => {
          el.addEventListener("click", () => openItemSheet(Number(el.dataset.edit)));
        });
        list.querySelectorAll("[data-inc]").forEach((btn) => {
          btn.addEventListener("click", () => {
            OlvCart.incrementQtyAt(Number(btn.dataset.inc), 1);
            renderCart();
          });
        });
        list.querySelectorAll("[data-dec]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.dec);
            const target = OlvCart.all()[idx];
            if (target && target.qty <= 1) OlvCart.removeAt(idx);
            else OlvCart.incrementQtyAt(idx, -1);
            renderCart();
          });
        });
        list.querySelectorAll("[data-remove]").forEach((btn) => {
          btn.addEventListener("click", () => {
            OlvCart.removeAt(Number(btn.dataset.remove));
            renderCart();
          });
        });
        checkoutBtn.disabled = false;
        saveDraftBtn.disabled = false;
      }
      const subtotal = OlvCart.total();
      const discountAmount = computeDiscountAmount(subtotal);
      const discountRow = document.getElementById("cart-discount-row");
      document.getElementById("cart-subtotal").textContent = olvFormatMoney(subtotal);
      if (discountAmount > 0) {
        discountRow.style.display = "";
        document.getElementById("cart-discount").textContent = "- " + olvFormatMoney(discountAmount);
      } else {
        discountRow.style.display = "none";
      }
      document.getElementById("cart-total").textContent = olvFormatMoney(subtotal - discountAmount);
    }

    function openCheckoutSheet() {
      const errBox = document.getElementById("err");
      const orderType = document.getElementById("order-type").value;
      const tableNumber = document.getElementById("table-number").value.trim();
      const customerPhone = document.getElementById("customer-phone").value.trim();
      const customerName = document.getElementById("customer-name").value.trim();
      if (orderType === "صالة" && !tableNumber) {
        olvShowError(errBox, new Error("لازم تدخل رقم الطاولة قبل إتمام طلب الصالة"));
        document.getElementById("table-number").focus();
        return;
      }
      if ((orderType === "صالة" || orderType === "سفري") && !customerName) {
        olvShowError(errBox, new Error("لازم تدخل اسم الزبون قبل إتمام الطلب"));
        document.getElementById("customer-name").focus();
        return;
      }
      if (orderType === "توصيل" && !customerPhone) {
        olvShowError(errBox, new Error("لازم تدخل رقم تلفون الزبون قبل إتمام طلب التوصيل"));
        document.getElementById("customer-phone").focus();
        return;
      }
      errBox.style.display = "none";

      const subtotal = OlvCart.total();
      const discountAmount = computeDiscountAmount(subtotal);
      const total = subtotal - discountAmount;
      const cartSnapshot = OlvCart.all().slice();
      const exact = Math.round(total * 100) / 100;
      let method = "cash";
      let receivedCents = 0;
      let isSubmitting = false;

      const backdrop = document.createElement("div");
      backdrop.className = "checkout-backdrop";
      const modal = document.createElement("div");
      modal.className = "checkout-modal";
      backdrop.appendChild(modal);

      function quickAmounts() {
        const amounts = new Set([exact]);
        [5, 10, 20, 50].forEach((denom) => {
          const rounded = Math.ceil(exact / denom) * denom;
          if (rounded > exact) amounts.add(rounded);
        });
        return Array.from(amounts).sort((a, b) => a - b).slice(0, 4);
      }

      function render() {
        const receivedAmount = receivedCents / 100;
        const change = receivedAmount - exact;
        const canConfirm = method !== "cash" || receivedAmount >= exact;

        modal.innerHTML = `
          <div class="checkout-head">
            <h2>إتمام الدفع</h2>
            <button type="button" class="checkout-close" id="checkout-close">${olvIcon("x")}</button>
          </div>
          <div class="checkout-total">
            <div class="label">الإجمالي المطلوب</div>
            <div class="amount" dir="ltr">${olvFormatMoney(exact)}</div>
          </div>
          <div class="checkout-summary">
            ${cartSnapshot.map((item) => `
              <div class="row"><span>${item.qty}× ${olvEsc(item.name)}</span><span>${olvFormatMoney(OlvCart.lineTotal(item))}</span></div>
            `).join("")}
            ${discountAmount > 0 ? `
              <div class="row"><span>المجموع الفرعي</span><span>${olvFormatMoney(subtotal)}</span></div>
              <div class="row"><span>الخصم${discountMode === "percent" ? ` (${discountValue}%)` : ""}</span><span>- ${olvFormatMoney(discountAmount)}</span></div>
            ` : ""}
          </div>
          <div class="pm-tiles">
            <button type="button" class="pm-tile${method === "cash" ? " on" : ""}" data-method="cash">${olvIcon("banknote")}كاش</button>
            <button type="button" class="pm-tile${method === "card" ? " on" : ""}" data-method="card">${olvIcon("creditCard")}شبكة</button>
            <button type="button" class="pm-tile${method === "delivery" ? " on" : ""}" data-method="delivery">${olvIcon("mapPin")}توصيل</button>
          </div>
          ${method === "cash" ? `
            <div class="cash-panel">
              <div class="received-row">
                <span class="label">المبلغ المستلم</span>
                <span class="value" dir="ltr">${olvFormatMoney(receivedAmount)}</span>
              </div>
              <div class="quick-amounts">
                ${quickAmounts().map((amt) => `<button type="button" data-amt="${amt}">${amt === exact ? "بالضبط" : olvFormatMoney(amt)}</button>`).join("")}
              </div>
              <div class="keypad">
                ${["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "⌫"].map((k) => `<button type="button" data-key="${k}">${k}</button>`).join("")}
              </div>
              <div class="change-row${change < 0 ? " insufficient" : ""}">
                <span class="label">${change < 0 ? "المتبقي على الزبون" : "الباقي للزبون"}</span>
                <span class="value" dir="ltr">${olvFormatMoney(Math.abs(change))}</span>
              </div>
            </div>
          ` : ""}
          <button type="button" class="btn gold checkout-confirm" id="checkout-confirm"${canConfirm ? "" : " disabled"}>تأكيد الدفع</button>
          <div class="checkout-success" id="checkout-success">
            <div class="check">${olvIcon("check")}</div>
            <div class="msg">تم تسجيل البيع بنجاح</div>
          </div>
        `;

        modal.querySelector("#checkout-close").addEventListener("click", close);
        modal.querySelectorAll(".pm-tile").forEach((btn) => {
          btn.addEventListener("click", () => { method = btn.dataset.method; render(); });
        });
        if (method === "cash") {
          modal.querySelectorAll(".quick-amounts button").forEach((btn) => {
            btn.addEventListener("click", () => { receivedCents = Math.round(Number(btn.dataset.amt) * 100); render(); });
          });
          modal.querySelectorAll(".keypad button").forEach((btn) => {
            btn.addEventListener("click", () => {
              const k = btn.dataset.key;
              if (k === "C") receivedCents = 0;
              else if (k === "⌫") receivedCents = Math.floor(receivedCents / 10);
              else receivedCents = Math.min(receivedCents * 10 + Number(k), 99999999);
              render();
            });
          });
        }
        modal.querySelector("#checkout-confirm").addEventListener("click", confirmPayment);
      }

      async function confirmPayment() {
        const confirmBtn = modal.querySelector("#checkout-confirm");
        const closeBtn = modal.querySelector("#checkout-close");
        confirmBtn.disabled = true;
        if (closeBtn) closeBtn.disabled = true;
        isSubmitting = true;
        const errBox = document.getElementById("err");
        try {
          let extraNotes = "بيع سريع";
          let cashReceived = null;
          let changeDue = null;
          if (method === "cash") {
            cashReceived = receivedCents / 100;
            changeDue = Math.max(cashReceived - exact, 0);
            extraNotes += ` — مستلم ${olvFormatMoney(cashReceived)}، الباقي ${olvFormatMoney(changeDue)}`;
          }
          const queuedBefore = window.olvGetOfflineQueueCount ? window.olvGetOfflineQueueCount() : 0;
          await OlvCart.checkout({
            paymentMethod: method, entryDate: olvToday(), extraNotes, orderType, cashReceived, changeDue,
            tableNumber: tableNumber || null, customerPhone: customerPhone || null, customerName: customerName || null,
            discountAmount,
          });
          if (orderType === "صالة" && tableNumber) markTableOccupied(tableNumber);
          clearDraft();
          resetDiscount();
          renderCart();
          refreshPopularityAndGrid();
          // لو النت مقطوع، الطلب انحفظ محليًا بس (offline-queue.js) وما وصل لقاعدة
          // البيانات — فما رح ينطبع للمطبخ/البار قبل رجوع النت. لازم الكاشير يعرف
          // بوضوح ويبلّغ المطبخ شفهيًا، مو يفكر إن كل شي تمام
          const queued = window.olvGetOfflineQueueCount && window.olvGetOfflineQueueCount() > queuedBefore;
          if (queued) {
            const msgEl = modal.querySelector("#checkout-success .msg");
            msgEl.innerHTML = "الطلب محفوظ محليًا <b>ولم يُرسل للمطبخ/البار بعد</b><br>بلّغهم شفهيًا — بينطبع لما يرجع النت";
            msgEl.style.color = "var(--danger-hi)";
            msgEl.style.textAlign = "center";
            msgEl.style.lineHeight = "1.7";
          }
          modal.querySelector("#checkout-success").classList.add("show");
          // الكاشير ما لازم يستنى: لمسة على شاشة النجاح بتسكّرها فورًا (ومؤقت 650ms للحالة العادية)
          modal.querySelector("#checkout-success").addEventListener("click", close);
          if (typeof OlvSound !== "undefined") queued ? OlvSound.playError() : OlvSound.playSuccess();
          isSubmitting = false;
          setTimeout(close, queued ? 6000 : 650);
        } catch (err) {
          olvShowError(errBox, err);
          confirmBtn.disabled = false;
          if (closeBtn) closeBtn.disabled = false;
          isSubmitting = false;
        }
      }

      // يمنع إغلاق النافذة (بالضغط بره أو زر ✕) أثناء إرسال عملية البيع
      // فعليًا، حتى ما تختفي الشاشة قبل ما يتأكد الكاشير إنها نجحت
      let closingModal = false;
      function close() {
        if (isSubmitting || closingModal) return;
        closingModal = true;
        backdrop.classList.remove("in"); // خروج: بيتلاشى 150ms بنفس مسار الدخول ثم بينشال
        setTimeout(() => backdrop.remove(), 170);
      }
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      render();
      document.body.appendChild(backdrop);
      requestAnimationFrame(() => backdrop.classList.add("in"));
    }

    // يعيد تحميل ترتيب "الأكثر مبيعًا" من قاعدة البيانات ويعيد رسم القائمة —
    // يُستدعى عند فتح الشاشة، وأيضًا بعد كل عملية بيع (لأن الشاشة صارت
    // تبقى مفتوحة على نفسها بدل الانتقال لصفحة أخرى)
    // المنيو بينحمّل مرة وحدة لما تنفتح الشاشة، والكاشير بيضل فاتحها طول اليوم: منحدّثه كل 5 دقايق
    // ولما ترجع للشاشة، ومنصحّح أسعار السلة (والمسودة المحفوظة) لآخر سعر — السيرفر بيحسب بالسعر
    // الحالي، فأي فرق كان بيطلع «خصم» مش مقصود أو رفض «الخصم يتعدى الحد»
    function syncCartPrices() {
      const byId = new Map(products.map((p) => [p.id, p]));
      const addonById = new Map(addons.map((a) => [a.id, a]));
      let changed = 0;
      const gone = [];
      OlvCart.all().forEach((item, idx) => {
        const p = byId.get(item.productId);
        if (!p) { gone.push(item.name); return; }
        const newAddons = item.addons.map((a) => (addonById.has(a.id) ? { ...a, price: Number(addonById.get(a.id).price) } : a));
        const priceDiff = Number(p.price) !== item.unitBase || newAddons.some((a, i) => a.price !== item.addons[i].price);
        if (priceDiff) { OlvCart.updateAt(idx, { unitBase: Number(p.price), addons: newAddons }); changed++; }
      });
      if (changed) showToast(`تحدّث سعر ${changed} صنف بالسلة حسب المنيو الحالي`, "var(--gold-dp)", "tag");
      if (gone.length) showToast(`انتبه: ${gone.join("، ")} مش موجود بالمنيو هلأ`, "var(--danger)", "warning");
      if (changed || gone.length) renderCart();
    }
    async function refreshMenu() {
      const [{ data: prodData, error: e1 }, { data: addonData, error: e2 }] = await Promise.all([
        window.supabaseClient.from("products").select("*").eq("is_active", true).order("category").order("sort_order"),
        window.supabaseClient.from("addons").select("*").eq("is_active", true).order("name"),
      ]);
      if (e1 || e2 || !prodData) return;
      products = prodData;
      addons = addonData || [];
      renderCategoryTabs();
      renderGrid();
      syncCartPrices();
    }

    async function refreshPopularityAndGrid() {
      const { data: salesData, error } = await window.supabaseClient.from("product_sales_totals").select("*");
      if (error) return;
      popularity = {};
      (salesData || []).forEach((r) => { popularity[r.product_id] = Number(r.total_qty); });
      renderCategoryTabs();
      renderGrid();
    }

    (async () => {
      session = await olvRequireAuth();
      if (!session) return;
      const errBox = document.getElementById("err");
      if (window.olvRole === "staff") {
        try {
          const { data: lim } = await window.supabaseClient
            .from("app_settings").select("value").eq("key", "staff_max_discount_percent").maybeSingle();
          const n = lim ? Number(lim.value) : 10;
          staffMaxDiscountPct = Number.isFinite(n) ? n : 10;
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.style.cssText = "font-size:12px; margin-top:6px;";
          hint.textContent = staffMaxDiscountPct > 0
            ? `أقصى خصم مسموح للكاشير: ${staffMaxDiscountPct}% — أكثر من هيك بيحتاج مدير`
            : "الخصم غير مسموح للكاشير — بيحتاج مدير";
          document.getElementById("discount-form").appendChild(hint);
        } catch (e) { /* السيرفر بيفرض الحد بأي حال */ }
      }
      try {
        const [{ data: prodData, error: e1 }, { data: addonData, error: e2 }, { data: salesData, error: e3 }] = await Promise.all([
          window.supabaseClient.from("products").select("*").eq("is_active", true).order("category").order("sort_order"),
          window.supabaseClient.from("addons").select("*").eq("is_active", true).order("name"),
          window.supabaseClient.from("product_sales_totals").select("*"),
        ]);
        if (e1) throw e1;
        if (e2) throw e2;
        products = prodData || [];
        addons = addonData || [];
        popularity = {};
        (salesData || []).forEach((r) => { popularity[r.product_id] = Number(r.total_qty); });
        renderCategoryTabs();
        renderGrid();
      } catch (err) {
        olvShowError(errBox, err);
      }
      updateOrderTypeFields();
      restoreDraftIfAny();
      renderCart();
      document.getElementById("order-type").addEventListener("change", updateOrderTypeFields);
      document.getElementById("checkout-btn").addEventListener("click", openCheckoutSheet);
      // فحص سريع (مو إجباري) لما الكاشير يخلص كتابة رقم هاتف — لو الرقم
      // لزبون متكرر موجود أصلًا ببرنامج الولاء، بيطلعله تنبيه ترحيبي
      document.getElementById("customer-phone").addEventListener("blur", async (e) => {
        const phone = e.target.value.trim();
        if (!phone) return;
        const { data } = await window.supabaseClient
          .from("customers").select("name, visit_count, points_balance").eq("phone", phone).maybeSingle();
        if (data) {
          showToast(`عميل متكرر: ${data.name || phone} — زيارة رقم ${data.visit_count + 1}، ${data.points_balance} نقطة`, "var(--gold-dp)", "star");
        }
      });
      document.getElementById("save-draft-btn").addEventListener("click", saveDraft);
      document.getElementById("discount-toggle-btn").addEventListener("click", () => {
        const form = document.getElementById("discount-form");
        form.hidden = !form.hidden;
        if (!form.hidden) document.getElementById("discount-value-input").focus();
      });
      document.querySelectorAll(".discount-mode-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          discountMode = btn.dataset.discountMode;
          document.querySelectorAll(".discount-mode-tab").forEach((b) => b.classList.toggle("on", b === btn));
          renderCart();
        });
      });
      document.getElementById("discount-value-input").addEventListener("input", (e) => {
        discountValue = Math.max(0, Number(e.target.value) || 0);
        // الكاشير: نرجّع القيمة المكتوبة للسقف المسموح فعلًا (بدل ما تبين 50% والمحسوب أقل)
        if (staffMaxDiscountPct !== null && discountValue > 0) {
          const cap = discountMode === "percent"
            ? staffMaxDiscountPct
            : Math.floor(OlvCart.total() * staffMaxDiscountPct) / 100;
          if (discountValue > cap) {
            discountValue = cap;
            e.target.value = cap;
            showToast(`أقصى خصم للكاشير ${staffMaxDiscountPct}% — أكثر من هيك بيحتاج مدير`, "var(--danger)", "warning");
          }
        }
        document.getElementById("discount-toggle-btn").classList.toggle("active", discountValue > 0);
        renderCart();
      });
      document.getElementById("discount-remove-btn").addEventListener("click", resetDiscount);
      document.getElementById("product-search").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim().toLowerCase();
        currentPage = 1;
        renderGrid();
      });
      document.getElementById("page-prev").addEventListener("click", () => { currentPage--; renderGrid(); });
      document.getElementById("page-next").addEventListener("click", () => { currentPage++; renderGrid(); });
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { updateNavHeight(); updateStatusBarHeight(); renderGrid(); }, 200);
      });

      syncCartPrices(); // مسودة محفوظة من قبل ممكن تكون بأسعار قديمة
      setInterval(refreshMenu, 5 * 60 * 1000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshMenu(); });

      await checkForReadyOrders();
      setInterval(checkForReadyOrders, 15000);
    })();
    });
  </script>
  <footer class="olv-footer">© 2026 مهند — جميع الحقوق محفوظة</footer>

  <script>
    // ================= حركة الإصبع على طريقة Apple =================
    // الإسقاط بالزخم: وين رح توقف الحركة لو كمّلت بنفس سرعة الإصبع وتباطأت
    // تدريجيًا (نفس معادلة التمرير بـiOS) — منقرر الحالة النهائية حسب هاد
    // المكان المتوقَّع، مش حسب وين رفع المستخدم إصبعه، فرمية قصيرة سريعة بتكفي
    function olvProject(velocity, decel) {
      const d = decel || 0.998;
      return (velocity / 1000) * d / (1 - d);
    }
    // مقاومة مطّاطية: كل ما سحبت أبعد من الحد، كل ما لحقك العنصر أقل
    function olvRubberband(overshoot, dimension) {
      const c = 0.55;
      return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
    }
    // سرعة الإصبع (px/s) من آخر ~100ms من الحركة
    function olvVelocity(samples) {
      if (samples.length < 2) return 0;
      const last = samples[samples.length - 1];
      let first = samples[0];
      for (const p of samples) { if (last.t - p.t <= 100) { first = p; break; } }
      const dt = last.t - first.t;
      return dt > 0 ? ((last.y - first.y) / dt) * 1000 : 0;
    }
    function olvCurrentY(el) {
      const t = getComputedStyle(el).transform;
      return t && t !== "none" ? new DOMMatrixReadOnly(t).m42 : 0;
    }

    // ورقة سفلية بتنسحب لتحت لتتسكّر: بتلحق الإصبع 1:1 من مكان المسكة،
    // بتقاوم لفوق، وبتقرر تتسكّر أو ترجع حسب الزخم
    function olvAttachSwipeDismiss(sheet, backdrop, onDismiss) {
      let pid = null, startY = 0, y = 0, samples = [];
      sheet.addEventListener("pointerdown", (e) => {
        if (!e.target.closest(".sheet-grabber, h2") || sheet.classList.contains("closing")) return;
        pid = e.pointerId;
        sheet.setPointerCapture(pid);
        y = olvCurrentY(sheet); // نبدأ من المكان الظاهر حاليًا (ولو كانت لسا عم تتحرك)
        startY = e.clientY - y;
        sheet.classList.remove("settling");
        sheet.classList.add("dragging");
        sheet.style.transform = `translateY(${y}px)`;
        samples = [{ t: e.timeStamp, y: e.clientY }];
      });
      sheet.addEventListener("pointermove", (e) => {
        if (e.pointerId !== pid) return;
        let d = e.clientY - startY;
        if (d < 0) d = -olvRubberband(-d, sheet.offsetHeight);
        y = d;
        sheet.style.transform = `translateY(${y}px)`;
        backdrop.style.opacity = String(1 - Math.min(Math.max(y, 0) / sheet.offsetHeight, 1));
        samples.push({ t: e.timeStamp, y: e.clientY });
        if (samples.length > 20) samples.shift();
      });
      const end = (e) => {
        if (e.pointerId !== pid) return;
        pid = null;
        const v = olvVelocity(samples);
        const projected = y + olvProject(v);
        sheet.classList.remove("dragging");
        if (projected > sheet.offsetHeight * 0.45 && y > 4) {
          sheet.style.setProperty("--sheet-y", y + "px");
          backdrop.style.setProperty("--backdrop-o", backdrop.style.opacity || "1");
          backdrop.style.opacity = "";
          onDismiss();
        } else {
          sheet.classList.add("settling");
          sheet.style.transform = "translateY(0)";
          backdrop.style.opacity = "";
        }
      };
      sheet.addEventListener("pointerup", end);
      sheet.addEventListener("pointercancel", end);
    }

    // التذكرة على الموبايل: مطوية/مفتوحة، بالضغط أو بالسحب مع الزخم.
    // الانتقال بين الحالتين بتقنية FLIP: منقيس مكان الورقة قبل وبعد تغيّر
    // الحجم، ومنحرّكها من مكانها الظاهر للمكان الجديد بدون قفزة
    document.addEventListener("DOMContentLoaded", () => {
      const panel = document.getElementById("pos-cart-panel");
      const grabber = document.getElementById("cart-grabber");
      const header = document.getElementById("ticket-header");
