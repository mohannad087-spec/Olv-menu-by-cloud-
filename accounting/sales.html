<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المبيعات — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a09">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاسبة OLV">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode') || 'auto';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  function applyCustomTheme(){
    var root = document.documentElement.style;
    var props = ['--ink', '--ink-2', '--ink-3', '--paper', '--muted', '--hair', '--hair-soft',
      '--overlay-bg', '--gold', '--gold-hi', '--gold-dp', '--gold-rgb', '--on-gold'];
    try {
      var raw = localStorage.getItem('olv_custom_theme');
      var t = raw ? JSON.parse(raw) : null;
      if (!t) {
        props.forEach(function (p) { root.removeProperty(p); });
        return false;
      }
      document.documentElement.setAttribute('data-theme', t.isDark ? 'dark' : 'light');
      root.setProperty('--ink', t.ink);
      root.setProperty('--ink-2', t.ink2);
      root.setProperty('--ink-3', t.ink3);
      root.setProperty('--paper', t.paper);
      root.setProperty('--muted', t.muted);
      root.setProperty('--hair', t.hair);
      root.setProperty('--hair-soft', t.hairSoft);
      root.setProperty('--overlay-bg', t.overlayBg);
      root.setProperty('--gold', t.gold);
      root.setProperty('--gold-hi', t.goldHi);
      root.setProperty('--gold-dp', t.goldDp);
      root.setProperty('--gold-rgb', t.goldRgb);
      root.setProperty('--on-gold', t.onGold);
      return true;
    } catch (e) {
      props.forEach(function (p) { root.removeProperty(p); });
      return false;
    }
  }
  window.olvApplyTheme = function(){
    var theme = computeTheme();
    document.documentElement.setAttribute('data-theme', theme);
    window.olvCustomThemeActive = applyCustomTheme();
  };
  window.olvApplyTheme();
})();
</script>
<style>
  .addon-row{display:flex; align-items:center; gap:10px; padding:12px 0; cursor:pointer; width:100%;}
  .addon-row .addon-name{flex:1; font-size:13.5px;}
  .addon-row .a-price{color:var(--muted); font-size:12.5px;}
  .cart-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--hair-soft,rgba(var(--gold-rgb),.1)); font-size:13.5px;}
  .cart-item .meta{color:var(--muted); font-size:12px;}
  .meta .icon{width:12px; height:12px; vertical-align:-1px;}
  .row-voided{opacity:.55;}
  .status-voided{color:var(--danger-hi); font-weight:700; font-size:12.5px;}
  .status-completed{color:var(--ok); font-size:12.5px;}
  .status-voided .icon, .status-completed .icon{width:12px; height:12px; vertical-align:-1px;}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .items-detail{background:var(--ink-3); border-radius:10px; padding:10px 14px;}
  .item-detail-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid var(--hair-soft,rgba(var(--gold-rgb),.1)); font-size:13px;
  }
  .item-detail-row:last-child{border-bottom:none;}
  .item-detail-row .name{flex:1;}
  .item-detail-row .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .item-voided{opacity:.5; text-decoration:line-through;}
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="group" id="manual-sale-group">
      <h2>إضافة أصناف مباعة</h2>
      <div class="row2">
        <div class="field">
          <label>الصنف</label>
          <select id="product-select"></select>
        </div>
        <div class="field">
          <label>الكمية</label>
          <input type="number" id="qty-input" min="1" value="1">
        </div>
      </div>
      <div id="addon-picker"></div>
      <div class="field">
        <label>ملاحظة للمطبخ (اختياري)</label>
        <input type="text" id="item-note-input" placeholder="مثال: بدون بصل">
      </div>
      <button class="btn gold" id="add-line-btn">إضافة للسلة</button>
    </div>

    <div class="group" id="cart-group" hidden>
      <h2>السلة</h2>
      <div id="cart-list"></div>
      <div class="row2" style="margin-top:14px;">
        <div class="field">
          <label>التاريخ</label>
          <input type="date" id="entry_date">
        </div>
        <div class="field">
          <label>نوع الطلب</label>
          <select id="order-type">
            <option value="صالة">صالة</option>
            <option value="سفري">سفري</option>
            <option value="توصيل">توصيل</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>طريقة الدفع</label>
          <select id="pay-method">
            <option value="cash">كاش</option>
            <option value="card">شبكة / فيزا</option>
            <option value="delivery">توصيل / تطبيقات</option>
          </select>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>الإجمالي: <b id="cart-total">0.00</b></div>
        <button class="btn gold" id="save-btn">حفظ المبيعات</button>
      </div>
    </div>

    <div class="group">
      <h2>سجل المبيعات</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>كاش</th><th>شبكة</th><th>توصيل</th><th>الإجمالي</th><th>ملاحظات</th><th>الحالة</th><th></th></tr></thead>
          <tbody id="sales-body">
            <tr class="empty-row"><td colspan="8">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/offline-queue.js"></script>
  <script defer src="assets/supabase-client.js"></script>
  <script defer src="assets/auth-guard.js"></script>
  <script defer src="assets/layout.js"></script>
  <script defer src="assets/notify-sound.js"></script>
  <script defer src="assets/reprint.js"></script>
  <script defer src="assets/connection-status.js"></script>
  <script defer src="assets/incoming-orders-poll.js"></script>
  <script defer src="assets/low-stock-poll.js"></script>
  <script defer src="assets/print-health.js"></script>
  <script defer src="assets/sale-cart.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    olvRenderNav("sales");

    let products = [];
    let addons = [];

    function renderAddonPicker() {
      const el = document.getElementById("addon-picker");
      if (!addons.length) { el.innerHTML = ""; return; }
      el.innerHTML = addons.map((a) => `
        <label class="addon-row" for="sa-${a.id}">
          <input type="checkbox" data-addon="${a.id}" id="sa-${a.id}">
          <span class="addon-name">${olvEsc(a.name)}</span>
          <span class="a-price">+${olvFormatMoney(a.price)}</span>
        </label>
      `).join("");
    }

    function selectedAddons() {
      return addons.filter((a) => document.getElementById(`sa-${a.id}`)?.checked);
    }

    function renderCart() {
      const cart = OlvCart.all();
      const group = document.getElementById("cart-group");
      const list = document.getElementById("cart-list");
      if (!cart.length) { group.hidden = true; return; }
      group.hidden = false;
      list.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div>
            <div>${item.qty}× ${olvEsc(item.name)}</div>
            ${item.addons.length ? `<div class="meta">+ ${item.addons.map((a) => olvEsc(a.name)).join("، ")}</div>` : ""}
            ${item.note ? `<div class="meta">${olvIcon("note")} ${olvEsc(item.note)}</div>` : ""}
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span>${olvFormatMoney(OlvCart.lineTotal(item))}</span>
            <button class="btn small danger" data-idx="${idx}">حذف</button>
          </div>
        </div>
      `).join("");
      list.querySelectorAll("button[data-idx]").forEach((btn) => {
        btn.addEventListener("click", () => { OlvCart.removeAt(Number(btn.dataset.idx)); renderCart(); });
      });
      document.getElementById("cart-total").textContent = olvFormatMoney(OlvCart.total());
    }

    document.getElementById("add-line-btn").addEventListener("click", () => {
      const productId = document.getElementById("product-select").value;
      const product = products.find((p) => p.id === productId);
      if (!product) return;
      const qty = Math.max(1, Number(document.getElementById("qty-input").value || 1));
      const note = document.getElementById("item-note-input").value.trim();
      OlvCart.add(product, selectedAddons(), qty, note);
      document.getElementById("qty-input").value = 1;
      document.getElementById("item-note-input").value = "";
      addons.forEach((a) => { const cb = document.getElementById(`sa-${a.id}`); if (cb) cb.checked = false; });
      renderCart();
    });

    document.getElementById("save-btn").addEventListener("click", async () => {
      const errBox = document.getElementById("err");
      errBox.style.display = "none";
      const btn = document.getElementById("save-btn");
      btn.disabled = true;
      try {
        const method = document.getElementById("pay-method").value;
        const entryDate = document.getElementById("entry_date").value || olvToday();
        const orderType = document.getElementById("order-type").value;
        await OlvCart.checkout({ paymentMethod: method, entryDate, orderType });
        renderCart();
        await loadSales();
      } catch (err) {
        olvShowError(errBox, err);
      } finally {
        btn.disabled = false;
      }
    });

    let expandedSaleId = null;

    // السيرفر بيرفض الإلغاء بدون سبب واضح (3 أحرف على الأقل) — نسأل هون لحد ما
    // يكتب سبب أو يتراجع
    function askVoidReason() {
      for (;;) {
        const r = prompt("سبب الإلغاء (إلزامي، 3 أحرف على الأقل):");
        if (r === null) return null;
        if (r.trim().length >= 3) return r.trim();
        alert("لازم تكتب سبب واضح للإلغاء");
      }
    }

    // سجل إعادات طباعة الفاتورة (مين، ليش، ومتى) — ما بيتعدّل ولا بيتمسح
    function renderReprintHistory(sale) {
      const list = sale.reprints || [];
      if (!list.length) return "";
      return `<div class="item-detail-row" style="flex-direction:column; align-items:stretch; gap:4px;">
        <div><b>${olvIcon("printer")} إعادات الطباعة (${list.length})</b></div>
        ${list.map((rp) => `<div class="meta">نسخة ${olvEsc(rp.reprint_no)} — ${olvEsc(new Date(rp.created_at).toLocaleString("ar-EG", { numberingSystem: "latn" }))}
          — ${olvEsc(rp.printed_by_name || "—")} — السبب: ${olvEsc(rp.reason)}</div>`).join("")}
      </div>`;
    }

    function renderItemsDetail(sale) {
      const items = sale.sale_items || [];
      if (!items.length) return `<div class="hint">لا توجد أصناف مسجّلة لهذا الطلب</div>` + renderReprintHistory(sale);
      const saleVoided = sale.status === "voided";
      return items.map((it) => {
        const itemVoided = it.status === "voided";
        const lineTotal = (Number(it.unit_price) + Number(it.addons_total || 0)) * Number(it.qty);
        return `
          <div class="item-detail-row">
            <div class="name ${itemVoided ? "item-voided" : ""}">
              <div>${it.qty}× ${olvEsc(it.product_name)}</div>
              ${it.addons_summary ? `<div class="meta">+ ${olvEsc(it.addons_summary)}</div>` : ""}
              ${it.note ? `<div class="meta">${olvIcon("note")} ${olvEsc(it.note)}</div>` : ""}
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span>${olvFormatMoney(lineTotal)}</span>
              ${itemVoided
                ? `<span class="status-voided">ملغى</span>`
                : (saleVoided ? "" : `<button class="btn small danger" data-void-item="${it.id}">إلغاء الصنف</button>`)
              }
            </div>
          </div>
        `;
      }).join("") + renderReprintHistory(sale);
    }

    async function loadSales() {
      const errBox = document.getElementById("err");
      const body = document.getElementById("sales-body");
      try {
        const { data, error } = await window.supabaseClient
          .from("sales_entries").select("*, sale_items(*)").order("entry_date", { ascending: false }).limit(60);
        if (error) throw error;
        if (!data || !data.length) {
          body.innerHTML = `<tr class="empty-row"><td colspan="8">لا يوجد مبيعات مسجّلة بعد</td></tr>`;
          return;
        }
        // إعادات الطباعة (لو schema-reprint.sql لسا ما انشغّل، بنكمّل بدونها)
        const { data: reprints } = await window.supabaseClient
          .from("receipt_reprints").select("*").in("sale_id", data.map((r) => r.id)).order("created_at");
        const reprintsBySale = {};
        (reprints || []).forEach((rp) => { (reprintsBySale[rp.sale_id] = reprintsBySale[rp.sale_id] || []).push(rp); });
        data.forEach((r) => { r.reprints = reprintsBySale[r.id] || []; });
        body.innerHTML = data.map((r) => {
          const total = Number(r.cash_amount) + Number(r.card_amount) + Number(r.delivery_amount);
          const voided = r.status === "voided";
          const itemCount = (r.sale_items || []).length;
          const rows = [`<tr class="${voided ? "row-voided" : ""}">
            <td>${r.entry_date}</td>
            <td>${olvFormatMoney(r.cash_amount)}</td>
            <td>${olvFormatMoney(r.card_amount)}</td>
            <td>${olvFormatMoney(r.delivery_amount)}</td>
            <td>${olvFormatMoney(total)}</td>
            <td>${olvEsc(r.notes) || "—"}${Number(r.discount_amount) > 0 ? ` <b style="color:var(--danger-hi);">[خصم مسجَّل ${olvFormatMoney(r.discount_amount)}]</b>` : ""}${voided && r.void_reason ? ` — سبب الإلغاء: ${olvEsc(r.void_reason)}` : ""}</td>
            <td>${voided ? `<span class="status-voided">${olvIcon("x")} ملغى</span>` : `<span class="status-completed">${olvIcon("check")} مكتمل</span>`}</td>
            <td>
              <div class="row-actions">
                <button class="btn small" data-toggle="${r.id}">الأصناف (${itemCount})</button>
                ${voided ? "" : `<button class="btn small" data-reprint="${r.id}" data-label="${olvEsc(r.order_no ? "طلب " + r.order_no : r.entry_date)} — ${olvFormatMoney(total)}">${olvIcon("printer")} إعادة طباعة${r.reprints.length ? ` (${r.reprints.length})` : ""}</button>`}
                ${voided ? "" : `<button class="btn small danger" data-void="${r.id}">إلغاء الطلب</button>`}
              </div>
            </td>
          </tr>`];
          rows.push(`<tr id="items-${r.id}" ${expandedSaleId === r.id ? "" : "hidden"}>
            <td colspan="8"><div class="items-detail">${renderItemsDetail(r)}</div></td>
          </tr>`);
          return rows.join("");
        }).join("");

        body.querySelectorAll("button[data-toggle]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.toggle;
            const row = document.getElementById(`items-${id}`);
            const nowHidden = !row.hidden;
            row.hidden = nowHidden;
            expandedSaleId = nowHidden ? null : id;
          });
        });
        body.querySelectorAll("button[data-reprint]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const done = await olvReprintSale(btn.dataset.reprint, btn.dataset.label);
            if (done) { expandedSaleId = btn.dataset.reprint; await loadSales(); }
          });
        });
        body.querySelectorAll("button[data-void]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("متأكد من إلغاء هذا الطلب؟ سيرجع كل ما استهلكه من مواد خام إلى المخزون تلقائيًا، ولن يُحتسب ضمن المبيعات أو التقارير بعد الآن.")) return;
            const reason = askVoidReason();
            if (!reason) return;
            btn.disabled = true;
            const { error } = await window.supabaseClient.rpc("void_sale", { p_sale_id: btn.dataset.void, p_reason: reason });
            if (error) { olvShowError(errBox, error); btn.disabled = false; return; }
            await loadSales();
          });
        });
        body.querySelectorAll("button[data-void-item]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("متأكد من إلغاء هذا الصنف فقط؟ سيرجع للمخزون وينقص من إجمالي الطلب، وباقي الأصناف تضل كما هي.")) return;
            const reason = askVoidReason();
            if (!reason) return;
            btn.disabled = true;
            const { error } = await window.supabaseClient.rpc("void_sale_item", { p_sale_item_id: btn.dataset.voidItem, p_reason: reason });
            if (error) { olvShowError(errBox, error); btn.disabled = false; return; }
            expandedSaleId = btn.closest("tr").id.replace("items-", "");
            await loadSales();
          });
        });
      } catch (err) {
        olvShowError(errBox, err);
      }
    }

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      // إضافة مبيعات يدويًا من هون للمالك والمدير بس؛ الكاشير يبيع من "بيع سريع"
      // فقط (واجهة فقط — البيع كله بيمرّ بنفس الدالة المحروسة بالسيرفر)
      if (window.olvRole === "staff") {
        ["manual-sale-group", "cart-group"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.style.setProperty("display", "none", "important");
        });
      }
      document.getElementById("entry_date").value = olvToday();
      const errBox = document.getElementById("err");
      try {
        const [{ data: prodData, error: e1 }, { data: addonData, error: e2 }] = await Promise.all([
          window.supabaseClient.from("products").select("*").eq("is_active", true).order("category").order("sort_order"),
          window.supabaseClient.from("addons").select("*").eq("is_active", true).order("name"),
        ]);
        if (e1) throw e1;
        if (e2) throw e2;
        products = prodData || [];
        addons = addonData || [];
        const byCategory = {};
        products.forEach((p) => {
          const cat = p.category || "عام";
          (byCategory[cat] = byCategory[cat] || []).push(p);
        });
        document.getElementById("product-select").innerHTML = Object.keys(byCategory).map((cat) => `
          <optgroup label="${olvEsc(cat)}">
            ${byCategory[cat].map((p) => `<option value="${p.id}">${olvEsc(p.name)} — ${olvFormatMoney(p.price)}</option>`).join("")}
          </optgroup>
        `).join("");
        renderAddonPicker();
      } catch (err) {
        olvShowError(errBox, err);
      }
      await loadSales();
    })();
    });
  </script>
  <footer class="olv-footer">© 2026 مهند — جميع الحقوق محفوظة</footer>
</body>
</html>
