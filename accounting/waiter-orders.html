<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>طلبات الطاولات — OLV</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* تابلت الويتر (2026-10-30): شاشتين بس (الطاولات ← الطلب)، بدون دفع وبدون تنقل. القواعد من design-system/olv/MASTER.md + pages/waiter.md */
  body{margin:0; background:var(--ink); color:var(--paper); font-family:Tajawal,sans-serif; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  .wt-top{display:flex; align-items:center; gap:12px; padding:10px 18px; position:sticky; top:0; z-index:5; isolation:isolate;}
  .wt-top::before{content:""; position:absolute; inset:0; z-index:-1; background:var(--glass); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border-bottom:1px solid var(--glass-line, var(--hair-soft));}
  .wt-top h1{font-size:clamp(20px,3vw,26px); font-weight:800; margin:0; flex:1; line-height:1.2;}
  .wt-top .who{color:var(--muted); font-size:14px;}
  .wt-top .btn{min-height:48px;}
  .wt-top [hidden]{display:none;}
  .wt-err{margin:12px 18px 0; padding:12px 14px; border-radius:14px; background:var(--ink-3); color:var(--danger-hi); font-weight:700; display:none;}
  .wt-wrap{max-width:var(--page-max,1320px); margin:0 auto;}
  .wt-legend{display:flex; gap:16px; flex-wrap:wrap; padding:14px 18px 0; color:var(--muted); font-size:13.5px;}
  .wt-legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-inline-end:6px; vertical-align:middle;}
  .wt-tables{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; padding:14px 18px 24px;}
  .wt-table{min-height:112px; border-radius:22px; border:1.5px dashed var(--hair); background:transparent; color:var(--paper); font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px; transition:transform .2s var(--spring), border-color .16s;}
  .wt-table:active{transform:scale(.97); transition-duration:.08s;}
  .wt-table .n{font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  .wt-table .s{font-size:13.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .wt-table .s i{width:8px; height:8px; border-radius:50%; background:var(--olive);}
  .wt-table.busy{border:1px solid var(--hair-soft); border-inline-start:5px solid var(--gold); background:var(--ink-2);}
  .wt-table.busy .tot{color:var(--gold-hi); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums;}
  .wt-table.busy .s.late{color:var(--gold-hi);}
  .wt-search{display:flex; align-items:center; gap:8px; margin:14px 18px 0; padding:0 14px; min-height:52px; border-radius:16px; border:1px solid var(--hair); background:var(--ink-2);}
  .wt-search input{flex:1; min-width:0; border:0 !important; background:transparent !important; box-shadow:none !important; padding:0 !important; color:var(--paper); font:inherit; font-size:16px; min-height:48px; outline:0;}
  .wt-search .icon{width:20px; height:20px; color:var(--muted);}
  .wt-search + .wt-tables{padding-top:12px;}
  #menu-pane .wt-search{margin:0 0 10px;}
  .wt-order{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; padding:14px 18px 24px; align-items:start;}
  .wt-order > *{min-width:0;}
  .wt-cats{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none;}
  .wt-cat{flex:none; min-height:48px; padding:0 20px; border-radius:999px; border:1px solid var(--hair); background:var(--ink-2); color:var(--paper); font:inherit; font-weight:700; font-size:15px; cursor:pointer; transition:transform .2s var(--spring), background .16s;}
  .wt-cat:active{transform:scale(.97); transition-duration:.08s;}
  .wt-cat.on{background:var(--gold); color:var(--on-gold); border-color:transparent;}
  .wt-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .wt-prod{position:relative; min-height:96px; border-radius:18px; border:1px solid var(--hair-soft); background:var(--ink-2); color:var(--paper); font:inherit; cursor:pointer; padding:12px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; text-align:start; gap:6px; transition:transform .2s var(--spring);}
  .wt-prod:active{transform:scale(.97); transition-duration:.08s;}
  .wt-prod .nm{font-weight:700; font-size:16px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .wt-prod .pr{color:var(--gold-hi); font-weight:800; font-size:14.5px; font-variant-numeric:tabular-nums;}
  .wt-prod .q{position:absolute; top:8px; inset-inline-end:8px; min-width:28px; height:28px; padding:0 8px; display:grid; place-items:center; border-radius:999px; background:var(--olive); color:var(--on-olive); font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; animation:wt-pop .2s var(--spring-bounce);}
  .wt-side{position:sticky; top:76px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; max-height:calc(100vh - 92px); overflow:auto; padding:2px;}
  .wt-card{background:var(--ink-2); border:1px solid var(--hair-soft); border-radius:22px; padding:16px;}
  .wt-card h2{font-size:17px; font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .wt-card h2 .icon{width:18px; height:18px;}
  .wt-line{padding:10px 0; border-bottom:1px solid var(--hair-soft);}
  .wt-line:last-child{border-bottom:0;}
  .wt-line .r1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-weight:700;}
  .wt-line .r1 .p{font-variant-numeric:tabular-nums; white-space:nowrap;}
  .wt-line .sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .wt-line.void .r1 span:first-child, .wt-line.void .r1 .p{text-decoration:line-through; color:var(--muted);}
  .wt-line.void .sub{color:var(--danger-hi);}
  .wt-line .ctl{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .wt-step{width:48px; height:48px; border-radius:14px; border:1px solid var(--hair); background:var(--ink-3); color:var(--paper); cursor:pointer; display:grid; place-items:center; transition:transform .2s var(--spring);}
  .wt-step:active{transform:scale(.94); transition-duration:.08s;}
  .wt-step .icon{width:20px; height:20px;}
  .wt-qty{min-width:30px; text-align:center; font-weight:800; font-size:19px; font-variant-numeric:tabular-nums;}
  .wt-line input, .wt-sheet input{flex:1; min-width:0; min-height:48px; border-radius:14px; border:1px solid var(--hair); background:var(--ink-3); color:var(--paper); font:inherit; font-size:16px; padding:0 12px;}
  .wt-total{display:flex; justify-content:space-between; font-weight:800; font-size:19px; margin:8px 0 12px; font-variant-numeric:tabular-nums;}
  .wt-empty{color:var(--muted); text-align:center; padding:18px 6px; line-height:1.7;}
  .wt-send{width:100%; min-height:56px; font-size:17px; background:var(--olive); color:var(--on-olive); border:none; font-weight:800;}
  .wt-void{margin-top:8px; min-height:44px; padding:6px 14px; font-size:13.5px;}
  .wt-sheet-bg{position:fixed; inset:0; background:var(--overlay-bg, rgba(0,0,0,.45)); z-index:20; display:flex; align-items:flex-end; justify-content:center; animation:wt-fade .18s ease-out;}
  .wt-sheet{width:min(560px,100%); background:var(--ink-2); border-radius:24px 24px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); display:grid; gap:14px; max-height:90vh; overflow:auto; animation:wt-up .26s var(--spring);}
  .wt-sheet h3{margin:0; font-size:20px; font-weight:800;}
  .wt-opts{display:flex; flex-wrap:wrap; gap:8px;}
  .wt-opt{min-height:48px; padding:0 18px; border-radius:999px; border:1px solid var(--hair); background:var(--ink-3); color:var(--paper); font:inherit; font-weight:700; font-size:15px; cursor:pointer; transition:transform .2s var(--spring);}
  .wt-opt:active{transform:scale(.97); transition-duration:.08s;}
  .wt-opt[aria-pressed="true"]{background:var(--gold); color:var(--on-gold); border-color:transparent;}
  .wt-stepper{display:flex; align-items:center; gap:14px; justify-content:center;}
  .wt-btns{display:flex; gap:10px;}
  .wt-btns .btn{min-height:52px; font-size:16px;}
  .wt-enter{animation:wt-in .28s var(--spring) both; animation-delay:calc(var(--i,0) * 40ms);}
  @keyframes wt-in{from{opacity:0; transform:translateY(8px);}}
  @keyframes wt-pop{from{transform:scale(.6);}}
  @keyframes wt-fade{from{opacity:0;}}
  @keyframes wt-up{from{transform:translateY(24px); opacity:0;}}
  @media (max-width:700px){ .wt-top .who{display:none;} .wt-top{padding-inline:12px;} }
  @media (max-width:900px){ .wt-order{grid-template-columns:1fr;} .wt-side{position:static; max-height:none;} }
  @media (prefers-reduced-motion:reduce){ .wt-enter,.wt-sheet,.wt-sheet-bg,.wt-prod .q{animation:none;} }
</style>
<link rel="manifest" href="waiter.webmanifest">
<meta name="theme-color" content="#f7f1e6">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OLV ويتر">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode_v2') || 'light';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  function applyCustomTheme(){
    var root = document.documentElement.style;
    var props = ['--ink', '--ink-2', '--ink-3', '--paper', '--muted', '--hair', '--hair-soft',
      '--overlay-bg', '--gold', '--gold-hi', '--gold-dp', '--gold-rgb', '--on-gold'];
    try {
      var raw = localStorage.getItem('olv_custom_theme_v2');
      var t = raw ? JSON.parse(raw) : null;
      if (!t) {
        props.forEach(function (p) { root.removeProperty(p); });
        return false;
      }
      document.documentElement.setAttribute('data-theme', t.isDark ? 'dark' : 'light');
      root.setProperty('--ink', t.ink);
      root.setProperty('--ink-2', t.ink2);
      root.setProperty('--ink-3', t.ink3);
      root.setProperty('--paper', t.paper);
      root.setProperty('--muted', t.muted);
      root.setProperty('--hair', t.hair);
      root.setProperty('--hair-soft', t.hairSoft);
      root.setProperty('--overlay-bg', t.overlayBg);
      root.setProperty('--gold', t.gold);
      root.setProperty('--gold-hi', t.goldHi);
      root.setProperty('--gold-dp', t.goldDp);
      root.setProperty('--gold-rgb', t.goldRgb);
      root.setProperty('--on-gold', t.onGold);
      return true;
    } catch (e) {
      props.forEach(function (p) { root.removeProperty(p); });
      return false;
    }
  }
  window.olvApplyTheme = function(){
    var theme = computeTheme();
    document.documentElement.setAttribute('data-theme', theme);
    window.olvCustomThemeActive = applyCustomTheme();
  };
  window.olvApplyTheme();
})();
</script>
</head>
<body>
  <header class="wt-top">
    <button class="btn" id="back" hidden></button>
    <h1 id="title">الطاولات</h1>
    <span class="who" id="who"></span>
    <button class="btn" id="logout"></button>
  </header>
  <div class="wt-err" id="err" role="alert"></div>
  <main class="wt-wrap" id="view"><div class="wt-empty">جاري التحميل...</div></main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/supabase-client.js"></script>
  <script defer src="assets/auth-guard.js"></script>
  <script defer src="assets/layout.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const $ = (id) => document.getElementById(id);
    const esc = (v) => olvEsc(v);
    const sb = () => window.supabaseClient;
    const money = (n) => (Math.round(Number(n || 0) * 100) / 100).toLocaleString("en", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const key = (v) => olvNormTable(v).toLowerCase();
    const SAVORY_CAT = /برغر|ساندويش|سناك|بيتزا|معجنات|باستا|عروض/;
    const addonFits = (a, cat) => !/جبن/.test(a.name || "") || SAVORY_CAT.test(cat || "");
    const MINUS = `<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>`;
    const newRef = () => (crypto.randomUUID ? crypto.randomUUID()
      : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));
    $("logout").innerHTML = olvIcon("undo") + "<span>خروج (اضغط مطوّلاً)</span>";
    $("back").innerHTML = olvIcon("grid") + "<span>الطاولات</span>";

    const session = await olvRequireAuth();
    if (!session) return;
    // الاسم بيجي بالخلفية، ما بنوقف الصفحة عليه
    sb().from("profiles").select("full_name").eq("id", session.user.id).single()
      .then(({ data }) => { $("who").textContent = (data && data.full_name) || ""; }, () => {});

    let menu = { products: [], addons: [] };
    let printers = [];
    let data = { tables: [], tabs: [] };
    let table = null;              // الطاولة المفتوحة حاليًا
    let cart = [];                 // { p, qty, addons:[], note }
    let ref = newRef();            // نفس المعرّف لحد ما ينجح الإرسال (ما بيتكرر الطلب لو انقطع النت)
    let cat = null;
    let sending = false;
    let qMenu = "";               // بحث الأصناف
    let qTable = "";              // بحث الطاولات
    const norm = (v) => String(v || "").toLowerCase().replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 1632).trim();

    function showErr(msg) { const e = $("err"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none"; }
    const unit = (p) => (Number(p.hall_price) > 0 ? Number(p.hall_price) : Number(p.price));
    const lineTotal = (l) => (unit(l.p) + l.addons.reduce((s, a) => s + Number(a.price), 0)) * l.qty;
    const cartTotal = () => cart.reduce((s, l) => s + lineTotal(l), 0);
    const tabOf = (n) => data.tabs.find((t) => key(t.table_number) === key(n));
    const liveItems = (t) => t.items.filter((i) => !i.voided);
    const tabTotal = (t) => liveItems(t).reduce((s, i) => s + (Number(i.unit_price || 0) + Number(i.addons_total || 0)) * Number(i.qty || 0), 0);
    const mins = (ts) => Math.max(0, Math.floor((Date.now() - new Date(ts).getTime()) / 60000));
    const dur = (m) => (m < 60 ? `${m} د` : `${Math.floor(m / 60)}س ${String(m % 60).padStart(2, "0")}د`);

    async function loadTables() {
      const { data: d, error } = await sb().rpc("waiter_tables");
      if (error) { showErr(error.message || "تعذّر تحميل الطاولات"); return; }
      showErr("");
      data = d;
      if (!table) { if ($("tbl-body")) paintTables(false); else renderTables(); } else paintSide();
    }
    // القائمة بتنعرض فورًا من آخر نسخة محفوظة على التابلت وبتتحدّث بالخلفية
    const MENU_KEY = "olv_waiter_menu_v1";
    function cachedMenu() {
      try { const c = JSON.parse(localStorage.getItem(MENU_KEY) || "null"); return c && Array.isArray(c.products) && c.products.length ? c : null; } catch (_) { return null; }
    }
    async function loadMenu() {
      const { data: d, error } = await sb().rpc("waiter_menu");
      if (error) { if (!menu.products.length) showErr(error.message || "تعذّر تحميل القائمة"); return; }
      const changed = JSON.stringify(d) !== JSON.stringify(menu);
      menu = d;
      try { localStorage.setItem(MENU_KEY, JSON.stringify(d)); } catch (_) {}
      if (changed && table && $("menu-pane")) paintMenu(false);
    }
    async function loadPrinters() {
      if (printers.length) return;
      const pr = await sb().rpc("waiter_printers");
      printers = pr.error ? [] : (pr.data || []);
    }

    function renderTables() {
      $("title").textContent = "الطاولات"; $("back").hidden = true;
      $("view").innerHTML = `<label class="wt-search">${olvIcon("search")}<input id="tq" type="search" inputmode="search" placeholder="ابحث برقم الطاولة" value="${esc(qTable)}" aria-label="بحث عن طاولة" autocomplete="off"></label>
        <div id="tbl-body"></div>`;
      paintTables(true);
    }
    function paintTables(first) {
      const body = $("tbl-body");
      if (!body) return;
      const names = data.tables.slice();
      data.tabs.forEach((t) => { if (!names.some((n) => key(n) === key(t.table_number))) names.push(t.table_number); });
      names.sort((a, b) => String(a).localeCompare(String(b), "en", { numeric: true }));
      const q = norm(qTable);
      const shown = q ? names.filter((n) => norm(n).includes(q)) : names;
      body.innerHTML = names.length
        ? `<div class="wt-legend"><span><i style="background:var(--gold)"></i>عليها حساب</span><span><i style="background:var(--olive)"></i>فاضية</span></div>`
          + (shown.length ? `<div class="wt-tables">${shown.map((n, i) => {
            const t = tabOf(n);
            const m = t ? mins(t.opened_at) : 0;
            const cls = first ? " wt-enter" : "";
            return t
              ? `<button class="wt-table busy${cls}" style="--i:${Math.min(i, 12)}" data-t="${esc(n)}"><span class="n">${esc(n)}</span><span class="tot">${money(tabTotal(t))}</span><span class="s${m > 90 ? " late" : ""}">${olvIcon("clock")} من ${dur(m)}</span></button>`
              : `<button class="wt-table${cls}" style="--i:${Math.min(i, 12)}" data-t="${esc(n)}"><span class="n">${esc(n)}</span><span class="s"><i></i>فاضية</span></button>`;
          }).join("")}</div>` : `<div class="wt-empty">ما في طاولة بهالرقم</div>`)
        : `<div class="wt-empty">ما في طاولات مسجّلة. خبّر المدير.</div>`;
    }

    function openTable(n) { table = n; cart = []; ref = newRef(); cat = null; qMenu = ""; renderOrder(true); }

    // رسم شاشة الطلب: الهيكل مرة وحدة، والقائمة والتذكرة بتتحدّثوا لحالهم (بدل ما نعيد رسم كل شي مع كل ضغطة)
    function renderOrder(first) {
      $("title").textContent = "طاولة " + table; $("back").hidden = false;
      if (!$("menu-pane")) $("view").innerHTML = `<div class="wt-order"><section id="menu-pane"></section><aside class="wt-side" id="side-pane"></aside></div>`;
      paintMenu(first); paintSide();
    }
    const qtyOf = (id) => cart.filter((l) => l.p.id === id).reduce((s, l) => s + l.qty, 0);
    function paintMenu(first) {
      const pane = $("menu-pane");
      if (!pane.firstChild) pane.innerHTML = `<label class="wt-search">${olvIcon("search")}<input id="mq" type="search" inputmode="search" placeholder="ابحث عن صنف" value="${esc(qMenu)}" aria-label="بحث عن صنف" autocomplete="off"></label><div id="menu-body"></div>`;
      const cats = [...new Set(menu.products.map((p) => p.category).filter(Boolean))];
      if (!cat || !cats.includes(cat)) cat = cats[0] || null;
      const q = norm(qMenu);
      const list = q ? menu.products.filter((p) => norm(p.name).includes(q)) : menu.products.filter((p) => p.category === cat);
      $("menu-body").innerHTML = `
        ${q ? "" : `<div class="wt-cats">${cats.map((c) => `<button class="wt-cat${c === cat ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`}
        ${list.length ? `<div class="wt-grid">${list.map((p, i) => `
          <button class="wt-prod${first ? " wt-enter" : ""}" style="--i:${Math.min(i, 12)}" data-p="${esc(p.id)}">
            <span class="nm">${esc(p.name)}</span>
            <span class="pr">${money(unit(p))}</span>
            ${qtyOf(p.id) ? `<span class="q">${qtyOf(p.id)}</span>` : ""}
          </button>`).join("")}</div>` : `<div class="wt-empty">ما في صنف بهالاسم</div>`}`;
    }
    // عدّادات الكمية على الأصناف بدون إعادة رسم القائمة
    function paintBadges() {
      $("menu-pane").querySelectorAll("[data-p]").forEach((b) => {
        const n = qtyOf(b.dataset.p);
        let q = b.querySelector(".q");
        if (!n) { if (q) q.remove(); return; }
        if (!q) { q = document.createElement("span"); q.className = "q"; b.appendChild(q); }
        if (q.textContent !== String(n)) q.textContent = n;
      });
    }
    function paintSide() {
      const tab = tabOf(table);
      const side = $("side-pane");
      const keepScroll = side.scrollTop;
      side.innerHTML = `
            <div class="wt-card">
              <h2>${olvIcon("receipt")} طلب جديد</h2>
              ${cart.length ? cart.map((l, i) => `
                <div class="wt-line">
                  <div class="r1"><span>${esc(l.p.name)}</span><span class="p">${money(lineTotal(l))}</span></div>
                  ${l.addons.length ? `<div class="sub">${esc(l.addons.map((a) => a.name).join("، "))}</div>` : ""}
                  <div class="ctl">
                    <button class="wt-step" data-m="${i}" aria-label="أنقص">${l.qty === 1 ? olvIcon("trash") : MINUS}</button>
                    <span class="wt-qty">${l.qty}</span>
                    <button class="wt-step" data-a="${i}" aria-label="زيد">${olvIcon("plus")}</button>
                    <input data-n="${i}" placeholder="ملاحظة" value="${esc(l.note)}" maxlength="120" aria-label="ملاحظة">
                  </div>
                </div>`).join("") : `<div class="wt-empty">اختار أصناف من القائمة</div>`}
              ${cart.length ? `<div class="wt-total"><span>المجموع</span><span>${money(cartTotal())}</span></div>` : ""}
              <button class="btn wt-send" id="send" ${cart.length && !sending ? "" : "disabled"}>${olvIcon("bolt")} ${sending ? "جاري الإرسال..." : "أرسل للمطبخ والبار"}</button>
            </div>
            <div class="wt-card">
              <h2>${olvIcon("clipboard")} الحساب المفتوح</h2>
              ${tab && tab.items.length ? tab.items.map((i) => `
                <div class="wt-line${i.voided ? " void" : ""}">
                  <div class="r1"><span>${i.qty} × ${esc(i.name)}</span><span class="p">${money((Number(i.unit_price || 0) + Number(i.addons_total || 0)) * Number(i.qty || 0))}</span></div>
                  ${i.voided ? `<div class="sub">مشطوب: ${esc(i.void_reason || "")}</div>` : (i.addons || i.note ? `<div class="sub">${esc([i.addons, i.note].filter(Boolean).join(" · "))}</div>` : "")}
                  ${i.voided ? "" : `<button class="btn small wt-void" data-v="${esc(i.id)}">${olvIcon("x")} شطب / تبديل</button>`}
                </div>`).join("")
                + `<div class="wt-total"><span>المجموع</span><span>${money(tabTotal(tab))}</span></div>`
                : `<div class="wt-empty">ما في حساب مفتوح على هالطاولة</div>`}
              ${tab && liveItems(tab).length ? `<button class="btn wt-void" id="bill" style="width:100%">${olvIcon("printer")} اطبع الحساب</button>` : ""}
              ${tab ? `<button class="btn wt-void" id="move" style="width:100%;margin-top:8px">${olvIcon("refresh")} نقل / دمج الطاولة</button>` : ""}
              <div class="wt-empty" style="padding:4px 0 0;font-size:13px">الدفع والفاتورة النهائية عند الكاشير</div>
            </div>`;
      side.scrollTop = keepScroll;
    }

    // مستمعين مرة وحدة على الحاوية (بدل ربطهم من جديد بعد كل رسم)
    $("view").addEventListener("click", (e) => {
      const t = e.target.closest("[data-t],[data-c],[data-p],[data-m],[data-a],[data-v],#send,#bill,#move");
      if (!t) return;
      if (t.dataset.t != null) return openTable(t.dataset.t);
      if (t.dataset.c != null) { cat = t.dataset.c; return paintMenu(true); }
      if (t.dataset.p != null) return pickProduct(t.dataset.p);
      if (t.dataset.m != null) { const i = +t.dataset.m; cart[i].qty -= 1; if (cart[i].qty < 1) cart.splice(i, 1); paintSide(); return paintBadges(); }
      if (t.dataset.a != null) { cart[+t.dataset.a].qty += 1; paintSide(); return paintBadges(); }
      if (t.dataset.v != null) return voidSheet(t.dataset.v);
      if (t.id === "send") return sendOrder();
      if (t.id === "bill") return billSheet(tabOf(table));
      if (t.id === "move") return moveSheet(tabOf(table));
    });
    $("view").addEventListener("input", (e) => {
      const n = e.target.dataset && e.target.dataset.n;
      if (n != null) cart[+n].note = e.target.value;
      if (e.target.id === "mq") { qMenu = e.target.value; paintMenu(false); }
      if (e.target.id === "tq") { qTable = e.target.value; paintTables(false); }
    });

    // نقل حساب الطاولة لطاولة ثانية؛ لو الثانية عليها حساب مفتوح بينضم معه (دمج)
    function moveSheet(tab) {
      const names = data.tables.slice();
      data.tabs.forEach((t) => { if (!names.some((n) => key(n) === key(t.table_number))) names.push(t.table_number); });
      const others = names.filter((n) => key(n) !== key(tab.table_number)).sort((a, b) => String(a).localeCompare(String(b), "en", { numeric: true }));
      let to = null, q = "";
      const bg = sheetShell("");
      const box = bg.firstChild;
      const render = () => {
        const f = norm(q);
        const list = f ? others.filter((n) => norm(n).includes(f)) : others;
        const merge = to != null && !!tabOf(to);
        box.innerHTML = `
          <h3>نقل / دمج طاولة ${esc(tab.table_number)}</h3>
          <label class="wt-search" style="margin:0">${olvIcon("search")}<input id="mvq" type="search" inputmode="search" placeholder="رقم الطاولة الجديدة" value="${esc(q)}" aria-label="بحث عن طاولة" autocomplete="off"></label>
          <div class="wt-opts" style="max-height:34vh;overflow:auto">${list.map((n) => `<button class="wt-opt" data-n="${esc(n)}" aria-pressed="${to === n}">${esc(n)}${tabOf(n) ? " · دمج" : ""}</button>`).join("") || `<div class="wt-empty">ما في طاولة بهالرقم</div>`}</div>
          <div class="wt-empty" style="padding:0;font-size:13px">${to == null ? "اختار الطاولة الجديدة. اللي عليها «دمج» عندها حساب مفتوح وبينضم معه." : merge ? `بينضم حساب طاولة ${esc(tab.table_number)} لحساب طاولة ${esc(to)}.` : `بينتقل الحساب كله لطاولة ${esc(to)}.`}</div>
          <div class="wt-btns"><button class="btn" id="mvx" style="flex:1">رجوع</button><button class="btn gold" id="mvok" style="flex:2" ${to == null ? "disabled" : ""}>${olvIcon("refresh")} ${merge ? "اضغط مطوّلاً للدمج" : "اضغط مطوّلاً للنقل"}</button></div>`;
        box.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => { to = b.dataset.n; render(); }));
        const inp = box.querySelector("#mvq");
        inp.addEventListener("input", () => { q = inp.value; const pos = inp.selectionStart; render(); const n = box.querySelector("#mvq"); n.focus(); n.setSelectionRange(pos, pos); });
        box.querySelector("#mvx").addEventListener("click", () => bg.remove());
        const ok = box.querySelector("#mvok");
        olvHoldConfirm(ok, async () => {
          ok.disabled = true;
          const dest = to, src = tab.table_number;
          const { error } = await sb().rpc("waiter_move_table", { p_from: olvNormTable(src), p_to: olvNormTable(dest) });
          bg.remove();
          if (error) { showErr(/waiter_move_table/.test(error.message || "") && /function|schema cache/i.test(error.message || "") ? "ميزة النقل لسا ما انفعّلت، خبّر المدير" : (error.message || "ما انتقلت الطاولة")); return; }
          showErr("");
          olvToast(merge ? "اندمجت الطاولة مع " + dest : "انتقل الحساب لطاولة " + dest, { type: "gold", icon: "check" });
          table = null; cart = []; ref = newRef(); qMenu = "";
          await loadTables();
          renderTables();
        }, { hint: "اضغط مطوّلاً للتأكيد" });
      };
      render();
    }

    // طباعة الحساب: مسودة أو نسخة زبون، وعلى أي طابعة (كاش، بار...). ما بيسكّر الحساب وما في دفع
    function billSheet(tab) {
      let kind = "customer";
      let pid = null;
      try { pid = localStorage.getItem("olv_waiter_printer"); } catch (_) {}
      const bg = sheetShell("");
      const box = bg.firstChild;
      // المسودة دائمًا على طابعة الكاشير (أول طابعة من نوع فاتورة)
      const cashP = () => printers.find((p) => p.kind === "receipt") || printers[0] || null;
      const render = () => {
        const draft = kind === "draft";
        const target = draft ? (cashP() ? cashP().id : null) : pid;
        box.innerHTML = `
          <h3>طباعة حساب طاولة ${esc(table)} · ${money(tabTotal(tab))}</h3>
          <div class="wt-opts">
            <button class="wt-opt" data-k="customer" aria-pressed="${kind === "customer"}">نسخة زبون</button>
            <button class="wt-opt" data-k="draft" aria-pressed="${kind === "draft"}">مسودة</button>
          </div>
          ${draft && printers.length ? `<div class="wt-empty" style="padding:0;text-align:start">المسودة بتنطبع على طابعة الكاشير: <b>${esc(cashP().name)}</b></div>`
          : printers.length ? `<div class="wt-empty" style="padding:0;text-align:start">اطبع على:</div>
            <div class="wt-opts">${printers.map((p) => `<button class="wt-opt" data-pr="${esc(p.id)}" aria-pressed="${pid === p.id}">${olvIcon("printer")} ${esc(p.name)}</button>`).join("")}</div>`
            : `<div class="wt-empty">جاري تحميل الطابعات...</div>`}
          <div class="wt-btns"><button class="btn" id="bx" style="flex:1">رجوع</button><button class="btn gold" id="bok" style="flex:2" ${target && printers.length ? "" : "disabled"}>${olvIcon("printer")} اطبع</button></div>`;
        box.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => { kind = b.dataset.k; render(); }));
        box.querySelectorAll("[data-pr]").forEach((b) => b.addEventListener("click", () => { pid = b.dataset.pr; render(); }));
        box.querySelector("#bx").addEventListener("click", () => bg.remove());
        box.querySelector("#bok").addEventListener("click", async () => {
          const ok = box.querySelector("#bok"); ok.disabled = true;
          const { error } = await sb().rpc("waiter_print_bill", { p_sale_id: tab.sale_id, p_kind: kind, p_printer_id: kind === "draft" && cashP() ? cashP().id : pid });
          bg.remove();
          if (error) { showErr(error.message || "ما انطلبت الطباعة"); return; }
          showErr("");
          const usedId = kind === "draft" && cashP() ? cashP().id : pid;
          if (kind !== "draft") { try { localStorage.setItem("olv_waiter_printer", pid); } catch (_) {} }
          const pn = (printers.find((p) => p.id === usedId) || {}).name || "";
          olvToast(`انرسلت للطباعة${pn ? " على " + pn : ""}`, { type: "gold", icon: "check" });
        });
      };
      render();
      // الطابعات بتنجاب أول مرة نفتح فيها هالورقة بس (مو مع تحميل الصفحة)
      loadPrinters().then(() => {
        if (!bg.isConnected) return;
        if (!printers.some((p) => p.id === pid)) pid = printers[0] ? printers[0].id : null;
        render();
      });
    }

    // خيارات الصنف: إضافات عادية + (كبير / وجبة / وجبة دبل) إذا الصنف إله إضافة مربوطة
    function optionsFor(p) {
      const byId = (id) => menu.addons.find((a) => a.id === id);
      const extras = menu.addons.filter((a) => !a.is_meal && !a.is_size && addonFits(a, p.category));
      const kinds = [["large_addon_id", "كبير"], ["meal_addon_id", "وجبة"], ["double_addon_id", "وجبة دبل"]]
        .map(([f, label]) => (p[f] && byId(p[f]) ? { addon: byId(p[f]), label, exclusive: f !== "large_addon_id" } : null)).filter(Boolean);
      return { extras, kinds };
    }

    function sheetShell(html) {
      const bg = document.createElement("div"); bg.className = "wt-sheet-bg";
      bg.innerHTML = `<div class="wt-sheet" role="dialog" aria-modal="true">${html}</div>`;
      bg.addEventListener("click", (e) => { if (e.target === bg) bg.remove(); });
      document.body.appendChild(bg);
      return bg;
    }

    function pickProduct(id) {
      const p = menu.products.find((x) => x.id === id);
      const { extras, kinds } = optionsFor(p);
      const hookah = /[أا]رجيل/.test(p.category || "");
      let qty = 1; const chosen = new Map(); let note = "";
      const bg = sheetShell("");
      const box = bg.firstChild;
      const render = () => {
        const all = [...kinds.map((k) => ({ a: k.addon, label: k.label + " +" + money(k.addon.price), kind: k })), ...extras.map((a) => ({ a, label: a.name + (Number(a.price) ? " +" + money(a.price) : "") }))];
        box.innerHTML = `
          <h3>${esc(p.name)} · ${money(unit(p))}</h3>
          ${all.length ? `<div class="wt-opts">${all.map((o, i) => `<button class="wt-opt" data-o="${i}" aria-pressed="${chosen.has(o.a.id)}">${esc(o.label)}</button>`).join("")}</div>` : ""}
          <div style="display:flex"><input id="sh-note" placeholder="${hookah ? "النكهة / ملاحظة" : "ملاحظة (مثال: بدون بصل)"}" value="${esc(note)}" maxlength="120" aria-label="ملاحظة"></div>
          <div class="wt-stepper"><button class="wt-step" id="sh-m" aria-label="أنقص">${MINUS}</button><span class="wt-qty" style="font-size:26px">${qty}</span><button class="wt-step" id="sh-p" aria-label="زيد">${olvIcon("plus")}</button></div>
          <div class="wt-btns"><button class="btn" id="sh-x" style="flex:1">إلغاء</button><button class="btn gold" id="sh-ok" style="flex:2">${olvIcon("plus")} أضف للطلب</button></div>`;
        box.querySelectorAll("[data-o]").forEach((b) => b.addEventListener("click", () => {
          note = box.querySelector("#sh-note").value;
          const o = all[+b.dataset.o];
          if (chosen.has(o.a.id)) chosen.delete(o.a.id);
          else {
            if (o.kind && o.kind.exclusive) kinds.filter((k) => k.exclusive).forEach((k) => chosen.delete(k.addon.id));
            chosen.set(o.a.id, o.a);
          }
          render();
        }));
        box.querySelector("#sh-m").addEventListener("click", () => { note = box.querySelector("#sh-note").value; qty = Math.max(1, qty - 1); render(); });
        box.querySelector("#sh-p").addEventListener("click", () => { note = box.querySelector("#sh-note").value; qty += 1; render(); });
        box.querySelector("#sh-x").addEventListener("click", () => bg.remove());
        box.querySelector("#sh-ok").addEventListener("click", () => {
          note = box.querySelector("#sh-note").value.trim();
          const addons = [...chosen.values()];
          const same = cart.find((l) => l.p.id === p.id && !note && !l.note && l.addons.length === addons.length && l.addons.every((a) => chosen.has(a.id)));
          if (same) same.qty += qty; else cart.push({ p, qty, addons, note });
          bg.remove(); paintSide(); paintBadges();
        });
      };
      render();
    }

    // شطب صنف من الحساب المفتوح: السبب إلزامي، والضغط المطوّل بدل «متأكد؟». الصنف بيضل ظاهر مشطوب عند الإدارة
    function voidSheet(itemId) {
      const tab = tabOf(table);
      const item = tab && tab.items.find((i) => i.id === itemId);
      if (!item) return;
      const REASONS = ["الزبون غيّر رأيه", "تبديل بصنف ثاني", "غلط بالطلب", "تأخر الطلب"];
      let reason = "";
      const bg = sheetShell("");
      const box = bg.firstChild;
      const render = () => {
        box.innerHTML = `
          <h3>شطب ${esc(item.qty + " × " + item.name)}</h3>
          <div class="wt-opts">${REASONS.map((r) => `<button class="wt-opt" data-r="${esc(r)}" aria-pressed="${reason === r}">${esc(r)}</button>`).join("")}</div>
          <div style="display:flex"><input id="vr" placeholder="أو اكتب السبب" value="${REASONS.includes(reason) ? "" : esc(reason)}" maxlength="120" aria-label="سبب الشطب"></div>
          <div class="wt-empty" style="padding:0;font-size:13px">بيضل الصنف ظاهر مشطوب عند الإدارة مع السبب واسمك، وبتنطبع تذكرة إلغاء للقسم.</div>
          <div class="wt-btns"><button class="btn" id="vx" style="flex:1">رجوع</button><button class="btn danger" id="vok" style="flex:2" disabled>${olvIcon("x")} اضغط مطوّلاً للشطب</button></div>`;
        box.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => { reason = b.dataset.r; render(); }));
        const inp = box.querySelector("#vr");
        const ok = box.querySelector("#vok");
        const sync = () => { ok.disabled = reason.trim().length < 3; };
        inp.addEventListener("input", () => { reason = inp.value; box.querySelectorAll("[data-r]").forEach((b) => b.setAttribute("aria-pressed", "false")); sync(); });
        sync();
        box.querySelector("#vx").addEventListener("click", () => bg.remove());
        olvHoldConfirm(ok, async () => {
          ok.disabled = true;
          const { error } = await sb().rpc("waiter_void_item", { p_item_id: itemId, p_reason: reason.trim() });
          if (error) { showErr(error.message || "ما انشطب الصنف"); ok.disabled = false; bg.remove(); return; }
          showErr("");
          bg.remove();
          olvToast(reason === "تبديل بصنف ثاني" ? "انشطب، اختار الصنف البديل" : "انشطب الصنف", { type: "info", icon: "check" });
          await loadTables();
        }, { hint: "اضغط مطوّلاً لتأكيد الشطب" });
      };
      render();
    }

    async function sendOrder() {
      if (sending || !cart.length) return;
      sending = true; showErr(""); paintSide();
      try {
        const items = cart.map((l) => ({ product_id: l.p.id, qty: l.qty, addon_ids: l.addons.map((a) => a.id), note: l.note.trim() || null }));
        const { error } = await sb().rpc("waiter_place_order", {
          p_entry_date: olvToday(), p_total: cartTotal(), p_items: items, p_client_ref: ref, p_table_number: olvNormTable(table),
        });
        if (error) throw error;
        if (navigator.vibrate) navigator.vibrate(12);
        olvToast("انرسل الطلب لطاولة " + table, { type: "gold", icon: "check" });
        cart = []; ref = newRef(); table = null; sending = false;
        await loadTables();
      } catch (e) {
        sending = false;
        showErr((e && e.message) || "ما انرسل الطلب، جرّب كمان مرة (ما رح يتكرر)");
        paintSide();
      }
    }

    $("back").addEventListener("click", () => {
      if (cart.length && !confirm("في أصناف ما انرسلت، تتركها؟")) return;
      table = null; cart = []; ref = newRef(); qMenu = ""; renderTables();
    });
    // الخروج مو سهل: ضغط مطوّل ثانيتين (حتى ما يطلع الويتر بالغلط)
    olvHoldConfirm($("logout"), async () => { await sb().auth.signOut(); window.location.href = "login.html"; }, { ms: 2000, hint: "اضغط مطوّلاً ثانيتين للخروج" });

    const cm = cachedMenu();
    if (cm) menu = cm;
    await Promise.all([loadMenu(), loadTables()]);
    // تحديث الحسابات كل 5 ثواني، بس والشاشة ظاهرة؛ وأول ما يرجع للصفحة بيتحدّث فورًا
    const idle = () => !sending && !document.querySelector(".wt-sheet-bg") && !(document.activeElement && document.activeElement.tagName === "INPUT");
    setInterval(() => { if (!document.hidden && idle()) loadTables(); }, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && idle()) loadTables(); });
  });
  </script>
</body>
</html>
