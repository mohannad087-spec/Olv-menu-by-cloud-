<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المطبخ — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f1e6">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاسبة OLV">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode_v2') || 'light';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  function applyCustomTheme(){
    var root = document.documentElement.style;
    var props = ['--ink', '--ink-2', '--ink-3', '--paper', '--muted', '--hair', '--hair-soft',
      '--overlay-bg', '--gold', '--gold-hi', '--gold-dp', '--gold-rgb', '--on-gold'];
    try {
      var raw = localStorage.getItem('olv_custom_theme_v2');
      var t = raw ? JSON.parse(raw) : null;
      if (!t) {
        props.forEach(function (p) { root.removeProperty(p); });
        return false;
      }
      document.documentElement.setAttribute('data-theme', t.isDark ? 'dark' : 'light');
      root.setProperty('--ink', t.ink);
      root.setProperty('--ink-2', t.ink2);
      root.setProperty('--ink-3', t.ink3);
      root.setProperty('--paper', t.paper);
      root.setProperty('--muted', t.muted);
      root.setProperty('--hair', t.hair);
      root.setProperty('--hair-soft', t.hairSoft);
      root.setProperty('--overlay-bg', t.overlayBg);
      root.setProperty('--gold', t.gold);
      root.setProperty('--gold-hi', t.goldHi);
      root.setProperty('--gold-dp', t.goldDp);
      root.setProperty('--gold-rgb', t.goldRgb);
      root.setProperty('--on-gold', t.onGold);
      return true;
    } catch (e) {
      props.forEach(function (p) { root.removeProperty(p); });
      return false;
    }
  }
  window.olvApplyTheme = function(){
    var theme = computeTheme();
    document.documentElement.setAttribute('data-theme', theme);
    window.olvCustomThemeActive = applyCustomTheme();
  };
  window.olvApplyTheme();
})();
</script>
<style>
  /* شاشة المطبخ: تذاكر مطبخ حقيقية بتنقرى من بعيد. الهيدر بيتلوّن حسب الوقت (زيتوني ← ذهبي ← أحمر)
     ومعه أيقونة ونص، فاللون مش لحاله اللي بيحكي. */
  .wrap.k-wrap{max-width:1440px;}
  /* --- شريط الأدوات: زجاج لأنه تنقّل، ولازق فوق --- */
  .k-tools{
    position:sticky; top:8px; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:10px; margin-bottom:14px; border-radius:20px;
    background:var(--glass, var(--ink-2)); border:1px solid var(--glass-line, var(--hair));
    -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
    box-shadow:0 10px 30px -18px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-transparency: reduce){ .k-tools{background:var(--ink-2); -webkit-backdrop-filter:none; backdrop-filter:none;} }
  .k-seg{display:inline-flex; border:1px solid var(--hair); border-radius:999px; padding:3px; background:var(--ink-2); gap:2px;}
  .k-seg button{
    display:inline-flex; align-items:center; gap:6px; border:0; background:none; color:var(--muted);
    padding:8px 15px; border-radius:999px; font:inherit; font-size:14px; min-height:40px; cursor:pointer;
    transition:background .16s var(--spring), color .16s var(--spring), transform .12s var(--spring);
  }
  .k-seg button:active{transform:scale(.97);}
  .k-seg button .icon{width:16px; height:16px;}
  .k-seg button.on{background:var(--paper); color:var(--ink-2); font-weight:700;}
  .k-seg.tabs button.on{background:var(--gold); color:var(--on-gold);}
  .k-seg .cnt{
    min-width:22px; height:22px; padding:0 6px; border-radius:999px; font-size:12px; font-weight:800;
    display:inline-flex; align-items:center; justify-content:center; background:rgba(var(--gold-rgb),.18); color:inherit;
    font-variant-numeric:tabular-nums;
  }
  .k-seg button.on .cnt{background:rgba(0,0,0,.14);}
  .k-tools .k-end{margin-inline-start:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .k-live{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); white-space:nowrap;}
  .k-live .dot{width:9px; height:9px; border-radius:999px; background:var(--muted);}
  .k-live.on .dot{background:var(--olive); box-shadow:0 0 0 3px color-mix(in srgb, var(--olive) 22%, transparent);}
  .k-icon-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:44px; min-height:44px; padding:0 12px;
    border-radius:999px; border:1px solid var(--hair); background:var(--ink-2); color:var(--paper); font:inherit; font-size:13px; cursor:pointer;
    transition:transform .12s var(--spring), border-color .16s ease;
  }
  .k-icon-btn:active{transform:scale(.96);}
  .k-icon-btn .icon{width:18px; height:18px;}
  .k-icon-btn[aria-pressed="true"]{border-color:var(--gold); color:var(--gold-hi);}

  /* --- شريط الأرقام --- */
  .k-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px;}
  .k-stat{
    background:var(--ink-2); border:1px solid var(--hair-soft); border-radius:18px; padding:12px 14px;
    display:flex; align-items:center; gap:12px; min-width:0;
  }
  .k-stat .ic{
    flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--ink-3); color:var(--gold-hi);
  }
  .k-stat .ic .icon{width:20px; height:20px;}
  .k-stat.main .ic{background:var(--olive); color:var(--on-olive);}
  .k-stat.alert .ic{background:var(--danger); color:#fff;}
  .k-stat > div{min-width:0;}
  .k-stat .lb{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .k-stat .vl{font-size:26px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--paper);}
  .k-stat .vl small{font-size:13px; font-weight:700; color:var(--muted); margin-inline-start:3px;}
  .k-stat.alert .vl{color:var(--danger-hi);}
  @media (max-width:760px){ .k-stats{grid-template-columns:repeat(2,minmax(0,1fr));} .k-stat .vl{font-size:22px;} }

  .k-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; margin-bottom:14px;
    background:var(--ink-2); border:1px solid var(--hair); border-radius:14px; padding:12px 14px;
    font:inherit; font-size:14px; color:var(--paper); text-align:start;
  }
  .k-bar[hidden]{display:none;}
  .k-bar .btn{margin-inline-start:auto;}
  .k-sound{border-color:var(--gold); color:var(--gold-hi); font-weight:700; cursor:pointer; min-height:48px;}
  .k-sound .icon{width:18px; height:18px;}

  /* --- التذاكر --- */
  .orders-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; align-items:start;}
  .order-card{
    --tk:var(--olive); --tk-ink:var(--on-olive);
    position:relative; background:var(--ink-2); border:1px solid var(--hair); border-radius:20px;
    display:flex; flex-direction:column; box-shadow:var(--card-shadow); overflow:hidden;
    transition:opacity .16s ease, transform .18s var(--spring);
  }
  .order-card.late{--tk:var(--gold); --tk-ink:var(--on-gold);}
  .order-card.overdue{--tk:var(--danger); --tk-ink:#fff; border-color:var(--danger);}
  .order-card.ready{--tk:var(--ink-3); --tk-ink:var(--paper);}
  /* متأخر: حلقة بتنبض بهدوء (opacity بس، على طبقة لحالها) */
  .order-card.overdue::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow:inset 0 0 0 2px var(--danger); animation:k-pulse 1.6s ease-in-out infinite;
  }
  @keyframes k-pulse{0%,100%{opacity:.25} 50%{opacity:1}}
  /* خروج التذكرة لما تخلص: أسرع من الدخول */
  .order-card.leaving{opacity:0; transform:scale(.96);}

  .tk-head{background:var(--tk); color:var(--tk-ink); padding:12px 16px 14px; position:relative;}
  /* ثقوب التذكرة بين الرأس والجسم */
  .tk-head::after{
    content:""; position:absolute; inset-inline:0; bottom:-6px; height:12px;
    background:radial-gradient(circle at 6px 6px, var(--ink-2) 4.5px, transparent 5px) 0 0/16px 12px repeat-x;
  }
  .tk-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .tk-no{display:flex; align-items:baseline; gap:10px; font-size:34px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  .tk-no small{font-size:14px; font-weight:700; opacity:.8; unicode-bidi:isolate; white-space:nowrap;}
  .tk-timer{
    display:inline-flex; align-items:center; gap:6px; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
    background:rgba(0,0,0,.14); border-radius:12px; padding:4px 10px; direction:ltr;
  }
  .tk-timer .icon{width:18px; height:18px;}
  .tk-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:8px; font-size:13.5px; font-weight:700;}
  .tk-meta span{display:inline-flex; align-items:center; gap:5px;}
  .tk-meta .icon{width:15px; height:15px;}
  .tk-meta .muted{opacity:.85; font-weight:500;}
  .tk-new{
    font-size:12px; font-weight:800; padding:2px 9px; border-radius:999px;
    background:var(--ink-2); color:var(--gold-hi);
  }
  /* تقدّم الأصناف (كم خلص من كم) */
  .tk-prog{height:5px; background:var(--ink-3); margin:6px 16px 0; border-radius:999px; overflow:hidden;}
  .tk-prog i{display:block; height:100%; width:0; background:var(--olive); border-radius:inherit; transition:width .3s var(--spring);}
  .tk-body{padding:8px 16px 16px; display:flex; flex-direction:column; flex:1;}
  .order-items{margin-bottom:12px;}
  .order-line{padding:10px 0; border-bottom:1px dashed var(--hair); font-size:17px;}
  .order-line:last-child{border-bottom:none;}
  .order-line .qty-line{display:flex; align-items:flex-start; gap:10px;}
  .order-line .order-qty-badge{
    flex:none; background:var(--paper); color:var(--ink-2);
    font-weight:800; font-size:15px; min-width:34px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; padding:0 5px; font-variant-numeric:tabular-nums;
    transition:background .14s ease, color .14s ease;
  }
  .order-line .item-name{font-weight:700; line-height:1.4; padding-top:2px;}
  .order-line .addons{color:var(--olive-hi,#9dab63); font-size:14.5px; font-weight:700; margin-top:3px; margin-inline-start:44px;}
  .order-line .addons .icon{width:13px; height:13px; vertical-align:-2px;}
  /* الملاحظة («بدون بصل») أهم شي ما يفوت الطبّاخ */
  .order-line .note{
    color:var(--danger-hi); font-size:14.5px; font-weight:800; margin-top:6px; margin-inline-start:44px;
    background:color-mix(in srgb, var(--danger) 9%, transparent); border-inline-start:3px solid var(--danger);
    border-radius:6px; padding:5px 9px;
  }
  .order-line .note .icon{width:15px; height:15px; vertical-align:-3px;}
  /* شطب كل صنف لحاله: السطر كلّه زر. ما في حركة كبيرة لأنه بيتكرر عشرات المرات بالساعة */
  .order-line.tap{cursor:pointer; border-radius:10px; margin-inline:-8px; padding-inline:8px; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  @media (hover:hover){ .order-line.tap:hover{background:rgba(var(--gold-rgb),.07);} }
  .order-line.tap:active{background:rgba(var(--gold-rgb),.15);}
  .order-line.tap:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .order-line.done .item-name, .order-line.done .addons{text-decoration:line-through; text-decoration-thickness:2px; opacity:.4;}
  .order-line.done .note{opacity:.4;}
  .order-line.done .order-qty-badge{background:var(--olive); color:var(--on-olive);}
  .order-line.done .order-qty-badge .icon{width:16px; height:16px;}
  .order-line.busy{opacity:.6; pointer-events:none;}
  .order-other{
    font-size:13px; color:var(--muted); margin:0 0 12px; display:flex; align-items:center; gap:6px;
    background:var(--ink-3); border-radius:10px; padding:7px 10px;
  }
  .order-other .icon{width:15px; height:15px; flex:none;}
  .k-btn{min-height:56px; font-size:17px; font-weight:800; width:100%; border-radius:14px;}
  .k-btn.pay{background:var(--olive); border-color:var(--olive); color:var(--on-olive);}
  .k-btn:active{transform:scale(.98);}
  .empty-state{color:var(--muted); text-align:center; padding:60px 0; grid-column:1/-1;}

  .k-cat-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--hair);}
  .k-cat-row select{
    min-height:44px; font:inherit; font-size:16px; padding:6px 12px; border-radius:12px;
    border:1px solid var(--hair); background:var(--ink-3); color:var(--paper); max-width:60%;
  }
  #k-station{flex-wrap:wrap;}
  @media (max-width:640px){ #k-station{border-radius:18px;} }

  /* وضع ملء الشاشة لتابلت المطبخ: بلا قائمة ولا فوتر، كل المساحة للتذاكر */
  body.k-focus #olv-nav, body.k-focus .olv-footer, body.k-focus .olv-bnav{display:none !important;}
  body.k-focus .wrap.k-wrap{max-width:none; padding-top:12px;}
  @media (max-width:640px){
    .k-tools{top:4px; border-radius:16px;}
    .k-tools .k-end{width:100%; justify-content:space-between; margin-inline-start:0;}
    .tk-no{font-size:30px;}
    .orders-grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    .order-card.overdue::after{animation:none; opacity:1;}
    .order-card, .tk-prog i{transition:opacity .12s ease;}
  }
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap k-wrap">
    <div class="err" id="err"></div>

    <div class="k-tools">
      <div class="k-seg tabs" role="tablist" aria-label="حالة الطلبات">
        <button class="sub-tab on" role="tab" data-tab="pending"><span data-ic="hourglass"></span> قيد التحضير <span class="cnt" id="k-count-pending">0</span></button>
        <button class="sub-tab" role="tab" data-tab="ready"><span data-ic="checkCircle"></span> جاهز</button>
      </div>
      <div class="k-seg" id="k-station" role="group" aria-label="أي شاشة">
        <button type="button" data-st="all" class="on">الكل</button>
      </div>
      <div class="k-end">
        <span class="k-live" id="k-updated" role="status"><span class="dot"></span><span id="k-updated-t">جاري الاتصال...</span></span>
        <button type="button" class="k-icon-btn" id="k-cats-btn" hidden><span data-ic="gear"></span> الأقسام</button>
        <button type="button" class="k-icon-btn" id="k-focus-btn" aria-pressed="false" aria-label="ملء الشاشة" title="ملء الشاشة">
          <svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>

    <div class="k-stats" aria-label="ملخّص المطبخ">
      <div class="k-stat main"><span class="ic"><span data-ic="hourglass"></span></span><div><div class="lb">قيد التحضير</div><div class="vl" id="ks-pending">0</div></div></div>
      <div class="k-stat" id="ks-late-box"><span class="ic"><span data-ic="clock"></span></span><div><div class="lb">متأخر (+15 د)</div><div class="vl" id="ks-late">0</div></div></div>
      <div class="k-stat"><span class="ic"><span data-ic="warning"></span></span><div><div class="lb">أقدم طلب</div><div class="vl" id="ks-oldest">—</div></div></div>
      <div class="k-stat"><span class="ic"><span data-ic="checkCircle"></span></span><div><div class="lb" id="ks-avg-lb">متوسط التحضير اليوم</div><div class="vl" id="ks-avg">—</div></div></div>
    </div>

    <button type="button" class="k-bar k-sound" id="k-sound" hidden><span id="k-sound-icon"></span> اضغط هون لتشغيل صوت الطلبات الجديدة</button>
    <div class="k-bar" id="k-stale" hidden>
      في <b id="k-stale-n">0</b> طلب قديم ما انعلّم «جاهز» (أقدم من 12 ساعة، مخفيين عن الشاشة)
      <button type="button" class="btn small" id="k-stale-btn">علّمهم جاهزين</button>
    </div>

    <div class="orders-grid" id="orders-grid">
      <div class="hint">جاري التحميل...</div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/offline-queue.js"></script>
  <script defer src="assets/supabase-client.js"></script>
  <script defer src="assets/auth-guard.js"></script>
  <script defer src="assets/layout.js"></script>
  <script defer src="assets/notify-sound.js"></script>
  <script defer src="assets/connection-status.js"></script>
  <script defer src="assets/incoming-orders-poll.js"></script>
  <script defer src="assets/low-stock-poll.js"></script>
  <script defer src="assets/menu-stock-sync.js"></script>
  <script defer src="assets/print-health.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    olvRenderNav("kitchen");
    document.getElementById("k-sound-icon").innerHTML = olvIcon("bell");
    document.querySelectorAll("[data-ic]").forEach((el) => { el.outerHTML = olvIcon(el.dataset.ic); });

    const db = window.supabaseClient;
    const PENDING_STATUS = "قيد التحضير";
    const READY_STATUS = "جاهز";
    const WINDOW_HOURS = 12; // الشاشة بتعرض طلبات آخر 12 ساعة بس؛ الأقدم «عالقة» وبتنعرض كتنبيه لحالها
    const LATE_MIN = 10;    // ذهبي: انتبه
    const OVERDUE_MIN = 15; // أحمر: متأخر
    // المحطات (من app_settings.kitchen_stations): كل وحدة إلها اسم وأيقونة وأقسام المنيو (products.category) تبعها.
    // أي قسم مش محطوط بمحطة بيروح لأول محطة (المطبخ). البديل القديم: kitchen_bar_categories (مطبخ + بار بس)
    let stations = [{ id: "kitchen", name: "المطبخ", icon: "flame", categories: [] }];
    let catStation = new Map(); // قسم → id المحطة
    const errBox = document.getElementById("err");
    const grid = document.getElementById("orders-grid");
    let activeTab = "pending";
    // كل جهاز بيتذكّر شاشته: تابلت المطبخ «المطبخ»، تابلت البار «البار»
    let station = "all";
    try { station = localStorage.getItem("olv_kitchen_station") || "all"; } catch (_) {}
    let knownPendingIds = null; // null = لسا ما انعمل الأساس (baseline) الأول
    let pendingItems = new Map(); // id الطلب → Map(id الصنف → اسمه)، حتى ننبّه إذا انشال صنف من طلب عالشاشة
    let staleOrders = [];
    let ordersById = new Map();
    let busy = false;
    let pollAgain = false; // طلب تحديث وصل والتحديث شغّال: منعيده بعد ما يخلص (حتى ما ترجع بطاقة انعلّمت جاهزة)
    let live = false;      // البث الفوري شغّال؟ إذا لا، منضل نحدّث كل 15 ثانية
    let lastPollAt = 0;

    const since = () => new Date(Date.now() - WINDOW_HOURS * 3600e3).toISOString();
    // الأصناف الملغاة (void_sale_item) ما بتنعرض للمطبخ، والطلب اللي كل أصنافه ملغاة بيختفي
    const liveItems = (o) => (o.sale_items || []).filter((it) => it.status !== "voided");
    const itemStation = (it) => catStation.get(it.products && it.products.category) || stations[0].id;
    const stationById = (id) => stations.find((x) => x.id === id) || stations[0];
    const isMine = (it) => station === "all" || itemStation(it) === station;
    const isDone = (it) => !!it.kitchen_done_at;

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", numberingSystem: "latn" });
    }
    function minutesSince(ts) {
      return (Date.now() - new Date(ts).getTime()) / 60000;
    }

    // المتصفح ما بيشغّل صوت قبل أول لمسة عالصفحة: منبيّن شريط لحد ما ينضغط، حتى ما يفوت المطبخ صوت طلب
    const soundBar = document.getElementById("k-sound");
    function refreshSoundBar() {
      const c = typeof OlvSound !== "undefined" ? OlvSound.ensureContext() : null;
      soundBar.hidden = !c || c.state === "running";
    }
    soundBar.addEventListener("click", () => { OlvSound.ensureContext(); setTimeout(refreshSoundBar, 200); });
    document.addEventListener("click", () => setTimeout(refreshSoundBar, 200));

    // الشاشة تضل شغّالة (تابلت المطبخ ما ينطفي) — إذا المتصفح بيدعمها
    let wakeLock = null;
    async function keepAwake() {
      try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); poll(); } });

    function renderLive() {
      const box = document.getElementById("k-updated");
      box.classList.toggle("on", live);
      document.getElementById("k-updated-t").textContent = live
        ? `مباشر · آخر تحديث ${formatTime(lastPollAt || Date.now())}`
        : `آخر تحديث ${lastPollAt ? formatTime(lastPollAt) : "—"} · كل 15 ثانية`;
    }

    function renderStation() {
      const box = document.getElementById("k-station");
      box.innerHTML = `<button type="button" data-st="all">الكل</button>` +
        stations.map((x) => `<button type="button" data-st="${olvEsc(x.id)}">${olvIcon(x.icon || "flame")} ${olvEsc(x.name)}</button>`).join("");
      box.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.st === station));
    }

    // طلبات قيد التحضير (مستقل عن التبويب المفتوح): صوت للجديد، وتنبيه إذا طلب أو صنف كان عالشاشة وانلغى
    async function checkPending(rows) {
      const current = new Map(rows.map((o) => [o.id, o.order_no]));
      if (knownPendingIds !== null) {
        let hasNew = false;
        current.forEach((_, id) => { if (!knownPendingIds.has(id)) hasNew = true; });
        if (hasNew && typeof OlvSound !== "undefined") OlvSound.playNewOrder();
        const gone = [...knownPendingIds].filter((id) => !current.has(id));
        if (gone.length) {
          const { data } = await db.from("sales_entries").select("id, order_no").in("id", gone).eq("status", "voided");
          (data || []).forEach((o) => {
            olvToast(`طلب ${o.order_no ? "#" + o.order_no : ""} انلغى — وقّف تحضيره`, { type: "danger", ms: 15000 });
            if (typeof OlvSound !== "undefined") OlvSound.playError();
          });
        }
        // صنف انلغى (void_sale_item) من طلب لسا عالشاشة: بدون تنبيه كان يختفي بصمت والطبّاخ ممكن يكون بلّش فيه
        rows.forEach((o) => {
          const before = pendingItems.get(o.id);
          if (!before) return;
          const now = new Set(o.items.map((it) => it.id));
          before.forEach((name, itemId) => {
            if (!now.has(itemId)) {
              olvToast(`طلب ${o.order_no ? "#" + o.order_no : ""}: «${name}» انلغى — لا تحضّره`, { type: "danger", ms: 15000 });
              if (typeof OlvSound !== "undefined") OlvSound.playError();
            }
          });
        });
      }
      pendingItems = new Map(rows.map((o) => [o.id, new Map(o.items.map((it) => [it.id, it.product_name]))]));
      knownPendingIds = new Set(current.keys());
    }

    function lineHtml(o, it, pending) {
      const done = isDone(it);
      return `
        <div class="order-line${pending ? " tap" : ""}${done ? " done" : ""}" ${pending ? `role="button" tabindex="0" aria-pressed="${done}" data-sale="${olvEsc(o.id)}" data-item="${olvEsc(it.id)}"` : ""}>
          <div class="qty-line">
            <span class="order-qty-badge">${done ? olvIcon("check") : `${olvEsc(it.qty)}×`}</span>
            <span class="item-name">${done ? `${olvEsc(it.qty)}× ` : ""}${olvEsc(it.product_name)}</span>
          </div>
          ${it.addons_summary ? `<div class="addons">${olvIcon("plus")} ${olvEsc(it.addons_summary)}</div>` : ""}
          ${it.note ? `<div class="note">${olvIcon("note")} ${olvEsc(it.note)}</div>` : ""}
        </div>`;
    }

    // مؤقّت التذكرة mm:ss (بيمشي كل ثانية بدون ما نعيد رسم البطاقات)
    function clock(ts) {
      const sec = Math.max(0, Math.floor((Date.now() - new Date(ts).getTime()) / 1000));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60;
      return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
    }
    function urgencyOf(ts) {
      const m = minutesSince(ts);
      return m > OVERDUE_MIN ? "overdue" : m >= LATE_MIN ? "late" : "";
    }
    const URGENCY_TEXT = { overdue: "متأخر", late: "انتبه", "": "" };

    function cardHtml(o) {
      const pending = activeTab === "pending";
      const urgency = pending ? urgencyOf(o.created_at) : "ready";
      const isDelivery = o.order_type === "توصيل";
      const isNew = pending && minutesSince(o.created_at) < 1;
      // باقي أصناف بالشاشة التانية (مثلًا المطبخ بيشوف إنو في عصير لسا بالبار) — حتى ما يطلع الطلب ناقص
      // باقي الأصناف عند المحطات التانية، مجمّعة: «باقي: 2 بار الصالة، 1 الأرجيلة»
      const otherLeft = new Map();
      if (pending && station !== "all") o.others.filter((it) => !isDone(it)).forEach((it) => { const k = itemStation(it); otherLeft.set(k, (otherLeft.get(k) || 0) + 1); });
      const doneN = o.items.filter(isDone).length;
      const left = o.items.length - doneN;
      const typeIcon = isDelivery ? "mapPin" : o.order_type === "سفري" ? "cart" : "dineIn";
      return `
        <article class="order-card ${urgency}" data-row-id="${olvEsc(o.id)}" data-since="${olvEsc(o.created_at)}" aria-label="طلب ${o.order_no ? olvEsc(o.order_no) : ""}">
          <header class="tk-head">
            <div class="tk-row">
              <div class="tk-no"><span>${o.order_no ? `#${olvEsc(o.order_no)}` : olvIcon("receipt")}</span><small>${formatTime(o.created_at)}</small></div>
              ${pending
                ? `<div class="tk-timer" title="من وقت الطلب">${olvIcon("clock")}<span data-clock>${clock(o.created_at)}</span></div>`
                : (prepMinutes(o) !== null ? `<div class="tk-timer" title="مدة التحضير">${olvIcon("check")}<span>${prepMinutes(o)} د</span></div>` : "")}
            </div>
            <div class="tk-meta">
              ${o.order_type ? `<span>${olvIcon(typeIcon)} ${olvEsc(o.order_type)}</span>` : ""}
              ${o.table_number ? `<span>${olvIcon("grid")} طاولة ${olvEsc(o.table_number)}</span>` : ""}
              ${o.customer_name ? `<span class="muted">${olvIcon("person")} ${olvEsc(o.customer_name)}</span>` : ""}
              ${isNew ? `<span class="tk-new" data-new>جديد</span>` : ""}
              ${pending ? `<span data-urgency>${urgency ? olvIcon("warning") + " " + URGENCY_TEXT[urgency] : ""}</span>` : ""}
            </div>
          </header>
          ${pending && o.items.length > 1 ? `<div class="tk-prog" role="progressbar" aria-label="الأصناف الجاهزة" aria-valuemin="0" aria-valuemax="${o.items.length}" aria-valuenow="${doneN}"><i style="width:${Math.round((doneN / o.items.length) * 100)}%"></i></div>` : ""}
          <div class="tk-body">
            <div class="order-items">
              ${o.items.map((it) => lineHtml(o, it, pending)).join("")}
            </div>
            ${otherLeft.size ? `<div class="order-other">${olvIcon("clock")} باقي: ${[...otherLeft].map(([k, n]) => `${n} عند ${olvEsc(stationById(k).name)}`).join("، ")}</div>` : ""}
            <button class="btn ${pending ? "pay" : ""} k-btn" data-id="${olvEsc(o.id)}" data-act="${pending ? "done" : "undo"}">
              ${pending
                ? olvIcon("check") + (left < o.items.length ? ` تم الباقي (${left})` : " تم التجهيز")
                : olvIcon("undo") + " إرجاع لقيد التحضير"}
            </button>
          </div>
        </article>
      `;
    }

    // كل ثانية: المؤقّتات + لون الاستعجال + شريط الأرقام، بدون ما نلمس باقي البطاقة
    function tick() {
      if (activeTab !== "pending") return;
      grid.querySelectorAll(".order-card[data-since]").forEach((card) => {
        const ts = card.dataset.since;
        const c = card.querySelector("[data-clock]");
        if (c) c.textContent = clock(ts);
        const u = urgencyOf(ts);
        const cur = card.classList.contains("overdue") ? "overdue" : card.classList.contains("late") ? "late" : "";
        if (cur !== u) {
          card.classList.remove("late", "overdue");
          if (u) card.classList.add(u);
          const ue = card.querySelector("[data-urgency]");
          if (ue) ue.innerHTML = u ? olvIcon("warning") + " " + URGENCY_TEXT[u] : "";
        }
        const nw = card.querySelector("[data-new]");
        if (nw && minutesSince(ts) >= 1) nw.remove();
      });
      renderStats();
    }

    let lastPending = [];
    let todayAvg = null;
    function renderStats() {
      const late = lastPending.filter((o) => minutesSince(o.created_at) > OVERDUE_MIN).length;
      document.getElementById("ks-pending").textContent = lastPending.length;
      document.getElementById("ks-late").textContent = late;
      document.getElementById("ks-late-box").classList.toggle("alert", late > 0);
      const oldest = lastPending.length ? Math.floor(minutesSince(lastPending[0].created_at)) : null;
      document.getElementById("ks-oldest").innerHTML = oldest === null ? "—" : `${oldest}<small>د</small>`;
      document.getElementById("ks-avg").innerHTML = todayAvg === null ? "—" : `${todayAvg}<small>د</small>`;
    }

    // تذكرة خلصت: بتطلع بسرعة (160ms) بدل ما تختفي فجأة
    function leaveCard(card) {
      if (!card) return;
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      card.classList.add("leaving");
      setTimeout(() => card.remove(), reduce ? 0 : 170);
    }

    // تتبّع التذاكر الجديدة لكل تبويب (بيتصفّر لما الكاشير يبدّل التبويب حتى ما تتحرك كل البطاقات)
    let kTracker = olvNewTracker(), kTrackerTab = null;
    const sel = "id, order_no, created_at, order_type, customer_name, table_number, kitchen_ready_at, sale_items(id, qty, product_name, addons_summary, note, status, kitchen_done_at, products(category))";
    const prepMinutes = (o) => (o.kitchen_ready_at ? Math.max(0, Math.round((new Date(o.kitchen_ready_at) - new Date(o.created_at)) / 60000)) : null);

    async function loadStations() {
      const { data } = await db.from("app_settings").select("key, value").in("key", ["kitchen_stations", "kitchen_bar_categories"]);
      const val = (k) => { const row = (data || []).find((x) => x.key === k); try { return row ? JSON.parse(row.value) : null; } catch (_) { return null; } };
      const list = val("kitchen_stations");
      if (Array.isArray(list) && list.length) stations = list;
      else {
        const bar = val("kitchen_bar_categories") || [];
        stations = [{ id: "kitchen", name: "المطبخ", icon: "flame", categories: [] }, { id: "bar", name: "البار", icon: "coffee", categories: bar }];
      }
      catStation = new Map();
      stations.forEach((x) => (x.categories || []).forEach((c) => catStation.set(c, x.id)));
      if (station !== "all" && !stations.some((x) => x.id === station)) station = "all";
      renderStation();
    }

    // items = أصناف هالشاشة، others = أصناف الشاشة التانية من نفس الطلب
    function shape(rows, needUndone) {
      return (rows || []).map((o) => {
        const all = liveItems(o);
        return { ...o, items: all.filter(isMine), others: all.filter((it) => !isMine(it)) };
      }).filter((o) => o.items.length && (!needUndone || o.items.some((it) => !isDone(it))));
    }

    async function poll() {
      if (busy) { pollAgain = true; return; }
      busy = true;
      pollAgain = false;
      try {
        // قيد التحضير: دايمًا (للصوت والتنبيهات)، من الأقدم للأحدث ضمن آخر 12 ساعة — هيك الحد ما بيقص الطلبات الجديدة
        const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
        const [pRes, rRes, sRes, aRes] = await Promise.all([
          db.from("sales_entries").select(sel)
            .eq("kitchen_status", PENDING_STATUS).eq("status", "completed").gte("created_at", since())
            .order("created_at", { ascending: true }).limit(100),
          activeTab === "ready"
            ? db.from("sales_entries").select(sel)
              .eq("kitchen_status", READY_STATUS).eq("status", "completed").gte("created_at", since())
              .order("created_at", { ascending: false }).limit(60)
            : Promise.resolve({ data: null, error: null }),
          db.from("sales_entries").select("id, sale_items(id, status)")
            .eq("kitchen_status", PENDING_STATUS).eq("status", "completed").lt("created_at", since()).limit(200),
          db.from("sales_entries").select("created_at, kitchen_ready_at")
            .eq("status", "completed").gte("kitchen_ready_at", dayStart.toISOString()).limit(300),
        ]);
        if (pRes.error) throw pRes.error;
        if (rRes.error) throw rRes.error;
        const pending = shape(pRes.data, true);
        await checkPending(pending);
        staleOrders = (sRes.data || []).map((o) => ({ id: o.id, items: liveItems(o).map((it) => it.id) }));
        const staleBar = document.getElementById("k-stale");
        staleBar.hidden = !staleOrders.length;
        document.getElementById("k-stale-n").textContent = staleOrders.length;
        document.getElementById("k-count-pending").textContent = pending.length;
        lastPending = pending;
        const mins = (aRes.data || []).map(prepMinutes).filter((m) => m !== null && m < 180);
        todayAvg = mins.length ? Math.round(mins.reduce((a, b2) => a + b2, 0) / mins.length) : null;
        renderStats();
        errBox.textContent = "";

        const orders = activeTab === "pending" ? pending : shape(rRes.data, false);
        ordersById = new Map(orders.map((o) => [o.id, o]));
        if (kTrackerTab !== activeTab + station) { kTracker = olvNewTracker(); kTrackerTab = activeTab + station; }
        const freshTickets = kTracker.diff(orders.map((o) => o.id));
        const where = station === "all" ? "" : ` عند ${stationById(station).name}`;
        grid.innerHTML = orders.length
          ? orders.map(cardHtml).join("")
          : `<div class="empty-state">لا يوجد طلبات ${activeTab === "pending" ? "قيد التحضير" : "جاهزة"}${where} حاليًا</div>`;
        olvMarkNew(grid, freshTickets);
        lastPollAt = Date.now();
        renderLive();
      } catch (err) {
        olvShowError(errBox, err);
      } finally {
        busy = false;
        if (pollAgain) poll();
      }
    }

    async function setDone(saleId, itemIds, done) {
      if (!itemIds.length) return true;
      const { error } = await db.rpc("set_items_kitchen_done", { p_sale_id: saleId, p_item_ids: itemIds, p_done: done });
      if (error) { olvShowError(errBox, error); return false; }
      return true;
    }

    // شطب صنف واحد (لمسة عالسطر) — بيتلوّن فورًا وبعدين منأكّد من السيرفر
    async function toggleLine(line) {
      if (line.classList.contains("busy")) return;
      const done = !line.classList.contains("done");
      line.classList.add("busy");
      line.classList.toggle("done", done);
      const ok = await setDone(line.dataset.sale, [line.dataset.item], done);
      line.classList.remove("busy");
      if (!ok) { line.classList.toggle("done", !done); return; }
      const o = ordersById.get(line.dataset.sale);
      if (o) {
        const it = o.items.find((x) => x.id === line.dataset.item);
        if (it) it.kitchen_done_at = done ? new Date().toISOString() : null;
        const card = line.closest(".order-card");
        const bar = card && card.querySelector(".tk-prog i");
        if (bar) bar.style.width = Math.round((o.items.filter(isDone).length / o.items.length) * 100) + "%";
        if (done && o.items.every(isDone)) {
          if (typeof OlvSound !== "undefined") OlvSound.playOrderReady();
          knownPendingIds && knownPendingIds.delete(line.dataset.sale);
          leaveCard(card);
        }
      }
      poll();
    }

    // مستمع واحد لكل البطاقات (بدل مستمع لكل زر مع كل تحديث)
    grid.addEventListener("click", async (e) => {
      const line = e.target.closest(".order-line.tap");
      if (line) { toggleLine(line); return; }
      const btn = e.target.closest("button[data-id]");
      if (!btn || btn.disabled) return;
      const o = ordersById.get(btn.dataset.id);
      if (!o) return;
      btn.disabled = true;
      const finishing = btn.dataset.act === "done";
      // «تم التجهيز» بيعلّم أصناف هالشاشة كلها؛ «إرجاع» بيرجّعهم — والسيرفر بيقرّر حالة الطلب كلّه
      const ids = o.items.filter((it) => (finishing ? !isDone(it) : true)).map((it) => it.id);
      const ok = await setDone(o.id, ids, finishing);
      if (!ok) { btn.disabled = false; return; }
      if (finishing) {
        if (typeof OlvSound !== "undefined") OlvSound.playOrderReady();
        knownPendingIds && knownPendingIds.delete(o.id); // مش إلغاء — ما في داعي لتنبيه
      }
      leaveCard(btn.closest(".order-card"));
      setTimeout(poll, 180);
    });
    grid.addEventListener("keydown", (e) => {
      const line = e.target.closest && e.target.closest(".order-line.tap");
      if (line && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleLine(line); }
    });

    document.getElementById("k-stale-btn").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!staleOrders.length || !confirm(`تعليم ${staleOrders.length} طلب قديم (أقدم من ${WINDOW_HOURS} ساعة) كـ«جاهز»؟`)) return;
      btn.disabled = true;
      for (const o of staleOrders) {
        if (!(await setDone(o.id, o.items, true))) break;
      }
      btn.disabled = false;
      poll();
    });

    document.querySelectorAll(".sub-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sub-tab").forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-selected", "false"); });
        btn.classList.add("on");
        btn.setAttribute("aria-selected", "true");
        activeTab = btn.dataset.tab;
        poll();
      });
    });

    document.getElementById("k-station").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-st]");
      if (!b || b.dataset.st === station) return;
      station = b.dataset.st;
      try { localStorage.setItem("olv_kitchen_station", station); } catch (_) {}
      knownPendingIds = null; // شاشة جديدة = أساس جديد، بدون صوت لكل الطلبات الموجودة
      renderStation();
      poll();
    });

    // «الأقسام» (للمالك والمدير): كل قسم من المنيو بأي محطة بيتحضّر
    document.getElementById("k-cats-btn").addEventListener("click", async () => {
      const { data, error } = await db.from("products").select("category").eq("is_active", true);
      if (error) { olvShowError(errBox, error); return; }
      const cats = [...new Set((data || []).map((p) => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar"));
      const back = document.createElement("div");
      back.className = "olv-failed-back";
      back.innerHTML = `
        <div class="olv-failed-box" role="dialog" aria-modal="true" aria-labelledby="k-cats-h">
          <h3 id="k-cats-h">وين بيتحضّر كل قسم؟</h3>
          <div class="hint" style="margin-bottom:8px;">أصناف كل قسم بتطلع على شاشة محطته بس. «الكل» بيضل يعرض كل شي.</div>
          ${cats.map((c) => `
            <label class="k-cat-row"><span>${olvEsc(c)}</span>
              <select data-cat="${olvEsc(c)}">
                ${stations.map((x) => `<option value="${olvEsc(x.id)}"${itemStation({ products: { category: c } }) === x.id ? " selected" : ""}>${olvEsc(x.name)}</option>`).join("")}
              </select>
            </label>`).join("")}
          <div style="display:flex; gap:8px; margin-top:14px;">
            <button type="button" class="btn gold" data-save>حفظ</button>
            <button type="button" class="btn" data-close>إلغاء</button>
          </div>
        </div>`;
      document.body.appendChild(back);
      const close = () => back.remove();
      back.addEventListener("click", async (ev) => {
        if (ev.target === back || ev.target.closest("[data-close]")) { close(); return; }
        const save = ev.target.closest("[data-save]");
        if (!save) return;
        save.disabled = true;
        const next = stations.map((x) => ({ ...x, categories: [] }));
        back.querySelectorAll("select[data-cat]").forEach((sel) => {
          const st = next.find((x) => x.id === sel.value);
          if (st) st.categories.push(sel.dataset.cat);
        });
        const { error: e2 } = await db.from("app_settings")
          .upsert({ key: "kitchen_stations", value: JSON.stringify(next) }, { onConflict: "key" });
        if (e2) { save.disabled = false; olvShowError(errBox, e2); return; }
        close();
        await loadStations();
        olvToast("انحفظت الأقسام", { type: "ok" });
        poll();
      });
    });

    // ملء الشاشة لتابلت المطبخ (بيتذكّره الجهاز)
    const focusBtn = document.getElementById("k-focus-btn");
    function setFocus(on, fromUser) {
      document.body.classList.toggle("k-focus", on);
      focusBtn.setAttribute("aria-pressed", String(on));
      try { localStorage.setItem("olv_kitchen_focus", on ? "1" : "0"); } catch (_) {}
      if (fromUser) {
        try {
          if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
          if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
        } catch (_) {}
      }
    }
    focusBtn.addEventListener("click", () => setFocus(!document.body.classList.contains("k-focus"), true));
    try { if (localStorage.getItem("olv_kitchen_focus") === "1") setFocus(true, false); } catch (_) {}

    // البث الفوري: أي تغيير بالطلبات أو الأصناف بيحدّث الشاشة بلحظتها. التحديث كل 15 ثانية بيضل احتياط لو انقطع البث
    let kickT = null;
    const kick = () => { clearTimeout(kickT); kickT = setTimeout(poll, 250); };
    function subscribeLive() {
      try {
        db.channel("kitchen-live")
          .on("postgres_changes", { event: "*", schema: "public", table: "sales_entries" }, kick)
          .on("postgres_changes", { event: "*", schema: "public", table: "sale_items" }, kick)
          .subscribe((status) => {
            const was = live;
            live = status === "SUBSCRIBED";
            renderLive();
            if (live && !was) kick(); // رجع البث: منلحق اللي فاتنا
          });
      } catch (_) { live = false; renderLive(); }
    }

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      if (window.olvRole === "owner" || window.olvRole === "manager") document.getElementById("k-cats-btn").hidden = false;
      renderStation();
      refreshSoundBar();
      keepAwake();
      await loadStations();
      await poll();
      subscribeLive();
      setInterval(() => { if (!live || Date.now() - lastPollAt > 60000) poll(); }, 15000);
      setInterval(tick, 1000);
    })();
    });
  </script>
