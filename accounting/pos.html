<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيع سريع — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode') || 'auto';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  window.olvApplyTheme = function(){
    document.documentElement.setAttribute('data-theme', computeTheme());
  };
  window.olvApplyTheme();
})();
</script>
<style>
  /* شاشة بيع سريع مقسومة على كامل عرض الشاشة (بدون حدود مستديرة ولا
     فراغ يخلي التذكرة تبدو بطاقة "طايرة" فوق الصفحة): عرض الأصناف
     ياخد معظم المساحة، والتذكرة عمود ضيق (ربع الشاشة تقريبًا) بحجم
     يتبع محتواها فعليًا بدل ما يتمدد على طول الشاشة كلها */
  .wrap{max-width:none; padding:0; margin:0;}
  #err.err{margin:14px 20px 0;}
  .pos-layout{display:flex; align-items:flex-start; min-height:calc(100vh - var(--nav-h, 112px));}
  .pos-main{flex:1 1 auto; min-width:0; padding:20px;}
  .pos-cart-panel{
    flex:0 0 25%; min-width:260px; max-width:340px; background:var(--ink-2);
    border-inline-start:1px solid var(--hair);
    position:sticky; top:var(--nav-h, 112px); align-self:flex-start;
    max-height:calc(100vh - var(--nav-h, 112px)); overflow-y:auto;
  }
  @media (max-width:900px){
    .pos-layout{flex-direction:column; min-height:0; align-items:stretch;}
    .pos-main{padding:16px 20px;}
    .pos-cart-panel{
      flex:0 0 auto; min-width:0; max-width:none;
      border-inline-start:none; border-top:1px solid var(--hair);
      position:sticky; bottom:0; top:auto; z-index:20; height:auto; max-height:65vh;
      align-self:auto; width:100%;
    }
  }

  .pos-toolbar{display:flex; gap:10px; margin-bottom:14px;}
  .pos-toolbar input[type=search]{
    flex:1; background:var(--ink-2); border:1px solid var(--hair); color:var(--paper);
    padding:12px 14px; border-radius:10px; font-size:16px; font-family:'Tajawal',sans-serif;
    min-height:44px;
  }
  .pos-toolbar input[type=search]:focus{outline:none; border-color:var(--gold);}
  .cat-tabs{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px;}
  .cat-tab{
    flex:none; background:var(--ink-2); border:1px solid var(--hair); color:var(--muted);
    padding:11px 16px; border-radius:999px; font-size:13px; white-space:nowrap; min-height:44px;
  }
  .cat-tab.on{background:var(--gold); color:#100e08; border-color:var(--gold); font-weight:700;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
  .card{
    background:var(--ink-2); border:1px solid var(--hair); border-radius:12px; overflow:hidden; cursor:pointer;
    transition:.15s; text-align:center; position:relative; box-shadow:var(--card-shadow);
  }
  .card:active{transform:scale(.97);}
  .card .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--ink-3);
  }
  .card .thumb-fallback{
    width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--ink-3),var(--ink-2));
    font-size:40px;
  }
  .card .info{padding:8px 8px 12px;}
  .card .name{font-size:13px; margin-bottom:4px;}
  .card .price{font-size:13px; color:var(--gold-hi); font-weight:700;}

  .sheet{
    position:fixed; inset:auto 0 0 0; background:var(--ink-2); border-top:1px solid var(--hair);
    border-radius:18px 18px 0 0; padding:18px 20px calc(18px + env(safe-area-inset-bottom));
    z-index:50; box-shadow:0 -10px 30px rgba(0,0,0,.4); max-height:80vh; overflow-y:auto;
  }
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;}
  .qty-row{display:flex; align-items:center; gap:14px; margin:14px 0;}
  .qty-row button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--hair); background:var(--ink-3);
    color:var(--paper); font-size:18px; flex:none;
  }
  .addon-row{
    display:flex; align-items:center; gap:10px; padding:12px 0;
    border-bottom:1px solid var(--hair-soft,rgba(201,162,75,.1)); cursor:pointer; width:100%;
  }
  .addon-row .addon-name{flex:1; font-size:13.5px;}
  .addon-row .a-price{color:var(--muted); font-size:12.5px;}

  .cart-panel-inner{
    padding:16px; display:flex; flex-direction:column;
  }
  .cart-bar{
    background:var(--ink-2); border-top:1px solid var(--hair); flex:none;
    padding:14px 0 0; margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .cart-bar .total{font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--gold-hi); font-weight:700;}
  .cart-bar .actions{display:flex; gap:8px;}
  .cart-list{margin-bottom:0;}
  .cart-item{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--hair-soft,rgba(201,162,75,.1)); font-size:15px;}
  .cart-item .meta{color:var(--muted); font-size:13px;}
  .cart-empty{color:var(--muted); font-size:14px; text-align:center; padding:60px 0;}
  .ticket-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .ticket-header h2{margin:0;}
  .ticket-badge{
    background:var(--gold); color:#100e08; font-size:12px; font-weight:700;
    border-radius:999px; min-width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    padding:0 6px;
  }
  .pos-pagination{display:flex; align-items:center; justify-content:center; gap:14px; padding-top:6px;}
  .pos-pagination button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--hair); background:var(--ink-2);
    color:var(--paper); font-size:16px;
  }
  .pos-pagination button:disabled{opacity:.35;}
  .pos-pagination .page-info{color:var(--muted); font-size:13px; min-width:70px; text-align:center;}
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="pos-layout">
      <div class="pos-main">
        <div class="pos-toolbar">
          <input type="search" id="product-search" placeholder="🔍 ابحث عن صنف...">
        </div>
        <div class="cat-tabs" id="cat-tabs"></div>
        <div class="grid" id="products-grid">
          <div class="hint">جاري التحميل...</div>
        </div>
        <div class="pos-pagination" id="pos-pagination" hidden>
          <button type="button" id="page-prev">›</button>
          <span class="page-info" id="page-info" dir="ltr">1 / 1</span>
          <button type="button" id="page-next">‹</button>
        </div>
      </div>

      <aside class="pos-cart-panel">
        <div class="cart-panel-inner">
          <div class="ticket-header">
            <h2>التذكرة</h2>
            <span class="ticket-badge" id="ticket-badge">0</span>
          </div>
          <div class="field" style="margin-bottom:12px;">
            <label>نوع الطلب</label>
            <select id="order-type">
              <option value="صالة">صالة</option>
              <option value="سفري">سفري</option>
              <option value="توصيل">توصيل</option>
            </select>
          </div>
          <div class="cart-list" id="cart-list"></div>
          <div class="cart-bar">
            <div>الإجمالي: <span class="total" id="cart-total">0.00</span></div>
            <div class="actions">
              <button class="btn" id="save-draft-btn" disabled>حفظ</button>
              <button class="btn gold" id="checkout-btn" disabled>الدفع</button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/sale-cart.js"></script>
  <script src="assets/notify-sound.js"></script>
  <script>
    olvRenderNav("pos");

    // يحسب ارتفاع الشريط العلوي فعليًا (يتغيّر حسب حجم الشاشة) ويخزّنه
    // كمتغيّر CSS، حتى تبدأ التذكرة والقائمة مباشرة تحته بدون أي فراغ
    function updateNavHeight() {
      const nav = document.getElementById("olv-nav");
      if (nav) document.documentElement.style.setProperty("--nav-h", nav.offsetHeight + "px");
    }
    updateNavHeight();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNavHeight);

    // أيقونة تعبيرية مناسبة للتصنيف تُستخدم كواجهة افتراضية أنيقة عند عدم توفر صورة حقيقية للصنف
    function categoryEmoji(category) {
      const c = category || "";
      const rules = [
        [/برغر|سندويش|شاورما/, "🍔"],
        [/بطاطا|سناك|ناتشوز|أجنحة|وودجز/, "🍟"],
        [/سلطة|مقبلات|حمص|فتوش|مناقيش/, "🥗"],
        [/قهوة|إسبريسو|كابتشينو|لاتيه|شاي|ساخن/, "☕"],
        [/عصير|سموذي|كوكتيل/, "🥤"],
        [/بارد|موهيتو|ليموناضة|آيس/, "🧊"],
        [/بوظة|آيس كريم|ميلك شيك/, "🍨"],
        [/دونات/, "🍩"],
        [/كيك|تشيز كيك|تيراميسو|حلويات/, "🍰"],
        [/أرجيلة|نكهات|شيشة/, "💨"],
        [/إضاف/, "➕"],
        [/مشروبات/, "🥤"],
      ];
      for (const [pattern, emoji] of rules) {
        if (pattern.test(c)) return emoji;
      }
      return "🍽️";
    }

    function olvHandleImageError(img) {
      const fallback = document.createElement("div");
      fallback.className = "thumb-fallback";
      fallback.textContent = img.dataset.fallbackEmoji || "🍽️";
      img.replaceWith(fallback);
    }

    // إشعار مؤقت يظهر أسفل الشاشة (نجاح بيع، أو تنبيه طلب جاهز)، بما إن
    // الشاشة بقيت مفتوحة على بيع سريع نفسها بدل الانتقال لصفحة منفصلة
    function showToast(msg, color) {
      const toast = document.createElement("div");
      toast.textContent = msg;
      toast.style.cssText = [
        "position:fixed", "bottom:24px", "left:50%", "transform:translateX(-50%)",
        `background:${color || "var(--ok)"}`, "color:#fff", "padding:12px 22px", "border-radius:10px",
        "font-size:14px", "font-weight:700", "z-index:100", "box-shadow:0 4px 16px rgba(0,0,0,.3)",
      ].join(";");
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }
    function showSuccessToast(msg) { showToast(msg, "var(--ok)"); }

    // يراقب الطلبات اليوم اللي صارت "جاهز" (المطبخ صار خلص فيها) ويطلع
    // صوت تنبيه + إشعار للكاشير — يتجاهل الطلبات الجاهزة أصلًا وقت فتح
    // الشاشة، وينبّه بس على اللي بيصير جاهز جديد بعدها
    let knownReadyIds = null; // null = لسا ما انعمل الأساس (baseline) الأول
    async function checkForReadyOrders() {
      const { data, error } = await window.supabaseClient
        .from("sales_entries")
        .select("id, order_type")
        .eq("kitchen_status", "جاهز")
        .eq("entry_date", olvToday())
        .limit(60);
      if (error) return;
      const currentIds = new Map((data || []).map((o) => [o.id, o]));
      if (knownReadyIds === null) {
        knownReadyIds = new Set(currentIds.keys());
        return;
      }
      const newOnes = [];
      currentIds.forEach((order, id) => { if (!knownReadyIds.has(id)) newOnes.push(order); });
      knownReadyIds = new Set(currentIds.keys());
      if (newOnes.length) {
        OlvSound.playOrderReady();
        newOnes.forEach((order) => {
          showToast(`✓ طلب ${order.order_type || ""} جاهز من المطبخ`, "var(--gold-dp)");
        });
      }
    }

    let session = null;
    let products = [];
    let addons = [];
    let popularity = {}; // product_id -> إجمالي الكمية المباعة تاريخيًا
    let activeCategory = "الكل";
    let searchTerm = "";
    let currentPage = 1;
    const BEST_SELLERS = "الأكثر مبيعًا";
    const DRAFT_KEY = "olv_pos_draft";

    // يحسب عدد الأعمدة/الصفوف اللي بتتسع فعليًا داخل الشاشة المفتوحة حاليًا
    // بدون سكرول، عشان باقي الأصناف تتوزع على صفحات بدل ما تتزاحم أو تختفي
    function computeGridCapacity() {
      const grid = document.getElementById("products-grid");
      const containerWidth = grid.clientWidth || 300;
      const gap = 12;
      const targetCardWidth = 150;
      const columns = Math.max(1, Math.floor((containerWidth + gap) / (targetCardWidth + gap)));
      const cardWidth = (containerWidth - (columns - 1) * gap) / columns;
      const infoHeight = 56;
      const cardHeight = cardWidth + infoHeight;
      const gridTop = grid.getBoundingClientRect().top;
      const reservedBottom = 56;
      const availableHeight = Math.max(cardHeight, window.innerHeight - gridTop - reservedBottom);
      const rows = Math.max(1, Math.floor((availableHeight + gap) / (cardHeight + gap)));
      return { columns, itemsPerPage: columns * rows };
    }

    function sortByPopularity(list) {
      return list.slice().sort((a, b) => {
        const pa = popularity[a.id] || 0;
        const pb = popularity[b.id] || 0;
        if (pb !== pa) return pb - pa;
        const sa = a.sort_order || 0;
        const sb = b.sort_order || 0;
        if (sa !== sb) return sa - sb;
        return a.name.localeCompare(b.name, "ar");
      });
    }

    function renderCategoryTabs() {
      const hasBestSellers = Object.keys(popularity).length > 0;
      const cats = [
        "الكل",
        ...(hasBestSellers ? [BEST_SELLERS] : []),
        ...new Set(products.map((p) => p.category)),
      ];
      document.getElementById("cat-tabs").innerHTML = cats.map((c) => `
        <button class="cat-tab${c === activeCategory ? " on" : ""}" data-cat="${c}">${c}</button>
      `).join("");
      document.querySelectorAll(".cat-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          currentPage = 1;
          renderCategoryTabs();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const grid = document.getElementById("products-grid");
      const pagination = document.getElementById("pos-pagination");
      let list;
      if (activeCategory === "الكل") {
        list = sortByPopularity(products);
      } else if (activeCategory === BEST_SELLERS) {
        list = sortByPopularity(products.filter((p) => popularity[p.id])).slice(0, 12);
      } else {
        list = sortByPopularity(products.filter((p) => p.category === activeCategory));
      }
      if (searchTerm) {
        list = list.filter((p) => p.name.toLowerCase().includes(searchTerm));
      }
      if (!list.length) {
        grid.innerHTML = `<div class="hint">لا توجد أصناف مطابقة. جرّب تصنيفًا آخر أو أضف منتجات من صفحة الإعدادات.</div>`;
        pagination.hidden = true;
        return;
      }

      const { columns, itemsPerPage } = computeGridCapacity();
      const totalPages = Math.max(1, Math.ceil(list.length / itemsPerPage));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageItems = list.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      grid.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
      grid.innerHTML = pageItems.map((p) => `
        <div class="card" data-id="${p.id}">
          ${p.image_url
            ? `<img class="thumb" src="${p.image_url}" alt="${p.name}" data-fallback-emoji="${categoryEmoji(p.category)}" onerror="olvHandleImageError(this)">`
            : `<div class="thumb-fallback">${categoryEmoji(p.category)}</div>`
          }
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="price">${olvFormatMoney(p.price)}</div>
          </div>
        </div>
      `).join("");
      grid.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => openAddSheet(card.dataset.id));
      });

      pagination.hidden = totalPages <= 1;
      document.getElementById("page-info").textContent = `${currentPage} / ${totalPages}`;
      document.getElementById("page-prev").disabled = currentPage <= 1;
      document.getElementById("page-next").disabled = currentPage >= totalPages;
    }

    function openAddSheet(productId) {
      const product = products.find((p) => p.id === productId);
      if (!product) return;
      const backdrop = document.createElement("div");
      backdrop.className = "sheet-backdrop";
      const sheet = document.createElement("div");
      sheet.className = "sheet";
      let qty = 1;
      let note = "";
      const selectedAddons = new Set();

      function render() {
        sheet.innerHTML = `
          <h2 style="margin-bottom:10px;">${product.name}</h2>
          <div class="hint" style="margin-bottom:10px;">${olvFormatMoney(product.price)}</div>
          ${addons.length ? `
            <div style="margin-bottom:10px;">
              ${addons.map((a) => `
                <label class="addon-row" for="addon-${a.id}">
                  <input type="checkbox" data-addon="${a.id}" id="addon-${a.id}" ${selectedAddons.has(a.id) ? "checked" : ""}>
                  <span class="addon-name">${a.name}</span>
                  <span class="a-price">+${olvFormatMoney(a.price)}</span>
                </label>
              `).join("")}
            </div>
          ` : ""}
          <div class="qty-row">
            <button type="button" id="qty-minus">−</button>
            <div style="font-size:16px; min-width:24px; text-align:center;">${qty}</div>
            <button type="button" id="qty-plus">+</button>
          </div>
          <div class="field">
            <label>ملاحظة للمطبخ (اختياري)</label>
            <input type="text" id="item-note" placeholder="مثال: بدون بصل" value="${note}">
          </div>
          <button class="btn gold" id="sheet-add" style="width:100%;">إضافة للسلة</button>
          <button class="btn" id="sheet-cancel" style="width:100%; margin-top:8px;">إلغاء</button>
        `;
        sheet.querySelectorAll("input[data-addon]").forEach((cb) => {
          cb.addEventListener("change", () => {
            if (cb.checked) selectedAddons.add(cb.dataset.addon);
            else selectedAddons.delete(cb.dataset.addon);
          });
        });
        sheet.querySelector("#qty-minus").addEventListener("click", () => { qty = Math.max(1, qty - 1); note = sheet.querySelector("#item-note").value; render(); });
        sheet.querySelector("#qty-plus").addEventListener("click", () => { qty += 1; note = sheet.querySelector("#item-note").value; render(); });
        sheet.querySelector("#sheet-cancel").addEventListener("click", close);
        sheet.querySelector("#sheet-add").addEventListener("click", () => {
          const chosenAddons = addons.filter((a) => selectedAddons.has(a.id));
          const finalNote = sheet.querySelector("#item-note").value.trim();
          OlvCart.add(product, chosenAddons, qty, finalNote);
          renderCart();
          close();
        });
      }
      function close() {
        backdrop.remove();
        sheet.remove();
      }
      backdrop.addEventListener("click", close);
      render();
      document.body.appendChild(backdrop);
      document.body.appendChild(sheet);
    }

    function saveDraft() {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        items: OlvCart.all(),
        orderType: document.getElementById("order-type").value,
      }));
      const btn = document.getElementById("save-draft-btn");
      const original = btn.textContent;
      btn.textContent = "تم الحفظ ✓";
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    function restoreDraftIfAny() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return;
        const draft = JSON.parse(raw);
        if (draft.items && draft.items.length) {
          OlvCart.restore(draft.items);
          if (draft.orderType) document.getElementById("order-type").value = draft.orderType;
        }
      } catch (e) { /* تجاهل أي تذكرة محفوظة تالفة */ }
    }

    function clearDraft() {
      localStorage.removeItem(DRAFT_KEY);
    }

    function renderCart() {
      const cart = OlvCart.all();
      const list = document.getElementById("cart-list");
      const checkoutBtn = document.getElementById("checkout-btn");
      const saveDraftBtn = document.getElementById("save-draft-btn");
      const itemCount = cart.reduce((s, item) => s + item.qty, 0);
      document.getElementById("ticket-badge").textContent = itemCount;
      if (!cart.length) {
        list.innerHTML = `<div class="cart-empty">السلة فارغة — اختر أصنافًا من القائمة</div>`;
        checkoutBtn.disabled = true;
        saveDraftBtn.disabled = true;
      } else {
        list.innerHTML = cart.map((item, idx) => `
          <div class="cart-item">
            <div>
              <div>${item.qty}× ${item.name}</div>
              ${item.addons.length ? `<div class="meta">+ ${item.addons.map((a) => a.name).join("، ")}</div>` : ""}
              ${item.note ? `<div class="meta">📝 ${item.note}</div>` : ""}
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span>${olvFormatMoney(OlvCart.lineTotal(item))}</span>
              <button class="btn small danger" data-idx="${idx}">حذف</button>
            </div>
          </div>
        `).join("");
        list.querySelectorAll("button[data-idx]").forEach((btn) => {
          btn.addEventListener("click", () => {
            OlvCart.removeAt(Number(btn.dataset.idx));
            renderCart();
          });
        });
        checkoutBtn.disabled = false;
        saveDraftBtn.disabled = false;
      }
      document.getElementById("cart-total").textContent = olvFormatMoney(OlvCart.total());
    }

    function openCheckoutSheet() {
      const total = OlvCart.total();
      const backdrop = document.createElement("div");
      backdrop.className = "sheet-backdrop";
      const sheet = document.createElement("div");
      sheet.className = "sheet";

      function render() {
        const method = sheet.querySelector("#pay-method") ? sheet.querySelector("#pay-method").value : "cash";
        sheet.innerHTML = `
          <h2 style="margin-bottom:14px;">إتمام البيع — ${olvFormatMoney(total)}</h2>
          <div class="field">
            <label>طريقة الدفع</label>
            <select id="pay-method">
              <option value="cash"${method === "cash" ? " selected" : ""}>كاش</option>
              <option value="card"${method === "card" ? " selected" : ""}>شبكة / فيزا</option>
              <option value="delivery"${method === "delivery" ? " selected" : ""}>توصيل / تطبيقات</option>
            </select>
          </div>
          ${method === "cash" ? `
            <div class="field">
              <label>المبلغ المستلم من الزبون</label>
              <input type="number" id="cash-received" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="stat" style="margin-bottom:16px;">
              <div class="label">الباقي المطلوب إرجاعه للزبون</div>
              <div class="value" id="change-due">0.00</div>
            </div>
          ` : ""}
          <button class="btn gold" id="confirm-sale" style="width:100%;">تأكيد البيع</button>
          <button class="btn" id="cancel-sale" style="width:100%; margin-top:8px;">رجوع</button>
        `;
        sheet.querySelector("#pay-method").addEventListener("change", render);
        sheet.querySelector("#cancel-sale").addEventListener("click", close);
        const cashInput = sheet.querySelector("#cash-received");
        const changeEl = sheet.querySelector("#change-due");
        const confirmBtn = sheet.querySelector("#confirm-sale");
        function updateChange() {
          if (!cashInput) return;
          const received = Number(cashInput.value || 0);
          const change = received - total;
          changeEl.textContent = olvFormatMoney(Math.max(change, 0));
          changeEl.className = "value " + (change < 0 ? "bad" : "good");
          confirmBtn.disabled = received < total;
        }
        if (cashInput) {
          cashInput.addEventListener("input", updateChange);
          updateChange();
        }
        confirmBtn.addEventListener("click", async () => {
          confirmBtn.disabled = true;
          const errBox = document.getElementById("err");
          try {
            const payMethod = sheet.querySelector("#pay-method").value;
            const orderType = document.getElementById("order-type").value;
            let extraNotes = "بيع سريع";
            let cashReceived = null;
            let changeDue = null;
            if (payMethod === "cash" && cashInput) {
              cashReceived = Number(cashInput.value || 0);
              changeDue = Math.max(cashReceived - total, 0);
              extraNotes += ` — مستلم ${olvFormatMoney(cashReceived)}، الباقي ${olvFormatMoney(changeDue)}`;
            }
            await OlvCart.checkout({ paymentMethod: payMethod, entryDate: olvToday(), extraNotes, orderType, cashReceived, changeDue });
            clearDraft();
            renderCart();
            close();
            showSuccessToast("✓ تم تسجيل البيع بنجاح");
            refreshPopularityAndGrid();
          } catch (err) {
            olvShowError(errBox, err);
            confirmBtn.disabled = false;
          }
        });
      }
      function close() { backdrop.remove(); sheet.remove(); }
      backdrop.addEventListener("click", close);
      render();
      document.body.appendChild(backdrop);
      document.body.appendChild(sheet);
    }

    // يعيد تحميل ترتيب "الأكثر مبيعًا" من قاعدة البيانات ويعيد رسم القائمة —
    // يُستدعى عند فتح الشاشة، وأيضًا بعد كل عملية بيع (لأن الشاشة صارت
    // تبقى مفتوحة على نفسها بدل الانتقال لصفحة أخرى)
    async function refreshPopularityAndGrid() {
      const { data: salesData, error } = await window.supabaseClient.from("product_sales_totals").select("*");
      if (error) return;
      popularity = {};
      (salesData || []).forEach((r) => { popularity[r.product_id] = Number(r.total_qty); });
      renderCategoryTabs();
      renderGrid();
    }

    (async () => {
      session = await olvRequireAuth();
      if (!session) return;
      const errBox = document.getElementById("err");
      try {
        const [{ data: prodData, error: e1 }, { data: addonData, error: e2 }, { data: salesData, error: e3 }] = await Promise.all([
          window.supabaseClient.from("products").select("*").eq("is_active", true).order("category").order("sort_order"),
          window.supabaseClient.from("addons").select("*").eq("is_active", true).order("name"),
          window.supabaseClient.from("product_sales_totals").select("*"),
        ]);
        if (e1) throw e1;
        if (e2) throw e2;
        products = prodData || [];
        addons = addonData || [];
        popularity = {};
        (salesData || []).forEach((r) => { popularity[r.product_id] = Number(r.total_qty); });
        renderCategoryTabs();
        renderGrid();
      } catch (err) {
        olvShowError(errBox, err);
      }
      restoreDraftIfAny();
      renderCart();
      document.getElementById("checkout-btn").addEventListener("click", openCheckoutSheet);
      document.getElementById("save-draft-btn").addEventListener("click", saveDraft);
      document.getElementById("product-search").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim().toLowerCase();
        currentPage = 1;
        renderGrid();
      });
      document.getElementById("page-prev").addEventListener("click", () => { currentPage--; renderGrid(); });
      document.getElementById("page-next").addEventListener("click", () => { currentPage++; renderGrid(); });
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { updateNavHeight(); renderGrid(); }, 200);
      });

      await checkForReadyOrders();
      setInterval(checkForReadyOrders, 15000);
    })();
  </script>
</body>
</html>
