<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المطبخ — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode') || 'auto';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  window.olvApplyTheme = function(){
    document.documentElement.setAttribute('data-theme', computeTheme());
  };
  window.olvApplyTheme();
})();
</script>
<style>
  .sub-tabs{display:flex; gap:8px; margin-bottom:16px; align-items:center;}
  .sub-tab{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ink-2); border:1px solid var(--hair); color:var(--muted);
    padding:10px 18px; border-radius:999px; font-size:13px; min-height:44px;
  }
  .sub-tab.on{background:var(--gold); color:#100e08; border-color:var(--gold); font-weight:700;}
  .orders-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .order-card{
    background:var(--ink-2); border:1px solid var(--hair); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; box-shadow:var(--card-shadow); transition:.15s;
  }
  .order-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.12);}
  .order-card.overdue{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger), 0 8px 24px rgba(193,88,63,.15);}
  .order-card.overdue:hover{border-color:var(--danger);}
  .order-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .order-time-wrap{display:flex; align-items:baseline; gap:8px;}
  .order-time{font-family:'Cormorant Garamond',serif; font-size:21px; color:var(--gold-hi); font-weight:700;}
  .order-age{font-size:11.5px; color:var(--muted);}
  .order-age.overdue{color:var(--danger-hi); font-weight:700;}
  .order-type-badge{
    font-size:12px; border:1px solid var(--hair); border-radius:999px; padding:3px 10px; color:var(--muted);
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .order-route{font-size:13.5px; font-weight:700; color:var(--gold-hi); margin-bottom:8px;}
  .order-items{flex:1; margin-bottom:14px;}
  .order-line{padding:8px 0; border-bottom:1px solid var(--hair-soft,rgba(201,162,75,.1)); font-size:14px;}
  .order-line:last-child{border-bottom:none;}
  .order-line .qty-line{display:flex; align-items:center; gap:8px;}
  .order-line .order-qty-badge{
    flex:none; background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#100e08;
    font-weight:700; font-size:12px; min-width:24px; height:22px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .order-line .item-name{font-weight:600;}
  .order-line .addons{color:var(--olive-hi,#9dab63); font-size:12.5px; margin-top:2px; margin-inline-start:32px;}
  .order-line .note{color:var(--danger-hi); font-size:12.5px; margin-top:2px; margin-inline-start:32px;}
  .empty-state{color:var(--muted); text-align:center; padding:60px 0; grid-column:1/-1;}
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="sub-tabs">
      <button class="sub-tab on" data-tab="pending"><span>⏳</span> قيد التحضير</button>
      <button class="sub-tab" data-tab="ready"><span>✅</span> جاهز</button>
      <span class="hint" style="margin-inline-start:auto;">تحديث تلقائي كل 15 ثانية</span>
    </div>

    <div class="orders-grid" id="orders-grid">
      <div class="hint">جاري التحميل...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/notify-sound.js"></script>
  <script src="assets/connection-status.js"></script>
  <script src="assets/incoming-orders-poll.js"></script>
  <script>
    olvRenderNav("kitchen");

    const PENDING_STATUS = "قيد التحضير";
    const READY_STATUS = "جاهز";
    let activeTab = "pending";
    let knownPendingIds = null; // null = لسا ما انعمل الأساس (baseline) الأول

    // يفحص وجود طلبات جديدة قيد التحضير بشكل مستقل عن التبويب المفتوح
    // حاليًا (قد يكون الموظف فاتح تبويب "جاهز" وقت وصول طلب جديد)، ويشغّل
    // نغمة تنبيه فقط لما يكتشف طلبًا جديدًا فعليًا وليس عند أول تحميل للصفحة
    async function checkForNewOrders() {
      const { data, error } = await window.supabaseClient
        .from("sales_entries")
        .select("id, sale_items(id)")
        .eq("kitchen_status", PENDING_STATUS)
        .eq("status", "completed")
        .limit(60);
      if (error) return;
      const currentIds = new Set((data || []).filter((o) => o.sale_items && o.sale_items.length).map((o) => o.id));
      if (knownPendingIds === null) {
        knownPendingIds = currentIds;
        return;
      }
      let hasNew = false;
      currentIds.forEach((id) => { if (!knownPendingIds.has(id)) hasNew = true; });
      knownPendingIds = currentIds;
      if (hasNew) OlvSound.playNewOrder();
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", numberingSystem: "latn" });
    }

    function minutesSince(ts) {
      return (Date.now() - new Date(ts).getTime()) / 60000;
    }

    async function loadOrders() {
      const errBox = document.getElementById("err");
      const grid = document.getElementById("orders-grid");
      try {
        const status = activeTab === "pending" ? PENDING_STATUS : READY_STATUS;
        const { data, error } = await window.supabaseClient
          .from("sales_entries")
          .select("*, sale_items(*)")
          .eq("kitchen_status", status)
          .eq("status", "completed")
          .order("created_at", { ascending: activeTab === "pending" })
          .limit(60);
        if (error) throw error;
        const orders = (data || []).filter((o) => o.sale_items && o.sale_items.length);
        if (!orders.length) {
          grid.innerHTML = `<div class="empty-state">لا يوجد طلبات ${activeTab === "pending" ? "قيد التحضير" : "جاهزة"} حاليًا</div>`;
          return;
        }
        grid.innerHTML = orders.map((o) => {
          const ageMinutes = Math.floor(minutesSince(o.created_at));
          const overdue = activeTab === "pending" && ageMinutes > 15;
          const isDelivery = o.order_type === "توصيل";
          return `
            <div class="order-card${overdue ? " overdue" : ""}">
              <div class="order-head">
                <div class="order-time-wrap">
                  <span class="order-time">${formatTime(o.created_at)}</span>
                  ${activeTab === "pending" ? `<span class="order-age${overdue ? " overdue" : ""}">${overdue ? "⏰ " : ""}قبل ${ageMinutes} د</span>` : ""}
                </div>
                ${o.order_type ? `<span class="order-type-badge">${isDelivery ? "🛵" : "🍽️"} ${o.order_type}</span>` : ""}
              </div>
              ${o.customer_name ? `<div class="order-route">👤 ${o.customer_name}</div>` : ""}
              ${o.table_number ? `<div class="order-route">🪑 طاولة رقم ${o.table_number}</div>` : ""}
              ${o.customer_phone ? `<div class="order-route" dir="ltr">📞 ${o.customer_phone}</div>` : ""}
              <div class="order-items">
                ${o.sale_items.map((it) => `
                  <div class="order-line">
                    <div class="qty-line">
                      <span class="order-qty-badge">${it.qty}×</span>
                      <span class="item-name">${it.product_name}</span>
                    </div>
                    ${it.addons_summary ? `<div class="addons">+ ${it.addons_summary}</div>` : ""}
                    ${it.note ? `<div class="note">📝 ${it.note}</div>` : ""}
                  </div>
                `).join("")}
              </div>
              <button class="btn ${activeTab === "pending" ? "gold" : ""} small" data-id="${o.id}" data-next="${activeTab === "pending" ? READY_STATUS : PENDING_STATUS}">
                ${activeTab === "pending" ? "✓ تم التجهيز" : "↺ إرجاع لقيد التحضير"}
              </button>
            </div>
          `;
        }).join("");
        grid.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            const { error } = await window.supabaseClient
              .from("sales_entries").update({ kitchen_status: btn.dataset.next }).eq("id", btn.dataset.id);
            if (error) { olvShowError(errBox, error); btn.disabled = false; return; }
            if (activeTab === "pending" && typeof OlvSound !== "undefined") OlvSound.playOrderReady();
            loadOrders();
          });
        });
      } catch (err) {
        olvShowError(errBox, err);
      }
    }

    document.querySelectorAll(".sub-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sub-tab").forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        activeTab = btn.dataset.tab;
        loadOrders();
      });
    });

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      await loadOrders();
      await checkForNewOrders();
      setInterval(() => { loadOrders(); checkForNewOrders(); }, 15000);
    })();
  </script>
  <footer class="olv-footer">© 2026 مهند — جميع الحقوق محفوظة</footer>
</body>
</html>
