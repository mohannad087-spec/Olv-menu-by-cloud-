<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المستلزمات — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a09">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاسبة OLV">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode') || 'auto';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  function applyCustomTheme(){
    var root = document.documentElement.style;
    var props = ['--ink', '--ink-2', '--ink-3', '--paper', '--muted', '--hair', '--hair-soft',
      '--overlay-bg', '--gold', '--gold-hi', '--gold-dp', '--gold-rgb', '--on-gold'];
    try {
      var raw = localStorage.getItem('olv_custom_theme');
      var t = raw ? JSON.parse(raw) : null;
      if (!t) {
        props.forEach(function (p) { root.removeProperty(p); });
        return false;
      }
      document.documentElement.setAttribute('data-theme', t.isDark ? 'dark' : 'light');
      root.setProperty('--ink', t.ink);
      root.setProperty('--ink-2', t.ink2);
      root.setProperty('--ink-3', t.ink3);
      root.setProperty('--paper', t.paper);
      root.setProperty('--muted', t.muted);
      root.setProperty('--hair', t.hair);
      root.setProperty('--hair-soft', t.hairSoft);
      root.setProperty('--overlay-bg', t.overlayBg);
      root.setProperty('--gold', t.gold);
      root.setProperty('--gold-hi', t.goldHi);
      root.setProperty('--gold-dp', t.goldDp);
      root.setProperty('--gold-rgb', t.goldRgb);
      root.setProperty('--on-gold', t.onGold);
      return true;
    } catch (e) {
      props.forEach(function (p) { root.removeProperty(p); });
      return false;
    }
  }
  window.olvApplyTheme = function(){
    var theme = computeTheme();
    document.documentElement.setAttribute('data-theme', theme);
    window.olvCustomThemeActive = applyCustomTheme();
  };
  window.olvApplyTheme();
})();
</script>
<style>
  .low-stock{color:var(--danger-hi); font-weight:700;}
  .low-stock .icon{width:13px; height:13px; vertical-align:-2px;}
  .stock-adjust-input{width:80px; background:var(--ink-2); border:1px solid var(--hair); color:var(--paper); padding:10px; border-radius:8px; font-size:16px; font-family:'Tajawal',sans-serif;}
  .stock-adjust-reason{background:var(--ink-2); border:1px solid var(--hair); color:var(--paper); padding:8px; border-radius:8px; font-size:14px; font-family:'Tajawal',sans-serif;}
  .cat-accordion-head{
    width:100%; display:flex; align-items:center; gap:10px; text-align:right;
    background:var(--ink-2); border:1px solid var(--hair); border-radius:10px;
    padding:12px 14px; color:var(--paper); font-size:14px; font-weight:600;
  }
  .cat-accordion-head:hover{border-color:var(--gold);}
  .cat-accordion-head .caret{color:var(--gold); transition:.2s; display:inline-block;}
  .cat-accordion-head .caret.open{transform:rotate(90deg);}
  .cat-accordion-head span:nth-child(2){flex:1;}
  .olv-add-box summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .olv-add-box summary::-webkit-details-marker{display:none;}
  .olv-add-box summary::before{content:"＋"; color:var(--gold-hi); font-weight:700;}
  .olv-add-box[open] summary::before{content:"－";}
  .inv-filter{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .inv-filter input[type=search]{flex:1; min-width:220px; box-sizing:border-box; padding:12px 14px; font-size:16px; background:var(--ink-2); border:1px solid var(--hair); color:var(--paper); border-radius:10px; font-family:'Tajawal',sans-serif;}
  .inv-filter input[type=search]:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(var(--gold-rgb),.18);}
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="group">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0;">المستلزمات الحالية</h2>
        <a class="btn gold" id="prepare-order-btn" href="purchase-orders.html" style="text-decoration:none;"></a>
      </div>
      <div class="inv-filter">
        <input type="search" id="sup-q" placeholder="🔍 ابحث بكلمة في المستلزمات" autocomplete="off" aria-label="ابحث في المستلزمات">
        <span class="hint" id="sup-count" style="margin:0;"></span>
      </div>
      <div id="supplies-by-category">
        <div class="hint">جاري التحميل...</div>
      </div>
    </div>

    <details class="group olv-add-box">
      <summary><h2 style="display:inline; margin:0;">إضافة مستلزمات جديدة</h2> <span class="hint">(يدوي أو من الكتالوج)</span></summary>
      <div style="margin-top:14px;">
    <div class="group" style="margin-bottom:12px;">
      <h2>كتالوج المستلزمات الجاهزة</h2>
      <p class="hint" style="margin-bottom:14px;">
        أكواب، علب، أكياس، مناديل، منظفات، رولات كاشير وغيرها — ابحث وحدد وأضف دفعة وحدة بدل الإدخال اليدوي.
      </p>
      <button type="button" class="btn gold" id="open-catalog-btn"></button>
    </div>

    <div class="group" style="margin-bottom:12px;">
      <h2>إضافة مستلزم جديد</h2>
      <form id="supply-form">
        <div class="row3">
          <div class="field">
            <label>اسم المستلزم</label>
            <input type="text" id="s-name" placeholder="مثال: كيس ورق 22 سم أبيض" required>
          </div>
          <div class="field">
            <label>التصنيف</label>
            <input type="text" id="s-category" placeholder="مثال: مطعم" value="عام">
          </div>
          <div class="field">
            <label>الوحدة</label>
            <select id="s-unit">
              <option value="قطعة" selected>قطعة</option>
              <option value="كيلوغرام">كيلوغرام (كغم)</option>
              <option value="كيس">كيس</option>
              <option value="طقم">طقم</option>
              <option value="علبة">علبة</option>
              <option value="كرتون">كرتون</option>
            </select>
          </div>
        </div>
        <div class="row3">
          <div class="field">
            <label>الكمية الحالية</label>
            <input type="number" id="s-stock" step="0.001" min="0" value="0" required>
          </div>
          <div class="field">
            <label>حد التنبيه</label>
            <input type="number" id="s-threshold" step="0.001" min="0" value="0">
          </div>
          <div class="field">
            <label>المورد (اختياري)</label>
            <select id="s-supplier"><option value="">— بدون —</option></select>
          </div>
        </div>
        <button type="submit" class="btn gold">إضافة</button>
      </form>
    </div>

      </div>
    </details>

  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/offline-queue.js"></script>
  <script defer src="assets/supabase-client.js"></script>
  <script defer src="assets/auth-guard.js"></script>
  <script defer src="assets/layout.js"></script>
  <script defer src="assets/ai-assist.js"></script>
  <script defer src="assets/notify-sound.js"></script>
  <script defer src="assets/connection-status.js"></script>
  <script defer src="assets/incoming-orders-poll.js"></script>
  <script defer src="assets/low-stock-poll.js"></script>
  <script defer src="assets/menu-stock-sync.js"></script>
  <script defer src="assets/print-health.js"></script>
  <script defer src="assets/catalog.js"></script>
  <script defer src="assets/search.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    olvRenderNav("supplies");
    document.getElementById("open-catalog-btn").innerHTML = olvIcon("search") + "<span>تصفّح الكتالوج وإضافة أصناف</span>";
    document.getElementById("open-catalog-btn").addEventListener("click", () => {
      olvOpenCatalog({ kind: "s", onDone: () => loadSupplies() });
    });
    document.getElementById("prepare-order-btn").innerHTML = olvIcon("clipboard") + "<span>تجهيز طلبية</span>";

    let supplies = [];
    let suppliers = [];
    const openCategories = new Set();

    async function loadSuppliersSelect() {
      const { data, error } = await window.supabaseClient.from("suppliers").select("id, name, phone").order("name");
      if (error) { olvShowError(document.getElementById("err"), error); return; }
      suppliers = data || [];
      const sel = document.getElementById("s-supplier");
      sel.innerHTML = `<option value="">— بدون —</option>` + suppliers.map((s) => `<option value="${s.id}">${olvEsc(s.name)}</option>`).join("");
    }

    const supTracker = olvNewTracker();
    // useCache=true: إعادة رسم بدون جلب (للبحث وفتح/تسكير التصنيفات)
    async function loadSupplies(useCache) {
      const errBox = document.getElementById("err");
      const container = document.getElementById("supplies-by-category");
      try {
        let freshSup = new Set();
        if (!(useCache && supplies.length)) {
          const { data, error } = await window.supabaseClient
            .from("supplies").select("*").order("category").order("name");
          if (error) throw error;
          supplies = data || [];
          freshSup = supTracker.diff(supplies.map((s) => s.id));
        }
        const q = document.getElementById("sup-q").value.trim();
        const isLowS = (s) => Number(s.low_stock_threshold) > 0 && Number(s.current_stock) <= Number(s.low_stock_threshold);
        const shownList = supplies.filter((s) => olvSearchMatch(s.name + " " + (s.category || ""), q));
        document.getElementById("sup-count").textContent = supplies.length ? (q ? `${shownList.length} من ${supplies.length}` : `${supplies.length} مستلزم`) : "";
        // مستلزم جديد بتصنيف مسكّر: نفتح التصنيف حتى يشوفه المستخدم (تأكيد إنه انحفظ)
        supplies.forEach((s) => { if (freshSup.has(s.id)) openCategories.add(s.category || "عام"); });
        if (!supplies.length) {
          container.innerHTML = `<div class="hint">لا يوجد مستلزمات بعد</div>`;
          return;
        }
        if (!shownList.length) { container.innerHTML = `<div class="hint">ما في مستلزم بهالكلمة — جرّب كلمة ثانية</div>`; return; }
        const byCategory = {};
        shownList.forEach((s) => {
          const cat = s.category || "عام";
          (byCategory[cat] = byCategory[cat] || []).push(s);
        });
        container.innerHTML = Object.keys(byCategory).map((cat) => {
          const open = openCategories.has(cat) || !!q; // البحث بيفتح التصنيفات اللي فيها نتائج
          const lowN = byCategory[cat].filter(isLowS).length;
          return `
          <div class="cat-accordion" style="margin-bottom:10px;">
            <button type="button" class="cat-accordion-head" data-cat-toggle="${olvEsc(cat)}">
              <span class="caret${open ? " open" : ""}">▸</span>
              <span>${olvEsc(cat)}</span>
              <span class="badge">${byCategory[cat].length}</span>${lowN ? `<span class="badge" style="background:var(--danger); color:#fff;" title="مستلزمات ناقصة بهالتصنيف">${lowN} ناقص</span>` : ""}
            </button>
            ${open ? `
            <div class="table-wrap">
              <table>
                <thead><tr><th>المستلزم</th><th>الوحدة</th><th>الكمية</th><th>تعديل</th><th></th></tr></thead>
                <tbody>
                  ${byCategory[cat].map((s) => {
                    const low = Number(s.current_stock) <= Number(s.low_stock_threshold) && Number(s.low_stock_threshold) > 0;
                    return `
                    <tr data-row-id="${olvEsc(s.id)}">
                      <td>${olvEsc(s.name)}</td>
                      <td>${olvEsc(s.unit)}</td>
                      <td class="${low ? "low-stock" : ""}">${s.current_stock}${low ? " " + olvIcon("warning") : ""}</td>
                      <td>
                        <div style="display:flex; gap:6px;">
                          <input type="number" step="0.001" placeholder="+/-" class="stock-adjust-input" data-adjust="${s.id}">
                    <select class="stock-adjust-reason" data-reason="${s.id}" title="سبب التعديل"><option value="adjust">تعديل</option><option value="waste">هدر/تالف</option></select>
                          <button class="btn small" data-apply="${s.id}">تعديل</button>
                        </div>
                      </td>
                      <td><button class="btn small danger" data-del="${s.id}">حذف</button></td>
                    </tr>
                  `; }).join("")}
                </tbody>
              </table>
            </div>
            ` : ""}
          </div>
        `;
        }).join("");

        olvMarkNew(container, freshSup, { scroll: true });
        container.querySelectorAll("button[data-cat-toggle]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const cat = btn.dataset.catToggle;
            if (openCategories.has(cat)) openCategories.delete(cat);
            else openCategories.add(cat);
            loadSupplies(true);
          });
        });
        container.querySelectorAll("button[data-apply]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const input = container.querySelector(`input[data-adjust="${btn.dataset.apply}"]`);
            const delta = Number(input.value || 0);
            if (!delta) return;
            const reason = container.querySelector(`select[data-reason="${btn.dataset.apply}"]`).value;
            if (reason === "waste" && delta > 0) { olvShowError(errBox, new Error("الهدر لازم يكون بالسالب (مثال: -2)")); return; }
            // تعديل ذرّي على السيرفر + سطر بسجل الحركات (adjust_stock، schema-inventory-hardening.sql)
            btn.disabled = true;
            const { error } = await window.supabaseClient.rpc("adjust_stock", {
              p_kind: "supply", p_id: btn.dataset.apply, p_delta: delta, p_reason: reason, p_note: null,
            });
            btn.disabled = false;
            if (error) { olvShowError(errBox, error); return; }
            await loadSupplies();
            olvToast("تم تعديل الكمية");
          });
        });
        container.querySelectorAll("button[data-del]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("حذف هذا المستلزم؟")) return;
            const { error } = await window.supabaseClient.from("supplies").delete().eq("id", btn.dataset.del);
            if (error) { olvShowError(errBox, error); return; }
            await loadSupplies();
            olvToast("تم حذف المستلزم");
          });
        });
      } catch (err) {
        olvShowError(errBox, err);
      }
    }

    let supTimer = null;
    document.getElementById("sup-q").addEventListener("input", () => { clearTimeout(supTimer); supTimer = setTimeout(() => loadSupplies(true), 100); });
    document.getElementById("supply-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("err");
      try {
        const payload = {
          name: document.getElementById("s-name").value.trim(),
          category: document.getElementById("s-category").value.trim() || "عام",
          unit: document.getElementById("s-unit").value,
          current_stock: Number(document.getElementById("s-stock").value || 0),
          low_stock_threshold: Number(document.getElementById("s-threshold").value || 0),
          supplier_id: document.getElementById("s-supplier").value || null,
        };
        const { error } = await window.supabaseClient.from("supplies").insert(payload);
        if (error) throw error;
        document.getElementById("supply-form").reset();
        document.getElementById("s-category").value = "عام";
        document.getElementById("s-unit").value = "قطعة";
        await loadSupplies();
        olvToast("تمت إضافة المستلزم");
      } catch (err) {
        olvShowError(errBox, err);
      }
    });

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      const errBox = document.getElementById("err");
      try {
        await Promise.all([loadSuppliersSelect(), loadSupplies()]);
      } catch (err) {
        olvShowError(errBox, err);
      }
    })();
    });
  </script>
  <footer class="olv-footer">© 2026 مهند — جميع الحقوق محفوظة</footer>
</body>
</html>
