<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="center-card">
    <h1>محاسبة OLV</h1>
    <div class="err" id="err"></div>
    <form id="login-form">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn gold" id="login-btn" style="width:100%">دخول</button>
      <p class="hint" style="text-align:center;margin-top:16px;">
        الحساب بيتعمل من صاحب المطعم عن طريق Supabase Dashboard — راجع ملف README.
      </p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script>
    (async () => {
      if (!window.supabaseClient) return;
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session) window.location.href = "index.html";
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("err");
      errBox.style.display = "none";
      if (!window.supabaseClient) {
        olvShowError(errBox, new Error("إعدادات Supabase غير مضبوطة. راجع config.js"));
        return;
      }
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "جاري الدخول...";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      btn.textContent = "دخول";
      if (error) {
        olvShowError(errBox, error);
        return;
      }
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
