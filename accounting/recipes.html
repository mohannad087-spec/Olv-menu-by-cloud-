<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصفات المشروبات — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode') || 'auto';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  window.olvApplyTheme = function(){
    document.documentElement.setAttribute('data-theme', computeTheme());
  };
  window.olvApplyTheme();
})();
</script>
<style>
  .intro{color:var(--muted); font-size:13.5px; line-height:1.8; margin:0 0 18px;}

  .sub-tabs{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .sub-tab{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ink-2); border:1px solid var(--hair); color:var(--muted);
    padding:10px 18px; border-radius:999px; font-size:13px; min-height:44px;
  }
  .sub-tab.on{background:var(--gold); color:#100e08; border-color:var(--gold); font-weight:700;}
  .sub-tab.on[data-tab="cold"]{background:var(--olive); border-color:var(--olive);}

  .section-title{font-size:16px; margin:22px 4px 10px;}

  .recipes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
  .recipe-card{
    background:var(--ink-2); border:1px solid var(--hair); border-radius:14px; overflow:hidden;
    box-shadow:var(--card-shadow);
  }
  .recipe-card > summary{list-style:none; cursor:pointer; display:block;}
  .recipe-card > summary::-webkit-details-marker{display:none;}
  .art{aspect-ratio:4/3; display:grid; place-items:center; background:var(--ink-3); border-bottom:1px solid var(--hair);}
  .art svg{width:70%; height:auto; overflow:visible;}
  .recipe-body{padding:14px 16px 0;}
  .recipe-card h3{font-size:18px; margin:0 0 1px;}
  .recipe-en{font-size:11px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; font-family:'Tajawal',sans-serif;}
  .recipe-teaser{font-size:13px; color:var(--muted); line-height:1.7; margin:8px 0 10px;}
  .recipe-meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:2px;}
  .recipe-toggle{
    display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700;
    color:var(--gold-hi); padding:14px 16px;
  }
  .recipe-card.cold .recipe-toggle{color:var(--olive-hi);}
  .recipe-toggle .chev{transition:transform .2s;}
  details[open] .recipe-toggle .chev{transform:rotate(180deg);}

  .recipe-detail{padding:0 16px 18px; border-top:1px dashed var(--hair);}
  .recipe-detail h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 8px; font-weight:700;}
  .ingredients{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none;}
  .steps{list-style:none; margin:0; padding:0;}
  .steps li{display:flex; gap:10px; padding-block:8px; position:relative;}
  .steps li:not(:last-child)::before{
    content:""; position:absolute; inset-inline-start:12px; top:29px; bottom:-2px; width:1px; background:var(--hair);
  }
  .step-num{
    flex:none; width:26px; height:26px; border-radius:50%; z-index:1;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#100e08;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;
  }
  .recipe-card.cold .step-num{background:linear-gradient(180deg,var(--olive-hi),var(--olive));}
  .steps .txt{padding-top:3px; font-size:13.5px; line-height:1.65;}

  .vessel-fill{fill:var(--ink-2);}
  .vessel-line{stroke:var(--muted);}
  .glass-line{stroke:var(--muted);}
  .card-fill{fill:var(--ink-2);}
  .steam-line{stroke:var(--muted);}

  @keyframes rise{0%{transform:translateY(4px); opacity:0;} 30%{opacity:.6;} 100%{transform:translateY(-9px); opacity:0;}}
  .wisp{animation:rise 3.4s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .wisp{animation:none; opacity:.5;} }
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">

      <h2>وصفات المشروبات</h2>

      <div class="sub-tabs" id="filter-tabs">
        <button class="sub-tab on" data-tab="all">الكل</button>
        <button class="sub-tab" data-tab="hot">🔥 ساخنة</button>
        <button class="sub-tab" data-tab="cold">🧊 باردة</button>

    </div>

      <h2 class="section-title">المشروبات الساخنة</h2>
      <div class="recipes-grid" id="grid-hot"></div>
    </div>

    <div id="cold-section">
      <h2 class="section-title">المشروبات الباردة</h2>
      <div class="recipes-grid" id="grid-cold"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    olvRenderNav("recipes");

    var GLASS_Y = {
      teaGlass: { top:[58,102], bot:[66,94], y0:55, y1:150 },
      tumbler:  { top:[52,108], bot:[60,100], y0:82, y1:155 },
      highball: { top:[56,104], bot:[60,100], y0:50, y1:160 }
    };

    function gradientDef(id,c1,c2){
      return '<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="'+c1+'"/>' +
        '<stop offset="1" stop-color="'+c2+'"/>' +
      '</linearGradient>';
    }

    function steamMarks(cx){
      function wisp(x,delay){
        return '<polyline class="wisp steam-line" style="animation-delay:'+delay+'s" points="'+
          (x-3)+',46 '+(x+4)+',34 '+(x-4)+',22 '+(x+3)+',9' +
          '" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>';
      }
      return '<g>'+wisp(cx-15,0)+wisp(cx,.6)+wisp(cx+15,1.1)+'</g>';
    }

    function iceCubes(cx,cy){
      return '<g>' +
        '<rect x="'+(cx-24)+'" y="'+(cy-6)+'" width="16" height="16" rx="3" transform="rotate(-12 '+(cx-16)+' '+(cy+2)+')" fill="rgba(255,255,255,.55)" stroke="rgba(255,255,255,.85)"/>' +
        '<rect x="'+(cx+6)+'" y="'+(cy-15)+'" width="15" height="15" rx="3" transform="rotate(9 '+(cx+13)+' '+(cy-7)+')" fill="rgba(255,255,255,.5)" stroke="rgba(255,255,255,.85)"/>' +
      '</g>';
    }

    function mintLeaf(x,y,rot){
      return '<g transform="translate('+x+' '+y+') rotate('+rot+')">' +
        '<ellipse rx="12" ry="6" fill="#5C9A50" stroke="#3E7133"/>' +
        '<line x1="-11" y1="0" x2="10" y2="0" stroke="#3E7133" stroke-width="1"/>' +
      '</g>';
    }

    function lemonWheel(x,y){
      var spokes = [0,60,120].map(function(a){
        var r = a*Math.PI/180;
        return '<line x1="0" y1="0" x2="'+(8*Math.cos(r)).toFixed(1)+'" y2="'+(8*Math.sin(r)).toFixed(1)+'" stroke="#D9B23C" stroke-width="1"/>';
      }).join('');
      return '<g transform="translate('+x+' '+y+')">' +
        '<circle r="12" fill="#F4D35E" stroke="#D9B23C"/>' +
        '<circle r="7.5" fill="#FBEBA6"/>' + spokes +
      '</g>';
    }

    function whippedCream(x,y){
      return '<g fill="#FFFBF2" stroke="#EADFC8">' +
        '<circle cx="'+(x-10)+'" cy="'+y+'" r="9"/>' +
        '<circle cx="'+x+'" cy="'+(y-6)+'" r="10"/>' +
        '<circle cx="'+(x+10)+'" cy="'+y+'" r="9"/>' +
      '</g>';
    }

    function sprinkle(x,y,color,n){
      var s='';
      for(var i=0;i<n;i++){
        s+='<circle cx="'+(x-13+i*5.5)+'" cy="'+(y+((i%2)?2:-2))+'" r="1.3" fill="'+color+'"/>';
      }
      return s;
    }

    function raisinsPine(x,y){
      return '<g>' +
        '<ellipse cx="'+(x-10)+'" cy="'+y+'" rx="3" ry="2.2" fill="#8B4B1F"/>' +
        '<ellipse cx="'+(x-2)+'" cy="'+(y+3)+'" rx="3" ry="2.2" fill="#8B4B1F"/>' +
        '<ellipse cx="'+(x+8)+'" cy="'+(y-1)+'" rx="2.2" ry="3.2" fill="#EFE3C3"/>' +
        '<ellipse cx="'+(x+14)+'" cy="'+(y+2)+'" rx="2.2" ry="3.2" fill="#EFE3C3"/>' +
      '</g>';
    }

    function strawLine(x1,y1,x2,y2,color){
      return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="6" stroke-linecap="round"/>';
    }

    function ceramicCup(d,gid){
      var tall = d.shape==='mug';
      var bx = tall?50:54, by = tall?55:70, bw = tall?60:52, bh = tall?90:55;
      var lx=bx+6, ly=by+8, lw=bw-12, lh=bh-14;
      var fr = d.foamRatio!==undefined ? d.foamRatio : 0.22;
      var foamH = d.foam ? Math.max(9,lh*fr) : 0;
      var out = '';
      if(!tall){
        out += '<ellipse cx="80" cy="'+(by+bh+8)+'" rx="46" ry="9" class="card-fill vessel-line" stroke-width="1.5"/>';
      }
      out += '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="10" class="vessel-fill vessel-line" stroke-width="2"/>';
      if(tall){
        out += '<path d="M'+(bx+bw-2)+','+(by+18)+' q24,2 24,25 q0,23 -24,25" fill="none" class="vessel-line" stroke-width="7" stroke-linecap="round"/>';
      }
      out += '<rect x="'+lx+'" y="'+(ly+foamH)+'" width="'+lw+'" height="'+(lh-foamH)+'" rx="6" fill="url(#'+gid+')"/>';
      if(d.foam){
        out += '<rect x="'+lx+'" y="'+ly+'" width="'+lw+'" height="'+foamH+'" rx="6" fill="'+d.foam+'"/>';
      }
      return { markup:out, cx:80, rimY:ly, baseY:by+bh };
    }

    function glassVessel(d,gid){
      var m = GLASS_Y[d.shape];
      var outer = m.top[0]+','+m.y0+' '+m.top[1]+','+m.y0+' '+m.bot[1]+','+m.y1+' '+m.bot[0]+','+m.y1;
      var inTop0=m.top[0]+4, inTop1=m.top[1]-4, inBot0=m.bot[0]+3, inBot1=m.bot[1]-3, inY0=m.y0+7, inY1=m.y1-4;
      var foamH = d.foam ? (d.foamH || 16) : 0;
      var liqTopY = inY0 + foamH;
      var inner = inTop0+','+liqTopY+' '+inTop1+','+liqTopY+' '+inBot1+','+inY1+' '+inBot0+','+inY1;
      var out = '<polygon points="'+outer+'" fill="none" class="glass-line" stroke-width="2"/>' +
        '<ellipse cx="'+((m.bot[0]+m.bot[1])/2)+'" cy="'+m.y1+'" rx="'+((m.bot[1]-m.bot[0])/2)+'" ry="4" fill="none" class="glass-line" stroke-width="1.4"/>' +
        '<polygon points="'+inner+'" fill="url(#'+gid+')"/>';
      if(d.foam){
        var foamPoly = inTop0+','+inY0+' '+inTop1+','+inY0+' '+(inTop1-2)+','+liqTopY+' '+(inTop0+2)+','+liqTopY;
        out += '<polygon points="'+foamPoly+'" fill="'+d.foam+'"/>';
      }
      return { markup:out, cx:(m.top[0]+m.top[1])/2, rimY:m.y0, baseY:m.y1 };
    }

    function illustrate(d){
      var gid = 'g-'+d.id;
      var isCup = d.shape==='mug' || d.shape==='demitasse';
      var v = isCup ? ceramicCup(d,gid) : glassVessel(d,gid);
      var extras = '';
      if(d.steam) extras += steamMarks(v.cx);
      if(d.ice) extras += iceCubes(v.cx, v.rimY+18);
      if(d.straw) extras += strawLine(v.cx+16, v.baseY-6, v.cx+2, v.rimY-30, d.straw);
      (d.garnish||[]).forEach(function(g){
        if(g==='mint') extras += mintLeaf(v.cx+7, v.rimY-3, -18);
        if(g==='lemon') extras += lemonWheel(v.cx-1, v.rimY-4);
        if(g==='cream') extras += whippedCream(v.cx, v.rimY-6);
        if(g==='cinnamon') extras += sprinkle(v.cx, v.rimY+9, '#8B4B1F', 6);
        if(g==='raisins') extras += raisinsPine(v.cx-8, v.rimY+16);
      });
      return '<svg viewBox="0 0 160 185" role="img" aria-label="رسم توضيحي لكوب '+d.name+'">' +
        '<defs>'+gradientDef(gid,d.c1,d.c2)+'</defs>' +
        v.markup + extras +
      '</svg>';
    }

    function card(d){
      var el = document.createElement('details');
      el.className = 'recipe-card ' + d.cat;
      if(d.open) el.open = true;
      el.innerHTML =
        '<summary>' +
          '<div class="art">'+illustrate(d)+'</div>' +
          '<div class="recipe-body">' +
            '<h3>'+d.name+'</h3>' +
            '<div class="recipe-en">'+d.en+'</div>' +
            '<p class="recipe-teaser">'+d.teaser+'</p>' +
            '<div class="recipe-meta"><span class="badge">'+d.time+'</span><span class="badge">'+d.level+'</span><span class="badge">'+d.yield+'</span></div>' +
          '</div>' +
          '<div class="recipe-toggle"><span>طريقة التحضير</span>' +
            '<svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</div>' +
        '</summary>' +
        '<div class="recipe-detail">' +
          '<h4>المكوّنات</h4>' +
          '<ul class="ingredients">'+d.ingredients.map(function(i){return '<li class="badge">'+i+'</li>';}).join('')+'</ul>' +
          '<h4>خطوات التحضير</h4>' +
          '<ol class="steps">'+d.steps.map(function(s,i){return '<li><span class="step-num">'+(i+1)+'</span><span class="txt">'+s+'</span></li>';}).join('')+'</ol>' +
        '</div>';
      return el;
    }

    function renderAll(){
      var hotWrap = document.getElementById('grid-hot');
      var coldWrap = document.getElementById('grid-cold');
      DRINKS.forEach(function(d){
        (d.cat==='hot' ? hotWrap : coldWrap).appendChild(card(d));
      });
    }

    document.querySelectorAll('#filter-tabs .sub-tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('#filter-tabs .sub-tab').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        var f = btn.dataset.tab;
        document.getElementById('hot-section').hidden = !(f==='all' || f==='hot');
        document.getElementById('cold-section').hidden = !(f==='all' || f==='cold');
      });
    });

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      renderAll();
    })();
