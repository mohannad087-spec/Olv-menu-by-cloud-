<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المطبخ — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f1e6">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاسبة OLV">
<script>
(function(){
  function computeTheme(){
    var mode = localStorage.getItem('olv_theme_mode_v2') || 'light';
    var hour = new Date().getHours();
    return mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
  }
  function applyCustomTheme(){
    var root = document.documentElement.style;
    var props = ['--ink', '--ink-2', '--ink-3', '--paper', '--muted', '--hair', '--hair-soft',
      '--overlay-bg', '--gold', '--gold-hi', '--gold-dp', '--gold-rgb', '--on-gold'];
    try {
      var raw = localStorage.getItem('olv_custom_theme_v2');
      var t = raw ? JSON.parse(raw) : null;
      if (!t) {
        props.forEach(function (p) { root.removeProperty(p); });
        return false;
      }
      document.documentElement.setAttribute('data-theme', t.isDark ? 'dark' : 'light');
      root.setProperty('--ink', t.ink);
      root.setProperty('--ink-2', t.ink2);
      root.setProperty('--ink-3', t.ink3);
      root.setProperty('--paper', t.paper);
      root.setProperty('--muted', t.muted);
      root.setProperty('--hair', t.hair);
      root.setProperty('--hair-soft', t.hairSoft);
      root.setProperty('--overlay-bg', t.overlayBg);
      root.setProperty('--gold', t.gold);
      root.setProperty('--gold-hi', t.goldHi);
      root.setProperty('--gold-dp', t.goldDp);
      root.setProperty('--gold-rgb', t.goldRgb);
      root.setProperty('--on-gold', t.onGold);
      return true;
    } catch (e) {
      props.forEach(function (p) { root.removeProperty(p); });
      return false;
    }
  }
  window.olvApplyTheme = function(){
    var theme = computeTheme();
    document.documentElement.setAttribute('data-theme', theme);
    window.olvCustomThemeActive = applyCustomTheme();
  };
  window.olvApplyTheme();
})();
</script>
<style>
  .sub-tabs{display:flex; gap:8px; margin-bottom:16px; align-items:center;}
  .sub-tab{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ink-2); border:1px solid var(--hair); color:var(--muted);
    padding:10px 18px; border-radius:999px; font-size:13px; min-height:44px;
  }
  .sub-tab.on{background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700;}
  .orders-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .order-card{
    background:var(--ink-2); border:1px solid var(--hair); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; box-shadow:var(--card-shadow); transition:.15s;
  }
  .order-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.12);}
  .order-card.overdue{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger), 0 8px 24px rgba(193,88,63,.15);}
  .order-card.overdue:hover{border-color:var(--danger);}
  .order-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .order-time-wrap{display:flex; align-items:baseline; gap:8px;}
  .order-time{font-family:'Tajawal',sans-serif; font-weight:800; font-size:21px; color:var(--gold-hi); font-weight:700;}
  .order-age{font-size:11.5px; color:var(--muted);}
  .order-age.overdue{color:var(--danger-hi); font-weight:700;}
  .order-age .icon{width:12px; height:12px; vertical-align:-1px;}
  .order-type-badge{
    font-size:12px; border:1px solid var(--hair); border-radius:999px; padding:3px 10px; color:var(--muted);
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .order-type-badge .icon{width:13px; height:13px;}
  .order-route{
    font-size:13.5px; font-weight:700; color:var(--gold-hi); margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .order-route .icon{width:14px; height:14px; flex:none;}
  .order-items{flex:1; margin-bottom:14px;}
  .order-line{padding:8px 0; border-bottom:1px solid var(--hair-soft,rgba(var(--gold-rgb),.1)); font-size:14px;}
  .order-line:last-child{border-bottom:none;}
  .order-line .qty-line{display:flex; align-items:center; gap:8px;}
  .order-line .order-qty-badge{
    flex:none; background:var(--gold); color:var(--on-gold);
    font-weight:700; font-size:12px; min-width:24px; height:22px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .order-line .item-name{font-weight:600;}
  .order-line .addons{color:var(--olive-hi,#9dab63); font-size:12.5px; margin-top:2px; margin-inline-start:32px;}
  .order-line .note{color:var(--danger-hi); font-size:12.5px; margin-top:2px; margin-inline-start:32px;}
  .order-line .note .icon{width:12px; height:12px; vertical-align:-1px;}
  .sub-tab .icon{width:15px; height:15px;}
  .k-btn{min-height:52px; font-size:16px; width:100%;}
  .k-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; margin-bottom:14px;
    background:var(--ink-2); border:1px solid var(--hair); border-radius:12px; padding:12px 14px;
    font:inherit; font-size:14px; color:var(--paper); text-align:start;
  }
  .k-bar[hidden]{display:none;}
  .k-bar .btn{margin-inline-start:auto;}
  .k-sound{border-color:var(--gold); color:var(--gold-hi); font-weight:700; cursor:pointer; min-height:48px;}
  .empty-state{color:var(--muted); text-align:center; padding:60px 0; grid-column:1/-1;}
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="sub-tabs">
      <button class="sub-tab on" data-tab="pending"><span id="sub-tab-icon-pending"></span> قيد التحضير <span id="k-count-pending"></span></button>
      <button class="sub-tab" data-tab="ready"><span id="sub-tab-icon-ready"></span> جاهز</button>
      <span class="hint" id="k-avg" hidden></span>
      <span class="hint" style="margin-inline-start:auto;">تحديث تلقائي كل 15 ثانية</span>
    </div>

    <button type="button" class="k-bar k-sound" id="k-sound" hidden>🔔 اضغط هون لتشغيل صوت الطلبات الجديدة</button>
    <div class="k-bar" id="k-stale" hidden>
      في <b id="k-stale-n">0</b> طلب قديم ما انعلّم «جاهز» (أقدم من 12 ساعة، مخفيين عن الشاشة)
      <button type="button" class="btn small" id="k-stale-btn">علّمهم جاهزين</button>
    </div>

    <div class="orders-grid" id="orders-grid">
      <div class="hint">جاري التحميل...</div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/offline-queue.js"></script>
  <script defer src="assets/supabase-client.js"></script>
  <script defer src="assets/auth-guard.js"></script>
  <script defer src="assets/layout.js"></script>
  <script defer src="assets/notify-sound.js"></script>
  <script defer src="assets/connection-status.js"></script>
  <script defer src="assets/incoming-orders-poll.js"></script>
  <script defer src="assets/low-stock-poll.js"></script>
  <script defer src="assets/menu-stock-sync.js"></script>
  <script defer src="assets/print-health.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    olvRenderNav("kitchen");
    document.getElementById("sub-tab-icon-pending").innerHTML = olvIcon("hourglass");
    document.getElementById("sub-tab-icon-ready").innerHTML = olvIcon("checkCircle");

    const PENDING_STATUS = "قيد التحضير";
    const READY_STATUS = "جاهز";
    const WINDOW_HOURS = 12; // الشاشة بتعرض طلبات آخر 12 ساعة بس؛ الأقدم «عالقة» وبتنعرض كتنبيه لحالها
    const OVERDUE_MIN = 15;
    const errBox = document.getElementById("err");
    const grid = document.getElementById("orders-grid");
    let activeTab = "pending";
    let knownPendingIds = null; // null = لسا ما انعمل الأساس (baseline) الأول
    let pendingNos = new Map();  // id → رقم الطلب، حتى نعرف شو انلغى
    let staleIds = [];
    let busy = false;

    const since = () => new Date(Date.now() - WINDOW_HOURS * 3600e3).toISOString();
    // الأصناف الملغاة (void_sale_item) ما بتنعرض للمطبخ، والطلب اللي كل أصنافه ملغاة بيختفي
    const liveItems = (o) => (o.sale_items || []).filter((it) => it.status !== "voided");

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", numberingSystem: "latn" });
    }
    function minutesSince(ts) {
      return (Date.now() - new Date(ts).getTime()) / 60000;
    }

    // المتصفح ما بيشغّل صوت قبل أول لمسة عالصفحة: منبيّن شريط لحد ما ينضغط، حتى ما يفوت المطبخ صوت طلب
    const soundBar = document.getElementById("k-sound");
    function refreshSoundBar() {
      const c = typeof OlvSound !== "undefined" ? OlvSound.ensureContext() : null;
      soundBar.hidden = !c || c.state === "running";
    }
    soundBar.addEventListener("click", () => { OlvSound.ensureContext(); setTimeout(refreshSoundBar, 200); });
    document.addEventListener("click", () => setTimeout(refreshSoundBar, 200));

    // الشاشة تضل شغّالة (تابلت المطبخ ما ينطفي) — إذا المتصفح بيدعمها
    let wakeLock = null;
    async function keepAwake() {
      try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); poll(); } });

    // طلبات قيد التحضير (مستقل عن التبويب المفتوح): صوت للجديد، وتنبيه إذا طلب كان عالشاشة وانلغى
    async function checkPending(rows) {
      const current = new Map(rows.map((o) => [o.id, o.order_no]));
      if (knownPendingIds !== null) {
        let hasNew = false;
        current.forEach((_, id) => { if (!knownPendingIds.has(id)) hasNew = true; });
        if (hasNew && typeof OlvSound !== "undefined") OlvSound.playNewOrder();
        const gone = [...knownPendingIds].filter((id) => !current.has(id));
        if (gone.length) {
          const { data } = await window.supabaseClient.from("sales_entries").select("id, order_no").in("id", gone).eq("status", "voided");
          (data || []).forEach((o) => {
            olvToast(`طلب ${o.order_no ? "#" + o.order_no : ""} انلغى — وقّف تحضيره`, { type: "danger", ms: 15000 });
            if (typeof OlvSound !== "undefined") OlvSound.playError();
          });
        }
      }
      knownPendingIds = new Set(current.keys());
      pendingNos = current;
    }

    function cardHtml(o) {
      const pending = activeTab === "pending";
      const ageMinutes = Math.floor(minutesSince(o.created_at));
      const overdue = pending && ageMinutes > OVERDUE_MIN;
      const isDelivery = o.order_type === "توصيل";
      return `
        <div class="order-card${overdue ? " overdue" : ""}" data-row-id="${olvEsc(o.id)}">
          <div class="order-head">
            <div class="order-time-wrap">
              <span class="order-time">${o.order_no ? `#${olvEsc(o.order_no)} · ` : ""}${formatTime(o.created_at)}</span>
              ${!pending && prepMinutes(o) !== null ? `<span class="order-age">تحضّر بـ ${prepMinutes(o)} د</span>` : ""}
              ${pending ? `<span class="order-age${overdue ? " overdue" : ""}">${overdue ? olvIcon("clock") + " " : ""}قبل ${ageMinutes} د</span>` : ""}
            </div>
            ${o.order_type ? `<span class="order-type-badge">${isDelivery ? olvIcon("mapPin") : olvIcon("dineIn")} ${olvEsc(o.order_type)}</span>` : ""}
          </div>
          ${o.customer_name ? `<div class="order-route">${olvIcon("person")} ${olvEsc(o.customer_name)}</div>` : ""}
          ${o.table_number ? `<div class="order-route">${olvIcon("grid")} طاولة رقم ${olvEsc(o.table_number)}</div>` : ""}
          <div class="order-items">
            ${o.items.map((it) => `
              <div class="order-line">
                <div class="qty-line">
                  <span class="order-qty-badge">${olvEsc(it.qty)}×</span>
                  <span class="item-name">${olvEsc(it.product_name)}</span>
                </div>
                ${it.addons_summary ? `<div class="addons">+ ${olvEsc(it.addons_summary)}</div>` : ""}
                ${it.note ? `<div class="note">${olvIcon("note")} ${olvEsc(it.note)}</div>` : ""}
              </div>
            `).join("")}
          </div>
          <button class="btn ${pending ? "gold" : ""} k-btn" data-id="${olvEsc(o.id)}" data-next="${pending ? READY_STATUS : PENDING_STATUS}">
            ${pending ? olvIcon("check") + " تم التجهيز" : olvIcon("undo") + " إرجاع لقيد التحضير"}
          </button>
        </div>
      `;
    }

    // تتبّع التذاكر الجديدة لكل تبويب (بيتصفّر لما الكاشير يبدّل التبويب حتى ما تتحرك كل البطاقات)
    let kTracker = olvNewTracker(), kTrackerTab = null;
    // «جاهز»: مع وقت الجاهزية (kitchen_ready_at من schema-kitchen-ready.sql) — وإذا العمود لسا مش موجود منكمّل بدونه
    let hasReadyAt = true;
    async function loadReady(sel) {
      const q = (cols) => window.supabaseClient.from("sales_entries").select(cols)
        .eq("kitchen_status", READY_STATUS).eq("status", "completed").gte("created_at", since())
        .order("created_at", { ascending: false }).limit(60);
      if (hasReadyAt) {
        const r = await q(sel + ", kitchen_ready_at");
        if (!r.error) return r;
        if (r.error.code !== "42703" && !/kitchen_ready_at/.test(r.error.message || "")) return r;
        hasReadyAt = false;
      }
      return q(sel);
    }
    const prepMinutes = (o) => (o.kitchen_ready_at ? Math.max(0, Math.round((new Date(o.kitchen_ready_at) - new Date(o.created_at)) / 60000)) : null);

    async function poll() {
      if (busy) return;
      busy = true;
      try {
        const sel = "id, order_no, created_at, order_type, customer_name, table_number, sale_items(id, qty, product_name, addons_summary, note, status)";
        // قيد التحضير: دايمًا (للصوت والتنبيهات)، من الأقدم للأحدث ضمن آخر 12 ساعة — هيك الحد ما بيقص الطلبات الجديدة
        const [pRes, rRes, sRes] = await Promise.all([
          window.supabaseClient.from("sales_entries").select(sel)
            .eq("kitchen_status", PENDING_STATUS).eq("status", "completed").gte("created_at", since())
            .order("created_at", { ascending: true }).limit(100),
          activeTab === "ready" ? loadReady(sel) : Promise.resolve({ data: null, error: null }),
          window.supabaseClient.from("sales_entries").select("id")
            .eq("kitchen_status", PENDING_STATUS).eq("status", "completed").lt("created_at", since()).limit(200),
        ]);
        if (pRes.error) throw pRes.error;
        if (rRes.error) throw rRes.error;
        const shape = (rows) => (rows || []).map((o) => ({ ...o, items: liveItems(o) })).filter((o) => o.items.length);
        const pending = shape(pRes.data);
        await checkPending(pending);
        staleIds = (sRes.data || []).map((o) => o.id);
        const staleBar = document.getElementById("k-stale");
        staleBar.hidden = !staleIds.length;
        document.getElementById("k-stale-n").textContent = staleIds.length;
        document.getElementById("k-count-pending").textContent = pending.length ? `(${pending.length})` : "";
        errBox.textContent = "";

        const orders = activeTab === "pending" ? pending : shape(rRes.data);
        const times = activeTab === "ready" ? orders.map(prepMinutes).filter((m) => m !== null) : [];
        const avgEl = document.getElementById("k-avg");
        avgEl.hidden = !times.length;
        if (times.length) avgEl.textContent = `متوسط التحضير: ${Math.round(times.reduce((a, b) => a + b, 0) / times.length)} د (${times.length} طلب)`;
        if (kTrackerTab !== activeTab) { kTracker = olvNewTracker(); kTrackerTab = activeTab; }
        const freshTickets = kTracker.diff(orders.map((o) => o.id));
        grid.innerHTML = orders.length
          ? orders.map(cardHtml).join("")
          : `<div class="empty-state">لا يوجد طلبات ${activeTab === "pending" ? "قيد التحضير" : "جاهزة"} حاليًا</div>`;
        olvMarkNew(grid, freshTickets);
      } catch (err) {
        olvShowError(errBox, err);
      } finally {
        busy = false;
      }
    }

    // زر واحد لكل البطاقات (بدل مستمع لكل زر مع كل تحديث)
    grid.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      const { error } = await window.supabaseClient
        .rpc("set_kitchen_status", { p_sale_id: btn.dataset.id, p_status: btn.dataset.next });
      if (error) { olvShowError(errBox, error); btn.disabled = false; return; }
      if (btn.dataset.next === READY_STATUS) {
        if (typeof OlvSound !== "undefined") OlvSound.playOrderReady();
        knownPendingIds && knownPendingIds.delete(btn.dataset.id); // مش إلغاء — ما في داعي لتنبيه
      }
      const card = btn.closest(".order-card");
      if (card) card.remove();
      poll();
    });

    document.getElementById("k-stale-btn").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!staleIds.length || !confirm(`تعليم ${staleIds.length} طلب قديم (أقدم من ${WINDOW_HOURS} ساعة) كـ«جاهز»؟`)) return;
      btn.disabled = true;
      for (const id of staleIds) {
        const { error } = await window.supabaseClient.rpc("set_kitchen_status", { p_sale_id: id, p_status: READY_STATUS });
        if (error) { olvShowError(errBox, error); break; }
      }
      btn.disabled = false;
      poll();
    });

    document.querySelectorAll(".sub-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sub-tab").forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        activeTab = btn.dataset.tab;
        poll();
      });
    });

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      refreshSoundBar();
      keepAwake();
      await poll();
      setInterval(poll, 15000);
    })();
    });
  </script>
  <footer class="olv-footer">© 2026 مهند — جميع الحقوق محفوظة</footer>
</body>
</html>
