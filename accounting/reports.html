<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #print-area{display:none;}
  @media print {
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block; position:absolute; inset:0 0 auto 0; padding:24px; background:#fff; color:#111;}
    #print-area h1{font-size:20px; margin-bottom:2px;}
    #print-area .range{color:#555; font-size:13px; margin-bottom:18px;}
    #print-area table{width:100%; border-collapse:collapse; margin-bottom:22px;}
    #print-area th, #print-area td{border:1px solid #ccc; padding:6px 8px; text-align:right; font-size:13px;}
    #print-area th{background:#f2f2f2;}
    #print-area .totals td{font-weight:700;}
  }
</style>
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div id="print-area">
      <h1>تقرير الأرباح والخسائر — OLV</h1>
      <div class="range" id="print-range"></div>
      <table>
        <tbody>
          <tr><td>إجمالي المبيعات</td><td id="print-sales"></td></tr>
          <tr><td>إجمالي المصروفات</td><td id="print-expenses"></td></tr>
          <tr class="totals"><td>صافي الربح</td><td id="print-net"></td></tr>
        </tbody>
      </table>
      <table>
        <thead><tr><th>طريقة الدفع</th><th>المبلغ</th></tr></thead>
        <tbody id="print-payment-body"></tbody>
      </table>
      <table>
        <thead><tr><th>تصنيف المصروف</th><th>المبلغ</th></tr></thead>
        <tbody id="print-category-body"></tbody>
      </table>
    </div>

    <div class="group">
      <h2>تقرير الأرباح والخسائر</h2>
      <div class="row2">
        <div class="field">
          <label>من تاريخ</label>
          <input type="date" id="from_date">
        </div>
        <div class="field">
          <label>إلى تاريخ</label>
          <input type="date" id="to_date">
        </div>
      </div>
      <button class="btn gold" id="run-btn">عرض التقرير</button>
      <button class="btn" id="pdf-btn">⬇ تصدير PDF</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">إجمالي المبيعات</div>
        <div class="value" id="r-sales">—</div>
      </div>
      <div class="stat">
        <div class="label">إجمالي المصروفات</div>
        <div class="value" id="r-expenses">—</div>
      </div>
      <div class="stat">
        <div class="label">صافي الربح</div>
        <div class="value" id="r-net">—</div>
      </div>
    </div>

    <div class="group">
      <h2>المبيعات حسب طريقة الدفع</h2>
      <div class="bars" id="payment-bars"></div>
    </div>

    <div class="group">
      <h2>المصروفات حسب التصنيف</h2>
      <div class="bars" id="category-bars"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    olvRenderNav("reports");

    function renderBars(containerId, items) {
      const el = document.getElementById(containerId);
      if (!items.length) {
        el.innerHTML = `<div class="hint">لا يوجد بيانات في هذه الفترة</div>`;
        return;
      }
      const max = Math.max(...items.map((i) => i.value), 1);
      el.innerHTML = items.map((i) => `
        <div class="bar-row">
          <div class="bar-label">${i.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(i.value / max) * 100}%"></div></div>
          <div class="bar-value">${olvFormatMoney(i.value)}</div>
        </div>
      `).join("");
    }

    let lastReport = null;

    async function runReport() {
      const errBox = document.getElementById("err");
      errBox.style.display = "none";
      const from = document.getElementById("from_date").value;
      const to = document.getElementById("to_date").value;
      try {
        const { data: sales, error: e1 } = await window.supabaseClient
          .from("sales_entries").select("*").gte("entry_date", from).lte("entry_date", to);
        if (e1) throw e1;

        const { data: expenses, error: e2 } = await window.supabaseClient
          .from("expenses").select("amount, expense_categories(name)")
          .gte("expense_date", from).lte("expense_date", to);
        if (e2) throw e2;

        const cash = (sales || []).reduce((s, r) => s + Number(r.cash_amount), 0);
        const card = (sales || []).reduce((s, r) => s + Number(r.card_amount), 0);
        const delivery = (sales || []).reduce((s, r) => s + Number(r.delivery_amount), 0);
        const totalSales = cash + card + delivery;
        const totalExpenses = (expenses || []).reduce((s, r) => s + Number(r.amount), 0);
        const net = totalSales - totalExpenses;

        document.getElementById("r-sales").textContent = olvFormatMoney(totalSales);
        document.getElementById("r-expenses").textContent = olvFormatMoney(totalExpenses);
        const netEl = document.getElementById("r-net");
        netEl.textContent = olvFormatMoney(net);
        netEl.className = "value " + (net >= 0 ? "good" : "bad");

        renderBars("payment-bars", [
          { label: "كاش", value: cash },
          { label: "شبكة / فيزا", value: card },
          { label: "توصيل / تطبيقات", value: delivery },
        ]);

        const byCategory = {};
        (expenses || []).forEach((r) => {
          const name = r.expense_categories ? r.expense_categories.name : "بدون تصنيف";
          byCategory[name] = (byCategory[name] || 0) + Number(r.amount);
        });
        const catItems = Object.entries(byCategory)
          .map(([label, value]) => ({ label, value }))
          .sort((a, b) => b.value - a.value);
        renderBars("category-bars", catItems);

        lastReport = {
          from, to, totalSales, totalExpenses, net,
          payment: [
            { label: "كاش", value: cash },
            { label: "شبكة / فيزا", value: card },
            { label: "توصيل / تطبيقات", value: delivery },
          ],
          categories: catItems,
        };
      } catch (err) {
        olvShowError(errBox, err);
      }
    }

    function exportPdf() {
      if (!lastReport) return;
      const r = lastReport;
      document.getElementById("print-range").textContent = `من ${r.from} إلى ${r.to}`;
      document.getElementById("print-sales").textContent = olvFormatMoney(r.totalSales);
      document.getElementById("print-expenses").textContent = olvFormatMoney(r.totalExpenses);
      document.getElementById("print-net").textContent = olvFormatMoney(r.net);
      document.getElementById("print-payment-body").innerHTML = r.payment
        .map((i) => `<tr><td>${i.label}</td><td>${olvFormatMoney(i.value)}</td></tr>`).join("");
      document.getElementById("print-category-body").innerHTML = r.categories.length
        ? r.categories.map((i) => `<tr><td>${i.label}</td><td>${olvFormatMoney(i.value)}</td></tr>`).join("")
        : `<tr><td colspan="2">لا يوجد مصروفات في هذه الفترة</td></tr>`;
      window.print();
    }

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      const today = new Date();
      const firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      document.getElementById("from_date").value = firstOfMonth.toISOString().slice(0, 10);
      document.getElementById("to_date").value = olvToday();
      document.getElementById("run-btn").addEventListener("click", runReport);
      document.getElementById("pdf-btn").addEventListener("click", exportPdf);
      await runReport();
    })();
  </script>
</body>
</html>
