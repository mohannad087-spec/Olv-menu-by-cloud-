<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم منيو OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0a09; --ink-2:#131209; --ink-3:#1a1810;
  --gold:#c9a24b; --gold-hi:#f2dca6; --olive:#8a9a52;
  --paper:#ece5d5; --muted:#95897a; --hair:rgba(201,162,75,.25);
  --danger:#c1583f; --ok:#7c8a4a;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:'Tajawal',sans-serif; padding:0 0 90px;
}
.top{
  position:sticky; top:0; z-index:30; background:rgba(10,10,9,.94);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--hair);
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.top h1{
  font-family:'Cormorant Garamond',serif; font-size:20px; letter-spacing:3px;
  color:var(--gold-hi); margin:0; font-weight:600;
}
.top h1 span{color:var(--muted); font-size:12px; letter-spacing:1px; font-family:'Tajawal',sans-serif; display:block; margin-top:2px;}
.top .actions{display:flex; gap:8px; flex-wrap:wrap;}
button{ font-family:'Tajawal',sans-serif; cursor:pointer; }
.btn{
  border:1px solid var(--hair); background:transparent; color:var(--paper);
  padding:9px 15px; border-radius:8px; font-size:13px; transition:.2s;
}
.btn:hover{border-color:var(--gold); color:var(--gold-hi);}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#100e08; font-weight:700; border:none;}
.btn.gold:hover{filter:brightness(1.06);}
.btn.danger{border-color:rgba(193,88,63,.4); color:#e0a190;}
.btn.danger:hover{border-color:var(--danger); color:#f0b7a8;}
.btn.small{padding:6px 11px; font-size:12px;}
input[type=file]{display:none;}

.wrap{max-width:960px; margin:0 auto; padding:22px 20px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
.field input{
  width:100%; background:var(--ink-2); border:1px solid var(--hair); color:var(--paper);
  padding:10px 12px; border-radius:8px; font-size:14px; font-family:'Tajawal',sans-serif;
}
.field input:focus{outline:none; border-color:var(--gold);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:560px){.row2{grid-template-columns:1fr;}}

.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:22px;}
.tabs button{
  flex:none; background:var(--ink-2); border:1px solid var(--hair); color:var(--muted);
  padding:9px 16px; border-radius:999px; font-size:13px; white-space:nowrap;
}
.tabs button.on{background:var(--gold); color:#100e08; border-color:var(--gold); font-weight:700;}
.tabs .addfam{color:var(--gold); border-style:dashed;}

.group{
  background:var(--ink-2); border:1px solid var(--hair); border-radius:12px;
  padding:16px 16px 10px; margin-bottom:18px;
}
.group-top{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.group-top input{flex:1;}
.item{
  background:var(--ink-3); border:1px solid rgba(255,255,255,.05); border-radius:9px;
  padding:12px; margin-bottom:10px;
}
.item-grid{display:grid; grid-template-columns:56px 1fr 1fr 90px 34px; gap:8px; align-items:center;}
@media(max-width:680px){.item-grid{grid-template-columns:44px 1fr 1fr; } .item-grid .rm{grid-column:3; justify-self:end;} .item-grid .price{grid-column:1/3;}}
.item-grid input{
  background:var(--ink); border:1px solid rgba(255,255,255,.08); color:var(--paper);
  padding:8px 10px; border-radius:6px; font-size:13px;
}
.item-grid input.price{text-align:center;}
.thumb-upload{
  width:56px; height:56px; border-radius:8px; border:1px dashed var(--hair);
  background:var(--ink) center/cover no-repeat; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:18px; cursor:pointer; overflow:hidden; position:relative; flex:none;
}
.thumb-upload:hover{border-color:var(--gold); color:var(--gold);}
.thumb-upload input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.thumb-upload .x{
  position:absolute; top:2px; inset-inline-end:2px; width:16px; height:16px; border-radius:50%;
  background:rgba(0,0,0,.6); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center;
  z-index:2;
}
.item-desc-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-top:8px; align-items:center;}
.item-desc-row input{
  background:var(--ink); border:1px solid rgba(255,255,255,.06); color:var(--muted);
  padding:7px 10px; border-radius:6px; font-size:12px;
}
.badge-select{
  background:var(--ink); border:1px solid rgba(255,255,255,.08); color:var(--paper);
  padding:7px 10px; border-radius:6px; font-size:12px; font-family:'Tajawal',sans-serif;
}
.rm{
  background:none; border:1px solid rgba(193,88,63,.35); color:#e0a190;
  width:34px; height:34px; border-radius:7px; font-size:16px; line-height:1;
}
.rm:hover{background:var(--danger); color:#fff; border-color:var(--danger);}
.addbtn{
  width:100%; background:none; border:1px dashed var(--hair); color:var(--gold);
  padding:10px; border-radius:8px; font-size:12.5px; margin-top:4px;
}
.addbtn:hover{border-color:var(--gold); background:rgba(201,162,75,.06);}
.grouphead-rm{
  background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline;
  padding:0; margin-inline-start:auto;
}
.grouphead-rm:hover{color:#e0a190;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--gold); color:#100e08; padding:11px 22px; border-radius:999px;
  font-size:13px; font-weight:700; opacity:0; transition:.3s; z-index:50; pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.hint{color:var(--muted); font-size:12.5px; line-height:1.9; background:var(--ink-2); border:1px solid var(--hair); border-radius:10px; padding:14px 16px; margin-bottom:20px;}
.hint b{color:var(--gold-hi);}
h2.sectitle{
  font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--gold); letter-spacing:1px;
  margin:0 0 10px; font-weight:600;
}
</style>
</head>
<body>

<div class="top">
  <h1>OLV <span>لوحة تحكم المنيو</span></h1>
  <div class="actions">
    <label class="btn small" for="importFile">📂 استيراد ملف منيو</label>
    <input type="file" id="importFile" accept=".html">
    <button class="btn small" onclick="preview()">👁 معاينة</button>
    <button class="btn gold small" onclick="exportMenu()">⬇ تنزيل المنيو المحدّث</button>
  </div>
</div>

<div class="wrap">

  <div class="hint">
    <b>كيف تشتغل الأداة:</b> عدّل أي اسم أو سعر أو وصف تحت — التعديل بيتخزّن مباشرة. لما تخلص، اضغط
    <b>"تنزيل المنيو المحدّث"</b> فينزل عندك ملف <b>olv-menu.html</b> جديد بكل التعديلات — اسحبه على نفس مكان الاستضافة
    (Netlify) بدل الملف القديم وخلص. الأداة ما بترفع شي عالإنترنت وحدها.
  </div>

  <div class="row2">
    <div class="field">
      <label>رقم واتساب المطعم (مع كود الدولة، بدون + أو مسافات)</label>
      <input id="wa" placeholder="962790000000">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="groups"></div>

</div>

<div class="toast" id="toast"></div>

let DATA = null;
let LOGO_B64 = DEFAULT_LOGO_B64;
let WA = "962790000000";
let activeFam = 0;

function decodeTemplate(){ return decodeURIComponent(escape(atob(TEMPLATE_B64))); }

function defaultData(){
  const tpl = decodeTemplate();
  const m = tpl.match(/const DATA = (\[[\s\S]*?\n\]);\n\nlet lang/);
  return JSON.parse(
    m[1]
      .replace(/(\w+):/g, '"$1":')          // unquoted keys -> quoted
      .replace(/,(\s*[\]}])/g, '$1')        // trailing commas
  );
}

function init(){
  try{ DATA = defaultData(); }
  catch(e){ DATA = []; console.error(e); }
  document.getElementById('wa').value = WA;
  render();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- render ---------------- */
function render(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DATA.map((f,i)=>`
    <button class="${i===activeFam?'on':''}" onclick="selFam(${i})">${f.ar || '(بدون اسم)'}</button>
  `).join('') + `<button class="addfam" onclick="addFam()">+ فئة رئيسية</button>`;

  const wrap = document.getElementById('groups');
  const fam = DATA[activeFam];
  if(!fam){ wrap.innerHTML=''; return; }

  wrap.innerHTML = `
    <div class="row2" style="margin-bottom:18px;">
      <div class="field"><label>اسم الفئة (عربي)</label><input value="${esc(fam.ar)}" oninput="fam.ar=this.value; renderTabsOnly();" data-bind></div>
      <div class="field"><label>Category name (English)</label><input value="${esc(fam.en)}" oninput="fam.en=this.value;"></div>
    </div>
    <button class="btn danger small" style="margin-bottom:18px;" onclick="delFam()">🗑 حذف هذه الفئة الرئيسية</button>
    ${fam.groups.map((g,gi)=>groupHtml(fam,g,gi)).join('')}
    <button class="addbtn" onclick="addGroup(fam)">+ إضافة قسم فرعي جديد</button>
  `;
  bindFamInputs(fam);
}

function groupHtml(fam,g,gi){
  return `
  <div class="group">
    <div class="group-top">
      <input value="${esc(g.ar)}" placeholder="اسم القسم (عربي)" data-fam-g="${gi}-ar">
      <input value="${esc(g.en)}" placeholder="Section name (English)" data-fam-g="${gi}-en">
      <button class="grouphead-rm" onclick="delGroup(${gi})">حذف القسم</button>
    </div>
    ${g.items.map((it,ii)=>itemHtml(gi,it,ii)).join('')}
    <button class="addbtn" onclick="addItem(${gi})">+ إضافة صنف لهذا القسم</button>
  </div>`;
}

function itemHtml(gi,it,ii){
  const hasImg = !!it.img;
  return `
  <div class="item">
    <div class="item-grid">
      <label class="thumb-upload" style="${hasImg?`background-image:url('${it.img}')`:''}">
        ${hasImg?`<span class="x" onclick="event.preventDefault();rmImg(${gi},${ii})">×</span>`:'📷'}
        <input type="file" accept="image/*" onchange="setImg(this,${gi},${ii})">
      </label>
      <input value="${esc(it.ar)}" placeholder="اسم الصنف (عربي)" data-item="${gi}-${ii}-ar">
      <input value="${esc(it.en)}" placeholder="Item name (English)" data-item="${gi}-${ii}-en">
      <input class="price" type="number" step="0.05" value="${it.p}" placeholder="السعر" data-item="${gi}-${ii}-p">
      <button class="rm" onclick="delItem(${gi},${ii})">×</button>
    </div>
    <div class="item-desc-row">
      <input value="${esc(it.dAr||'')}" placeholder="وصف مختصر (اختياري)" data-item="${gi}-${ii}-dAr">
      <input value="${esc(it.dEn||'')}" placeholder="Short description (optional)" data-item="${gi}-${ii}-dEn">
      <select class="badge-select" data-item="${gi}-${ii}-badge">
        <option value="" ${!it.badge?'selected':''}>بدون شارة</option>
        <option value="best" ${it.badge==='best'?'selected':''}>الأكثر طلباً</option>
        <option value="new" ${it.badge==='new'?'selected':''}>جديد</option>
        <option value="spicy" ${it.badge==='spicy'?'selected':''}>حار 🔥</option>
      </select>
    </div>
  </div>`;
}

function setImg(input,gi,ii){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    // downscale to keep file size reasonable
    const img = new Image();
    img.onload = ()=>{
      const maxW = 240;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      DATA[activeFam].groups[gi].items[ii].img = canvas.toDataURL('image/jpeg',0.72);
      render();
      toast('تمت إضافة الصورة ✓');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function rmImg(gi,ii){
  delete DATA[activeFam].groups[gi].items[ii].img;
  render();
}

function esc(s){ return String(s??'').replace(/"/g,'&quot;'); }

function bindFamInputs(fam){
  document.querySelectorAll('[data-fam-g]').forEach(inp=>{
    inp.oninput = ()=>{
      const [gi,field] = inp.dataset.famG.split('-');
      fam.groups[+gi][field] = inp.value;
      if(field==='ar') renderTabsOnly();
    };
  });
  document.querySelectorAll('[data-item]').forEach(inp=>{
    const handler = ()=>{
      const [gi,ii,field] = inp.dataset.item.split('-');
      let v = inp.value;
      if(field==='p') v = parseFloat(v||0);
      fam.groups[+gi].items[+ii][field] = v;
    };
    inp.oninput = handler;
    inp.onchange = handler;
  });
}

function renderTabsOnly(){
  document.getElementById('tabs').querySelectorAll('button:not(.addfam)').forEach((b,i)=>{
    b.textContent = DATA[i].ar || '(بدون اسم)';
  });
}

/* ---------------- structural edits ---------------- */
function selFam(i){ activeFam=i; render(); }

function addFam(){
  DATA.push({ id:'fam-'+Date.now(), ar:'فئة جديدة', en:'New Category', groups:[
    { id:'g-'+Date.now(), ar:'قسم جديد', en:'New Section', items:[] }
  ]});
  activeFam = DATA.length-1;
  render(); toast('تمت إضافة فئة جديدة');
}
function delFam(){
  if(!confirm('حذف هذه الفئة الرئيسية بكل أقسامها؟')) return;
  DATA.splice(activeFam,1);
  activeFam = Math.max(0, activeFam-1);
  render(); toast('تم الحذف');
}
function addGroup(fam){
  fam.groups.push({ id:'g-'+Date.now(), ar:'قسم جديد', en:'New Section', items:[] });
  render(); toast('تمت إضافة قسم');
}
function delGroup(gi){
  if(!confirm('حذف هذا القسم بكل أصنافه؟')) return;
  DATA[activeFam].groups.splice(gi,1);
  render(); toast('تم الحذف');
}
function addItem(gi){
  DATA[activeFam].groups[gi].items.push({ar:'صنف جديد',en:'New Item',dAr:'',dEn:'',p:0});
  render(); toast('تمت إضافة صنف');
}
function delItem(gi,ii){
  DATA[activeFam].groups[gi].items.splice(ii,1);
  render(); toast('تم الحذف');
}

/* ---------------- import ---------------- */
document.getElementById('importFile').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const html = reader.result;
      const dm = html.match(/const DATA = (\[[\s\S]*?\n\]);\n\nlet lang/);
      const wm = html.match(/const WHATSAPP_NUMBER = "([^"]*)";/);
      const lm = html.match(/data:image\/png;base64,([A-Za-z0-9+/=]+)"/);
      if(dm) DATA = new Function('return ' + dm[1])();
      if(wm){ WA = wm[1]; document.getElementById('wa').value = WA; }
      if(lm) LOGO_B64 = lm[1];
      activeFam = 0;
      render();
      toast('تم استيراد المنيو بنجاح ✓');
    }catch(err){
      console.error(err);
      alert('تعذّر قراءة هذا الملف. تأكد أنه ملف منيو OLV الأصلي.');
    }
  };
  reader.readAsText(file);
});

/* ---------------- build final file ---------------- */
function buildHtml(){
  WA = document.getElementById('wa').value.trim() || WA;
  let tpl = decodeTemplate();
  tpl = tpl.replace(/const DATA = \[[\s\S]*?\n\];\n\nlet lang/, 'const DATA = ' + JSON.stringify(DATA,null,1) + ';\n\nlet lang');
  tpl = tpl.replace(/const WHATSAPP_NUMBER = "[^"]*";/, `const WHATSAPP_NUMBER = "${WA}";`);
  tpl = tpl.replace('LOGO_SRC', 'data:image/png;base64,'+LOGO_B64);
  return tpl;
}

function exportMenu(){
  const html = buildHtml();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'olv-menu.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تنزيل الملف ✓');
}

function preview(){
  const html = buildHtml();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

init();
</script>
