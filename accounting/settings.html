<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات — محاسبة OLV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div id="olv-nav"></div>
  <div class="wrap">
    <div class="err" id="err"></div>

    <div class="group">
      <h2>تصنيفات المصروفات</h2>
      <form id="cat-form" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
        <div class="field" style="flex:1; min-width:200px; margin-bottom:0;">
          <label>تصنيف جديد</label>
          <input type="text" id="cat-name" placeholder="مثال: توصيل ونقل" required>
        </div>
        <button type="submit" class="btn gold">إضافة</button>
      </form>
      <div class="table-wrap" style="margin-top:16px;">
        <table>
          <thead><tr><th>التصنيف</th><th></th></tr></thead>
          <tbody id="cat-body">
            <tr class="empty-row"><td colspan="2">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="group">
      <h2>حسابي</h2>
      <p class="hint" id="me-info">جاري التحميل...</p>
      <p class="hint">
        لإضافة مستخدم جديد (كاشير / مدير): افتح Supabase Dashboard → Authentication → Add user،
        بعدها عدّل دوره من جدول <code>profiles</code> لو محتاج صلاحية أعلى من "staff".
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/auth-guard.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    olvRenderNav("settings");

    async function loadCategories() {
      const errBox = document.getElementById("err");
      const body = document.getElementById("cat-body");
      try {
        const { data, error } = await window.supabaseClient
          .from("expense_categories").select("*").order("name");
        if (error) throw error;
        if (!data || !data.length) {
          body.innerHTML = `<tr class="empty-row"><td colspan="2">لا يوجد تصنيفات</td></tr>`;
          return;
        }
        body.innerHTML = data.map((c) => `
          <tr>
            <td>${c.name}</td>
            <td><button class="btn small danger" data-id="${c.id}">حذف</button></td>
          </tr>
        `).join("");
        body.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("حذف هذا التصنيف؟ (لن يمسح المصروفات المسجّلة عليه)")) return;
            const { error } = await window.supabaseClient
              .from("expense_categories").delete().eq("id", btn.dataset.id);
            if (error) { olvShowError(errBox, error); return; }
            loadCategories();
          });
        });
      } catch (err) {
        olvShowError(errBox, err);
      }
    }

    (async () => {
      const session = await olvRequireAuth();
      if (!session) return;
      document.getElementById("me-info").textContent = `مسجّل دخول بحساب: ${session.user.email}`;
      await loadCategories();
    })();

    document.getElementById("cat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("err");
      errBox.style.display = "none";
      const input = document.getElementById("cat-name");
      const name = input.value.trim();
      if (!name) return;
      try {
        const { error } = await window.supabaseClient.from("expense_categories").insert({ name });
        if (error) throw error;
        input.value = "";
        await loadCategories();
      } catch (err) {
        olvShowError(errBox, err);
      }
    });
  </script>
</body>
</html>
